keys:
  - &server age15g8wd8rqnz4rxdxcz7jlrm3yqlfj6jqeru5m3xrjhzp0fn2r4v8sd5ehh3
  - &tristan age1kr4my68wnc3en2ajhcwj26ffk3tgdlrx9uknjxrlvjf76lw5h4kqyslt62
  # Personal devices decrypt with their ssh host key (ssh-to-age)
  - &falcon age1srke2eegqn7rwp8gn8hvxxs9le4w48ffj2jqvk7p87kp9gk9gemqrdpqcu
  - &axolotl age1stun0l8j2sspafr6aqh0yl49mh2dkqddlzuhfsggllly8dwrnf3sjldasu
  - &systeamadeck age1ktnn5xmfwnclq7j6wt8anl98qz8m2s4jpuwl304ptcxug2ue5vfsyq2x27
  # The morgenmuffel VM (static/muffin.nix): the key is generated on the Mac and shared into the guest
  - &muffin age188v8zc9m6pt38u72cqns8lq45thtwhss5yge9gtel32tm9rmhs3qwff7cu
  # Hosts not reachable yet: their keys were generated here and live in secrets/sops/hostkeys.yaml,
  # to be installed as the host's ssh host key (docs/node-standard.md "Provisioned host keys")
  - &piper age1zqd7ssewjapw8sg6re8cg26efsmp694247v0scm4hf0c2nmul38s65rmsl
  - &echidna age1czl063d3c2gdqy6dcl8cc2n7v4wg4z2a2er3lhpxrjngqackrumqymcmdw
  - &gargoyle age13uxyhlq5h2y4nw3gya33xemzk6l3hs8drqdpgaajxdt72dgcadnsxzr2rq
creation_rules:
  - path_regex: secrets/sops/default\.yaml
    key_groups:
      - age:
          - *server
          - *tristan
          # Desktop nodes (k8s-node.nix) read the cluster secrets (RKE2 token,
          # tailnet and attic keys) with their ssh host key
          - *falcon
          - *axolotl
          - *muffin
          - *piper
  - path_regex: secrets/sops/personal\.yaml
    key_groups:
      - age:
          - *tristan
          - *falcon
          - *axolotl
          - *systeamadeck
          - *echidna
          - *gargoyle
  # Private halves of the host keys above: tristan only (installed by hand, never by the host itself)
  - path_regex: secrets/sops/hostkeys\.yaml
    key_groups:
      - age:
          - *tristan
  # Syncthing device identities (`syncthing-identity <host>`): each host decrypts only its own
  - path_regex: secrets/sops/syncthing-morgenmuffel\.yaml
    key_groups:
      - age:
          - *tristan
  - path_regex: secrets/sops/syncthing-falcon\.yaml
    key_groups:
      - age:
          - *tristan
          - *falcon
  - path_regex: secrets/sops/syncthing-axolotl\.yaml
    key_groups:
      - age:
          - *tristan
          - *axolotl
  - path_regex: secrets/sops/syncthing-systeamadeck\.yaml
    key_groups:
      - age:
          - *tristan
          - *systeamadeck
  # The Pixel's Syncthing-Fork has no sops: `android pixel productivity` decrypts this on the Mac and imports it
  - path_regex: secrets/sops/syncthing-pixel\.yaml
    key_groups:
      - age:
          - *tristan
