# Config for the `typos` git hook.
[files]
# static/facter/*.json are machine-generated nixos-facter hardware reports.
# They faithfully capture vendor BIOS/DMI strings ("DislayPort", "PnP",
# "snd_hda_intel") that typos misreads as misspellings — none are editable
# without misrepresenting the detected hardware, so skip the directory.
# docs/games-inventory.md quotes real save/file names (.sav, "Clair Obscur") verbatim.
# nixidy/system/observability/dashboards/*.json are upstream Grafana dashboards kept verbatim.
extend-exclude = [
  "static/facter/",
  "docs/games-inventory.md",
  "nixidy/system/observability/dashboards/",
]

[default]
# Syncthing device IDs (modules/syncthing.nix) and age recipients: base32 strings, not words;
# Navidrome's `X-ND-Authorization` header; ID3 frame ids (TPE1, TPE2)
extend-ignore-re = [
  "[A-Z2-7]{7}(-[A-Z2-7]{7}){7}",
  "age1[a-z0-9]{58}",
  "X-ND-Authorization",
  "TPE[0-9]",
  # Bazarr's own settings keys (serie_default_enabled, serie_default_profile)
  "serie_default_[a-z]+",
  # base64 test vectors ("f", "fo", "foo", ...)
  "\"fo\"",
]

[default.extend-identifiers]
# Universal Plug and Play — the "Pn" in "UPnP" is not a typo of "On".
UPnP = "UPnP"

[default.extend-words]
# rsync -aHAX (archive + hardlinks, ACLs, xattrs), not "HEX"
HAX = "HAX"
# nixos-facter (hardware detection tool), not a typo of "factor"/"faster"
facter = "facter"
# Eclipse Mosquitto (MQTT broker), not the insect
mosquitto = "mosquitto"
# Home Assistant (hass.* hostname, HASS env vars), not "hash"
hass = "hass"
HASS = "HASS"
# Navidrome config env vars are all `ND_`-prefixed, not a typo of "AND"
ND = "ND"
# chiaki's PS5 registration key flag (--registkey, regist_key)
regist = "regist"
# Android package ids and app names (modules/android.nix): org.mian.gitnex, Transportr
mian = "mian"
transportr = "transportr"
Transportr = "Transportr"
# nmap -Pn (skip host discovery)
Pn = "Pn"
# Python CA bundle package (pkgs/romm-tender), not "certify"
certifi = "certifi"
