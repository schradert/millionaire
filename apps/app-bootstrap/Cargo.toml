[package]
name = "app-bootstrap"
version = "0.22.2"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyroscope = { version = "2", default-features = false, features = ["backend-pprof-rs"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
# Function names for the Pyroscope SDK profiles (profile.rs); only the debug info goes.
strip = "debuginfo"
