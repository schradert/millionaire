[package]
name = "app-bootstrap"
version = "0.49.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyroscope = { version = "2", default-features = false, features = [
  "backend-pprof-rs",
] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = [
  "runtime",
] }

[profile.release]
opt-level = "s"
lto = true
# Function names for the Pyroscope SDK profiles (profile.rs); only the debug info goes.
strip = "debuginfo"
