[package]
name = "dvdrip"
version = "0.1.8"
description = "DVD ripping on Kubernetes: per-drive agents, a controller, encode and publish Jobs (docs/dvd-rip.md)"
publish = false
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.28", default-features = false, features = [
  "latest",
  "schemars",
] }
kube = { version = "4", default-features = false, features = [
  "client",
  "derive",
  "runtime",
  "rustls-tls",
] }
libc = "0.2"
prometheus-client = "0.25"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
