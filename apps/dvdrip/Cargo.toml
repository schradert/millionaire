[package]
name = "dvdrip"
version = "0.1.0"
description = "DVD ripping on Kubernetes: per-drive agents, a controller, encode and publish Jobs (docs/dvd-rip.md)"
publish = false
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["latest", "schemars"] }
kube = { version = "4", default-features = false, features = ["derive"] }
quick-xml = "0.42"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
