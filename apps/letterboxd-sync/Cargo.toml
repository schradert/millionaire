[package]
name = "letterboxd-sync"
version = "0.1.0"
description = "Trakt watch history to Letterboxd: new films as an import CSV, uploaded through a headless browser logged in as the owner"
publish = false
edition = "2021"

[dependencies]
chromiumoxide = { version = "0.7", default-features = false, features = [
  "tokio-runtime",
] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "fs",
] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
