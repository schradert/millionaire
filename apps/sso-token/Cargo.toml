[package]
name = "sso-token"
version = "0.1.0"
edition = "2021"
description = "Keycloak access tokens for CLIs via the OAuth 2.0 device authorization grant"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
