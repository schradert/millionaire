apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: actual
    app.kubernetes.io/instance: actual
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: actual
  name: actual
  namespace: finance
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: actual
      app.kubernetes.io/instance: actual
      app.kubernetes.io/name: actual
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: actual
        app.kubernetes.io/instance: actual
        app.kubernetes.io/name: actual
    spec:
      automountServiceAccountToken: false
      containers:
        - image: actualbudget/actual-server:26.10.0-alpine@sha256:67b1b5e9584e3e143b4f5c41e52b4506ed9cdd1072392d5ab5369f2d4fd0bffd
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5006
            timeoutSeconds: 5
          name: actual
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5006
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5006
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /data
              name: data
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - command:
            - node
            - -e
            - |
              const fs = require("fs"), db = "/data/server-files/account.sqlite";
              if (!fs.existsSync(db)) process.exit(0);
              const d = new (require("better-sqlite3"))(db);
              const has = d.prepare("SELECT count(*) n FROM sqlite_master WHERE name = 'users'").get().n;
              if (!has || d.prepare("SELECT count(*) n FROM users WHERE user_name <> '' AND owner = 1").get().n) process.exit(0);
              const r = d.prepare("UPDATE users SET owner = 1 WHERE user_name = ?").run(process.env.OWNER);
              console.log("owner set:", r.changes);
          env:
            - name: OWNER
              value: tristan
          image: actualbudget/actual-server:26.10.0-alpine@sha256:67b1b5e9584e3e143b4f5c41e52b4506ed9cdd1072392d5ab5369f2d4fd0bffd
          name: owner
          volumeMounts:
            - mountPath: /data
              name: data
          workingDir: /app
      serviceAccountName: actual
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual
