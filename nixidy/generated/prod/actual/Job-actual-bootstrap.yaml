apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: actual-bootstrap
  namespace: finance
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - actual
          env:
            - name: ACTUAL_PUBLIC_URL
              value: https://actual.trdos.me
            - name: ACTUAL_URL
              value: http://actual.finance.svc.cluster.local:5006
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: ADMIN_USER
              value: tristan
            - name: OIDC_AUTHORITY
              value: https://keycloak.trdos.me/realms/default
            - name: OIDC_CLIENT_ID
              value: actual
            - name: OIDC_CLIENT_SECRET_FILE
              value: /secrets/oidc/client_secret
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
          image: harbor.trdos.me/library/app-bootstrap:0.21.0@sha256:c9c03ae43d7502edf415eff12c7e2b8c8206d0b3ff5b80e9c08d6142a6e9bb53
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
            - mountPath: /secrets/oidc
              name: oidc
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: admin
          secret:
            secretName: actual-admin
        - name: oidc
          secret:
            secretName: actual-oidc
