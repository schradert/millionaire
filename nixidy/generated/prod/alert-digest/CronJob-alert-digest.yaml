apiVersion: batch/v1
kind: CronJob
metadata:
  name: alert-digest
  namespace: observability
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: alert-digest
        spec:
          automountServiceAccountToken: false
          containers:
            - args:
                - alert-digest
              env:
                - name: ALWAYS_SEND
                  value: "false"
                - name: DIGEST_FROM
                  value: noreply@trdos.me
                - name: DIGEST_TO
                  value: t0rdos@pm.me
              image: harbor.trdos.me/library/app-bootstrap:0.47.0@sha256:abccac451f302019149ac49c5f54a80d4f04831a67fa585ae1add61e5f22685e
              name: alert-digest
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
      ttlSecondsAfterFinished: 86400
  schedule: 0 8 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  timeZone: America/Los_Angeles
