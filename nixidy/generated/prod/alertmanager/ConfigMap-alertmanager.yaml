apiVersion: v1
data:
  alertmanager.yml: |
    global: {}
    receivers:
    - name: "null"
    - name: gatus-heartbeat
      webhook_configs:
      - http_config:
          authorization:
            credentials: cluster-watchdog-heartbeat
        send_resolved: false
        url: https://status.trdos.me/api/v1/endpoints/cluster_watchdog/external?success=true
    - name: default
      webhook_configs:
      - send_resolved: true
        url: https://ntfy.trdos.me/alerts?template=alertmanager
    route:
      group_interval: 5m
      group_wait: 30s
      receiver: default
      repeat_interval: 4h
      routes:
      - group_interval: 1m
        group_wait: 0s
        matchers:
        - alertname = Watchdog
        receiver: gatus-heartbeat
        repeat_interval: 2m
      - matchers:
        - alertname = InfoInhibitor
        receiver: "null"
    templates:
    - /etc/alertmanager/*.tmpl
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alertmanager
  name: alertmanager
  namespace: observability
