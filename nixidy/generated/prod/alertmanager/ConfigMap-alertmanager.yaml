apiVersion: v1
data:
  alertmanager.yml: |
    global: {}
    receivers:
    - name: "null"
    - name: gatus-heartbeat
      webhook_configs:
      - http_config:
          authorization:
            credentials: cluster-watchdog-heartbeat
        send_resolved: false
        url: http://100.64.0.1:8081/api/v1/endpoints/cluster_watchdog/external?success=true
    - email_configs:
      - from: noreply@trdos.me
        require_tls: false
        smarthost: stalwart.mail.svc.cluster.local:25
        to: t0rdos@pm.me
      name: default
      webhook_configs:
      - url: http://100.64.0.1:2586/alerts?template=alertmanager
    route:
      group_interval: 5m
      group_wait: 30s
      receiver: default
      repeat_interval: 4h
      routes:
      - group_interval: 1m
        group_wait: 0s
        matchers:
        - alertname = Watchdog
        receiver: gatus-heartbeat
        repeat_interval: 2m
      - matchers:
        - alertname = InfoInhibitor
        receiver: "null"
    templates:
    - /etc/alertmanager/*.tmpl
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alertmanager
  name: alertmanager
  namespace: observability
