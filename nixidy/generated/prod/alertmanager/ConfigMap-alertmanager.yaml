apiVersion: v1
data:
  alertmanager.yml: |
    global: {}
    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = critical
      target_matchers:
      - severity =~ warning|info
    - equal:
      - namespace
      - deployment
      source_matchers:
      - alertname = KubeDeploymentRolloutStuck
      target_matchers:
      - alertname = KubeDeploymentReplicasMismatch
    - equal:
      - namespace
      source_matchers:
      - alertname = KubeDeploymentRolloutStuck
      target_matchers:
      - alertname =~ KubePodNotReady|KubeContainerWaiting
    - equal:
      - namespace
      source_matchers:
      - severity = warning
      target_matchers:
      - severity = info
    receivers:
    - name: "null"
    - name: e2e-ntfy
      webhook_configs:
      - http_config:
          authorization:
            credentials_file: /etc/ntfy/token
        send_resolved: true
        url: https://ntfy.trdos.me/e2e-alerts?template=alertmanager
    - name: e2e-jobs-ntfy
      webhook_configs:
      - http_config:
          authorization:
            credentials_file: /etc/ntfy/token
        send_resolved: true
        url: https://ntfy.trdos.me/e2e?template=alertmanager&priority=2
    - name: dvd-ntfy
      webhook_configs:
      - http_config:
          authorization:
            credentials_file: /etc/ntfy/token
        send_resolved: true
        url: https://ntfy.trdos.me/dvd?template=alertmanager&priority=2
    - name: gatus-heartbeat
      webhook_configs:
      - http_config:
          authorization:
            credentials: cluster-watchdog-heartbeat
        send_resolved: false
        url: https://status.trdos.me/api/v1/endpoints/cluster_watchdog/external?success=true
    - name: default
      webhook_configs:
      - http_config:
          authorization:
            credentials_file: /etc/ntfy/token
        send_resolved: true
        url: https://ntfy.trdos.me/alerts?template=alertmanager
    route:
      group_by:
      - alertname
      - namespace
      - node
      - device
      group_interval: 5m
      group_wait: 30s
      receiver: default
      repeat_interval: 4h
      routes:
      - group_by:
        - alertname
        - e2e
        group_interval: 10s
        group_wait: 0s
        matchers:
        - alertname = E2EAlert
        receiver: e2e-ntfy
        repeat_interval: 1h
      - matchers:
        - alertname = KubeJobFailed
        - namespace =~ "e2e|media"
        - job_name =~ "(media-)?e2e.*"
        receiver: e2e-jobs-ntfy
      - matchers:
        - alertname = KubeJobFailed
        - namespace = media
        - job_name =~ "dvd-.*"
        receiver: dvd-ntfy
      - group_interval: 1m
        group_wait: 0s
        matchers:
        - alertname = Watchdog
        receiver: gatus-heartbeat
        repeat_interval: 2m
      - matchers:
        - node =~ "muffin|piper"
        receiver: "null"
      - matchers:
        - alertname = InfoInhibitor
        receiver: "null"
      - matchers:
        - severity = info
        receiver: "null"
    templates:
    - /etc/alertmanager/*.tmpl
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alertmanager
  name: alertmanager
  namespace: observability
