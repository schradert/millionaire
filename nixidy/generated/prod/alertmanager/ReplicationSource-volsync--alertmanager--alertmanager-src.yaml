apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--alertmanager--alertmanager-src
  namespace: observability
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--alertmanager--alertmanager
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: storage-alertmanager-0
  trigger:
    schedule: 0 4 * * *
