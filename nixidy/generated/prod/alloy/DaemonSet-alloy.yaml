apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: alloy
  name: alloy
  namespace: observability
spec:
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: alloy
      app.kubernetes.io/name: alloy
  template:
    metadata:
      annotations:
        checksum/config: 68b76fb6f254f4617a7e4f3d2d895583041b1aa74545f369eacf96628e9bbe7
        kubectl.kubernetes.io/default-container: alloy
      labels:
        app.kubernetes.io/instance: alloy
        app.kubernetes.io/name: alloy
    spec:
      containers:
        - args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --server.http.ui-path-prefix=/
            - --disable-reporting
            - --stability.level=generally-available
          env:
            - name: ALLOY_DEPLOY_MODE
              value: helm
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GOMEMLIMIT
              value: 512MiB
          image: docker.io/grafana/alloy@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
          imagePullPolicy: IfNotPresent
          name: alloy
          ports:
            - containerPort: 12345
              name: http-metrics
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 12347
              name: faro
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 20m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - BPF
                - PERFMON
                - SYS_PTRACE
                - CHECKPOINT_RESTORE
                - SYS_RESOURCE
                - DAC_READ_SEARCH
                - SYSLOG
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/alloy
              name: config
            - mountPath: /tmp/alloy
              name: storage
            - mountPath: /tmp/symb-cache
              name: symb-cache
            - mountPath: /sys/kernel/tracing
              name: tracefs
              readOnly: true
      dnsPolicy: ClusterFirst
      hostPID: true
      serviceAccountName: alloy
      tolerations:
        - effect: NoSchedule
          operator: Exists
      volumes:
        - configMap:
            name: alloy
          name: config
        - emptyDir: {}
          name: storage
        - emptyDir: {}
          name: symb-cache
        - hostPath:
            path: /sys/kernel/tracing
          name: tracefs
