apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: faro
  namespace: observability
spec:
  hostnames:
    - faro.trdos.me
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: alloy
          port: 12347
      matches:
        - path:
            type: PathPrefix
            value: /collect
