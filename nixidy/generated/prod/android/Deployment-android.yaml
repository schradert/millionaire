apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: android
    app.kubernetes.io/instance: android
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: android
  name: android
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: android
      app.kubernetes.io/instance: android
      app.kubernetes.io/name: android
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: f1855c20b9ece6ff7786625a374a92b20c9c370fdc58cc5fa83a58bb4e987932
      labels:
        app.kubernetes.io/controller: android
        app.kubernetes.io/instance: android
        app.kubernetes.io/name: android
    spec:
      automountServiceAccountToken: false
      containers:
        - image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          name: nginx
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: site
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: android
      volumes:
        - configMap:
            name: android
          name: site
