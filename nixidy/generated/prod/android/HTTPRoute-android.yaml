apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: android
  namespace: home
spec:
  hostnames:
    - android.trdos.me
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: android
          port: 80
