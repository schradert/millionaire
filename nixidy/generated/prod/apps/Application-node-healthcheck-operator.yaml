apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: node-healthcheck-operator
  namespace: cicd
spec:
  destination:
    namespace: medik8s
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./nixidy/generated/prod/node-healthcheck-operator
    repoURL: https://github.com/schradert/millionaire.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - FailOnSharedResource=true
      - PruneLast=true
      - ServerSideApply=true
