apiVersion: v1
data:
  rsyncd.conf: |-
    uid = 0
    gid = 0
    use chroot = no
    numeric ids = yes
    strict modes = no
    max connections = 2
    log file = /dev/stdout
    pid file = /tmp/rsyncd.pid
    lock file = /tmp/rsyncd.lock
    hosts allow = 192.168.50.0/24
    auth users = transfer
    secrets file = /config/rsyncd.secrets
    read only = false

    [dvd]
    path = /data/dvd
    comment = media-dvd

    [movies]
    path = /data/movies
    comment = media-movies

    [games]
    path = /data/games
    comment = media-games
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: archive-ingest
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: archive-ingest
  name: archive-ingest
  namespace: media
