apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: archive-ingest-rsyncd
  namespace: media
spec:
  data:
    - remoteRef:
        key: archive-ingest
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-media
  target:
    template:
      data:
        rsyncd.secrets: transfer:{{ .password }}
