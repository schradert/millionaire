apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: archive-ingest
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: archive/ingest-password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: archive-ingest
