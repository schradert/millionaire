apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/instance: argo-events
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argo-events-controller-manager
    app.kubernetes.io/part-of: argo-events
  name: argo-events-controller-manager
  namespace: cicd
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/instance: argo-events
      app.kubernetes.io/name: argo-events-controller-manager
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: f8544e67ba96023f54bdbe502538ec40da1f52fe8f084e2b77b2ff1739b9b08a
      labels:
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/instance: argo-events
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: argo-events-controller-manager
        app.kubernetes.io/part-of: argo-events
    spec:
      containers:
        - args:
            - controller
            - --leader-election=false
          env:
            - name: ARGO_EVENTS_IMAGE
              value: quay.io/argoproj/argo-events:v1.9.11@sha256:fa07b2c9ece6ec60a3a8377866dfe21e8bad062d5b5407f1f181d3f1d24fb861
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: quay.io/argoproj/argo-events:v1.9.11@sha256:fa07b2c9ece6ec60a3a8377866dfe21e8bad062d5b5407f1f181d3f1d24fb861
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: controller-manager
          ports:
            - containerPort: 7777
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: probe
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /etc/argo-events
              name: config
      serviceAccountName: argo-events-controller-manager
      volumes:
        - configMap:
            name: argo-events-controller-manager
          name: config
