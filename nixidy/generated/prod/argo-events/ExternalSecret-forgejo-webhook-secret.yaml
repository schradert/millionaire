apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-webhook-secret
  namespace: cicd
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: secret
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: forgejo-webhook-secret
  refreshPolicy: CreatedOnce
