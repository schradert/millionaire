apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: argo-workflows
  namespace: cicd
spec:
  affinity:
    enablePodAntiAffinity: true
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - sirver
          weight: 100
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  backup:
    barmanObjectStore:
      destinationPath: s3://trdos-me--volsync/cnpg/argo-workflows/
      endpointURL: https://s3.us-west-004.backblazeb2.com
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: argo-workflows-b2-postgres
        secretAccessKey:
          key: ACCESS_SECRET_KEY
          name: argo-workflows-b2-postgres
    retentionPolicy: 30d
  bootstrap:
    initdb:
      database: argo-workflows
      owner: argo-workflows
      postInitApplicationSQL: []
      postInitSQL: []
  imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:148c715c10007a5c0c31f7fdb54bc9991ffbb73c74efa2b35d1fedd3f8103251
  instances: 2
  monitoring:
    enablePodMonitor: true
  postgresql:
    shared_preload_libraries: []
  serviceAccountTemplate:
    metadata:
      name: argo-workflows-pg
  storage:
    size: 5Gi
    storageClass: ceph-block
