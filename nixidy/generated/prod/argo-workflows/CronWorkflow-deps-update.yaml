apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: deps-update
  namespace: cicd
spec:
  concurrencyPolicy: Forbid
  schedules:
    - 0 6 * * 1
  suspend: true
  timezone: America/Los_Angeles
  workflowSpec:
    activeDeadlineSeconds: 21600
    archiveLogs: false
    arguments:
      parameters:
        - name: repo
          value: schradert/millionaire
        - name: base
          value: main
        - name: kinds
          value: src,chart,image,flake,devenv,cargo,uv,bun
    entrypoint: update
    serviceAccountName: argo-workflows-ci
    templates:
      - affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - bonobo
                        - chinchilla
                    - key: kubernetes.io/arch
                      operator: In
                      values:
                        - amd64
        container:
          args:
            - |
              set -euo pipefail
              # deps-update <repo-slug> <base> <kinds>
              # For each kind: fresh checkout of <base>, `update bump --only <kind>`, a
              # build-all gate (x86_64-linux), and force-push branch deps/<kind> + open (or
              # refresh) one PR per kind, as a draft listing the failures when the gate fails.
              SLUG="$1"; BASE="$2"; KINDS="$3"
              mkdir -p /etc/nix
              cat > /etc/nix/nix.conf <<NIXCONF
              build-users-group = nixbld
              experimental-features = nix-command flakes
              sandbox = false
              filter-syscalls = false
              accept-flake-config = true
              max-jobs = auto
              cores = 0
              trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
              NIXCONF

              : "${GITHUB_TOKEN:?GITHUB_TOKEN not set}"
              export GH_TOKEN="$GITHUB_TOKEN"
              remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${SLUG}.git"
              work=$(mktemp -d)
              git clone -q --branch "$BASE" "$remote" "$work/repo"
              cd "$work/repo"
              git config user.name "millionaire-update"
              git config user.email "update@trdos.me"
              tools=$(nix build --no-pure-eval --no-link --print-out-paths --inputs-from . nixpkgs#gh nixpkgs#jq nixpkgs#gawk nixpkgs#openssh nixpkgs#nix-eval-jobs | sed 's|$|/bin|' | paste -sd:)
              export PATH="$tools:$PATH"
              update=$(nix build --no-pure-eval --no-link --print-out-paths .#update)/bin/update
              system=$(nix eval --impure --raw --expr builtins.currentSystem)
              render() { nix build --no-pure-eval --no-link --print-out-paths ".#legacyPackages.$system.nixidyEnvs.$system.prod.config.build.environmentPackage"; }
              gen=nixidy/generated/prod

              # Copy only manifests the bump changed (raw render before vs after): the raw
              # render differs cosmetically from the committed tree and skips vals.
              sync_generated() {
                local before="$1" after="$2" f
                (cd "$after" && find -L . -type f -name '*.yaml') | while read -r f; do
                  cmp -s "$before/$f" "$after/$f" && continue
                  if grep -qE 'ref\+[a-z]+://' "$after/$f"; then echo "  skip $f (vals placeholders)"; continue; fi
                  mkdir -p "$(dirname "$gen/$f")"; cp -L "$after/$f" "$gen/$f"; chmod u+w "$gen/$f"
                done
                (cd "$before" && find -L . -type f -name '*.yaml') | while read -r f; do
                  [ -e "$after/$f" ] || git rm -q --ignore-unmatch "$gen/$f"
                done
              }

              # build-all gate. The pod (12Gi) only evaluates; derivations build in the
              # store of the first pool node ($BUILD_POOL) that accepts the in-cluster key,
              # and outputs stay there. Writes a markdown verdict to $1; fails on failures.
              key=/builder-ssh/privateKey
              gate() {
                local md="$1" store="" s n hk evals drvs outs bad
                n=$(jq length <<<"$BUILD_POOL")
                for ((i = 0; i < n; i++)); do
                  hk=$(jq -r ".[$i].hostKey | @base64" <<<"$BUILD_POOL")
                  s="ssh-ng://$(jq -r ".[$i] | .user + \"@\" + .lan" <<<"$BUILD_POOL")?ssh-key=$key&base64-ssh-public-host-key=$hk"
                  if nix store info --store "$s" >/dev/null 2>&1; then store="$s"; break; fi
                done
                if [ -z "$store" ]; then
                  printf 'build-all not run: no pool node accepts the deps-update key. Set `deps_update_builder_pubkey` in static/generated.json and deploy the nodes:\n\n    %s\n' "$(cat /builder-ssh/publicKey)" >"$md"
                  return 1
                fi
                evals="$work/eval.jsonl"
                nix-eval-jobs --impure --workers 2 --max-memory-size 3072 --flake ".#legacyPackages.x86_64-linux.build-all" >"$evals" || true
                mapfile -t drvs < <(jq -r 'select(.drvPath) | .drvPath + "^*"' "$evals")
                [ "${#drvs[@]}" -eq 0 ] || nix build --no-pure-eval --eval-store auto --store "$store" --keep-going --no-link "${drvs[@]}" >&2 || true
                outs=$(jq -r 'select(.outputs) | .outputs[]' "$evals")
                bad=$({
                  jq -r 'select(.error) | "- `\(.attr)` (eval)"' "$evals"
                  [ -z "$outs" ] || nix-store --store "$store" --check-validity --print-invalid $outs 2>/dev/null |
                    while read -r o; do jq -r --arg o "$o" 'select(.outputs and (.outputs | map(. == $o) | any)) | "- `\(.attr)` (build)"' "$evals"; done
                } | sort -u)
                [ -s "$evals" ] || bad='- `<flake>` (eval)'
                if [ -n "$bad" ]; then
                  printf 'build-all (x86_64-linux) failed on %s:\n\n%s\n' "${store%%\?*}" "$bad" >"$md"
                  return 1
                fi
                printf 'build-all (x86_64-linux) passed on %s.\n' "${store%%\?*}" >"$md"
              }

              failed=0
              for kind in ${KINDS//,/ }; do
                echo "=== $kind"
                git checkout -q -f "origin/$BASE" && git clean -qfdx
                branch="deps/$kind"
                summary="$work/summary-$kind.md"
                case "$kind" in src|chart|image|flake) before=$(render) ;; *) before= ;; esac
                rc=0
                "$update" bump --only "$kind" --summary "$summary" || rc=$?
                if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "[$kind] update errored ($rc)" >&2; failed=1; continue; fi
                if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
                  echo "[$kind] nothing to update"; continue
                fi
                [ -n "$before" ] && sync_generated "$before" "$(render)"
                if ! tools/pin-lint; then echo "[$kind] pin-lint failed, not pushing" >&2; failed=1; continue; fi
                git checkout -q -B "$branch"
                git add -A # flakes only see tracked files
                verdict="$work/gate-$kind.md"
                draft=
                gate "$verdict" || draft=1
                git commit -q -m "chore(deps): update $kind"
                git push -q -f origin "$branch"
                body=$(printf 'Weekly `update bump --only %s`.\n\n%s\n\n%s\n' "$kind" "$(cat "$summary")" "$(cat "$verdict")")
                pr=$(gh pr list -R "$SLUG" --head "$branch" --base "$BASE" --state open --json number -q '.[0].number')
                if [ -n "$pr" ]; then
                  gh pr edit "$pr" -R "$SLUG" --body "$body" >/dev/null
                  if [ -n "$draft" ]; then gh pr ready --undo "$pr" -R "$SLUG" >/dev/null || true; else gh pr ready "$pr" -R "$SLUG" >/dev/null || true; fi
                  echo "[$kind] refreshed #$pr${draft:+ (draft)}"
                else
                  gh pr create -R "$SLUG" -B "$BASE" -H "$branch" -t "chore(deps): update $kind" -b "$body" ${draft:+--draft}
                fi
              done
              exit "$failed"
            - deps-update
            - '{{workflow.parameters.repo}}'
            - '{{workflow.parameters.base}}'
            - '{{workflow.parameters.kinds}}'
          command:
            - bash
            - -ec
          env:
            - name: BUILD_POOL
              value: '[{"hostKey":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMZHuAa6lN+oXGgR7QbNP+5WZcXuzq9E7EFCvh4dgNOK","lan":"192.168.50.204","user":"nix-remote-builder"},{"hostKey":"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBra12ioG15PJisgWHxeFjmPixqcbUzRGIi6X4HBQO6U","lan":"192.168.50.53","user":"nix-remote-builder"}]'
          envFrom:
            - secretRef:
                name: argo-workflows-github
          image: nixos/nix:2.28.3@sha256:e623d73af9cac82d1b50784c83e0cf2a4b83bfd2cfe8d5b67809a2fc94e043ac
          resources:
            limits:
              memory: 12Gi
            requests:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - mountPath: /nix
              name: nix
            - mountPath: /builder-ssh
              name: builder-ssh
              readOnly: true
        initContainers:
          - args:
              - '[ -e /cache/.seeded ] || { cp -a /nix/. /cache/ && touch /cache/.seeded; }'
            command:
              - sh
              - -c
            image: nixos/nix:2.28.3@sha256:e623d73af9cac82d1b50784c83e0cf2a4b83bfd2cfe8d5b67809a2fc94e043ac
            name: seed-nix-store
            volumeMounts:
              - mountPath: /cache
                name: nix
        name: update
    ttlStrategy:
      secondsAfterFailure: 604800
      secondsAfterSuccess: 86400
    volumes:
      - name: nix
        persistentVolumeClaim:
          claimName: deps-update-nix
      - name: builder-ssh
        secret:
          defaultMode: 256
          secretName: deps-update-builder
