apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
  labels:
    app: crds
    app.kubernetes.io/component: crds
    app.kubernetes.io/instance: argo-workflows
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argo-workflows-crd-install
    app.kubernetes.io/part-of: argo-workflows
  name: argo-workflows-crd-install
  namespace: cicd
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: crds
        app.kubernetes.io/component: crds
        app.kubernetes.io/instance: argo-workflows
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: argo-workflows-crd-install
        app.kubernetes.io/part-of: argo-workflows
    spec:
      containers:
        - image: quay.io/argoproj/argo-workflows-crdinstaller:v4.1.5@sha256:93534a0d0ba3ebd2965af08733852659130a3146a65a9746cbbf72250a92c9c9
          imagePullPolicy: Always
          name: apply
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 8737
            runAsNonRoot: true
            runAsUser: 8737
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      restartPolicy: Never
      serviceAccountName: argo-workflows-crd-install
      volumes:
        - emptyDir: {}
          name: tmp
