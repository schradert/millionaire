  ttlStrategy:
    secondsAfterFailure: 86400
    secondsAfterSuccess: 600
  volumes:
    - name: nix
      persistentVolumeClaim:
        claimName: image-build-nix
    - name: registry-auth
      secret:
        secretName: argo-workflows-harbor
