apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: atuin-bootstrap
  namespace: development
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - atuin
          env:
            - name: ATUIN_URL
              value: http://127.0.0.1:8888
            - name: ATUIN_USER
              value: tristan
            - name: ATUIN_EMAIL
              value: t0rdos@pm.me
            - name: ATUIN_PASSWORD_FILE
              value: /secrets/tristan/password
          image: harbor.trdos.me/library/app-bootstrap:0.19.6@sha256:e6ce713774b09d7c0aaf33951a9a03ec77e56b725cbbd011707ca1c847a06f4c
          name: bootstrap-tristan
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/tristan
              name: password-tristan
              readOnly: true
      initContainers:
        - args:
            - start
          env:
            - name: ATUIN_DB_URI
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: atuin-app
            - name: ATUIN_HOST
              value: 127.0.0.1
            - name: ATUIN_OPEN_REGISTRATION
              value: "true"
            - name: ATUIN_PORT
              value: "8888"
          image: ghcr.io/atuinsh/atuin:18.23.0@sha256:f232feeead54a0a13132b9cd477e312c3380e9dc90f1db24c4f79ce6c8e034ea
          name: registrar
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /config
              name: config
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: config
        - name: password-tristan
          secret:
            secretName: atuin-tristan
