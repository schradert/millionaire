apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: atuin-bootstrap
  namespace: development
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - atuin
          env:
            - name: ATUIN_URL
              value: http://127.0.0.1:8888
            - name: ATUIN_USER
              value: e2e
            - name: ATUIN_EMAIL
              value: e2e@e2e.trdos.me
            - name: ATUIN_PASSWORD_FILE
              value: /secrets/e2e/password
          image: harbor.trdos.me/library/app-bootstrap:0.22.1@sha256:efcaab3b2ee14c6d12e21e323ee0c59948842dd9bf75a6f2de5f07ec590cde6f
          name: bootstrap-e2e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/e2e
              name: password-e2e
              readOnly: true
        - args:
            - atuin
          env:
            - name: ATUIN_URL
              value: http://127.0.0.1:8888
            - name: ATUIN_USER
              value: tristan
            - name: ATUIN_EMAIL
              value: t0rdos@pm.me
            - name: ATUIN_PASSWORD_FILE
              value: /secrets/tristan/password
          image: harbor.trdos.me/library/app-bootstrap:0.22.1@sha256:efcaab3b2ee14c6d12e21e323ee0c59948842dd9bf75a6f2de5f07ec590cde6f
          name: bootstrap-tristan
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/tristan
              name: password-tristan
              readOnly: true
      initContainers:
        - args:
            - start
          env:
            - name: ATUIN_DB_URI
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: atuin-app
            - name: ATUIN_HOST
              value: 127.0.0.1
            - name: ATUIN_OPEN_REGISTRATION
              value: "true"
            - name: ATUIN_PORT
              value: "8888"
          image: ghcr.io/atuinsh/atuin:18.23.0@sha256:f232feeead54a0a13132b9cd477e312c3380e9dc90f1db24c4f79ce6c8e034ea
          name: registrar
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /config
              name: config
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: config
        - name: password-e2e
          secret:
            secretName: atuin-e2e
        - name: password-tristan
          secret:
            secretName: atuin-tristan
