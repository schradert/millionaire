apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: atuin-e2e
  namespace: development
spec:
  data:
    - match:
        remoteRef:
          remoteKey: atuin/e2e/password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: atuin-e2e
