apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: autobrr
    app.kubernetes.io/instance: autobrr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: autobrr
  name: autobrr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: autobrr
      app.kubernetes.io/instance: autobrr
      app.kubernetes.io/name: autobrr
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: 7450fb63fbce0f8082d70e95d15ed47fbf21358ae31a1a973957a36ee742adc8
      labels:
        app.kubernetes.io/controller: autobrr
        app.kubernetes.io/instance: autobrr
        app.kubernetes.io/name: autobrr
    spec:
      automountServiceAccountToken: false
      containers:
        - envFrom:
            - configMapRef:
                name: autobrr
          image: ghcr.io/autobrr/autobrr:v1.88.0@sha256:e200008d43fe6cd2d944c9bcf20900cfb8ba8a8e509625bb78ee51910b994005
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 7474
            timeoutSeconds: 5
          name: autobrr
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 7474
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 7474
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /admin
              name: admin
              readOnly: true
            - mountPath: /config
              name: config
            - mountPath: /secrets
              name: secrets
              readOnly: true
            - mountPath: /config/log
              name: tmpfs
              subPath: log
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - args:
            - |
              pw=$(cat /admin/password)
              i=0
              while :; do
                rc=0
                out=$(printf '%s\n' "$pw" | autobrrctl --config /config change-password "$ADMIN_USER" 2>&1) || rc=$?
                if [ "$rc" = 0 ]; then echo "user $ADMIN_USER present"; exit 0; fi
                case "$out" in
                  *"failed to get user"*)
                    printf '%s\n' "$pw" | autobrrctl --config /config create-user "$ADMIN_USER"
                    echo "user $ADMIN_USER created"; exit 0 ;;
                esac
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then echo "bootstrap failed: $out" >&2; exit 1; fi
                sleep 5
              done
          command:
            - /bin/sh
            - -ec
          env:
            - name: ADMIN_USER
              value: tristan
            - name: AUTOBRR__DATABASE_TYPE
              value: postgres
            - name: AUTOBRR__POSTGRES_DATABASE
              value: autobrr
            - name: AUTOBRR__POSTGRES_HOST
              value: autobrr-rw.media.svc.cluster.local
            - name: AUTOBRR__POSTGRES_PASSWORD_FILE
              value: /secrets/db_password.txt
            - name: AUTOBRR__POSTGRES_PORT
              value: "5432"
            - name: AUTOBRR__POSTGRES_USER
              value: autobrr
          image: ghcr.io/autobrr/autobrr:v1.88.0@sha256:e200008d43fe6cd2d944c9bcf20900cfb8ba8a8e509625bb78ee51910b994005
          name: bootstrap
          volumeMounts:
            - mountPath: /admin
              name: admin
              readOnly: true
            - mountPath: /config
              name: config
            - mountPath: /secrets
              name: secrets
              readOnly: true
            - mountPath: /config/log
              name: tmpfs
              subPath: log
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: autobrr
      volumes:
        - name: admin
          secret:
            secretName: autobrr-admin
        - name: config
          persistentVolumeClaim:
            claimName: autobrr
        - name: secrets
          secret:
            secretName: autobrr
        - emptyDir: {}
          name: tmpfs
