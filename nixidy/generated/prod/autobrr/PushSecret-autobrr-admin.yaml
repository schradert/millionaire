apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: autobrr-admin
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: autobrr/admin-password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: autobrr-admin
