apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-verify
  namespace: backup-verify
spec:
  data:
    - remoteRef:
        key: volsync/restic/password
      secretKey: restic
    - remoteRef:
        key: backblaze/bucket/application_key_id
      secretKey: id
    - remoteRef:
        key: backblaze/bucket/application_key
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    template:
      data:
        AWS_ACCESS_KEY_ID: '{{ .id }}'
        AWS_SECRET_ACCESS_KEY: '{{ .password }}'
        RESTIC_PASSWORD: '{{ .restic }}'
