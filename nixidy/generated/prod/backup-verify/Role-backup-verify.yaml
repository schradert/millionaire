apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-verify
  namespace: backup-verify
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - persistentvolumeclaims
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups:
      - volsync.backube
    resources:
      - replicationdestinations
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
      - deletecollection
