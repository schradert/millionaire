apiVersion: v1
data:
  install.php: |-
    <?php
    // Baïkal first-run install, idempotent (initContainer, every start). Does what the
    // 0.10.1 web installer does: config/baikal.yaml (SQLite, Digest auth), the database
    // schema, Specific/INSTALL_DISABLED; then keeps the admin password in sync with
    // $BAIKAL_ADMIN_PASSWORD and ensures the DAV users (`admin` and one per Keycloak
    // user) each with the `org` calendar org-bridge writes to. Never prints a password.
    require '/var/www/baikal/vendor/autoload.php';

    use Symfony\Component\Yaml\Yaml;

    const VERSION = '0.10.1';
    const REALM = 'BaikalDAV';
    const CONFIG = '/var/www/baikal/config/baikal.yaml';
    const SPECIFIC = '/var/www/baikal/Specific';
    const DB = SPECIFIC . '/db/db.sqlite';
    const SCHEMA = '/var/www/baikal/Core/Resources/Db/SQLite/db.sql';

    $password = getenv('BAIKAL_ADMIN_PASSWORD');
    if ($password === false || $password === '') {
        fwrite(STDERR, "BAIKAL_ADMIN_PASSWORD is not set\n");
        exit(1);
    }
    $adminHash = hash('sha256', 'admin:' . REALM . ':' . $password);

    // 1. Config: written once; afterwards only the admin hash is kept in sync.
    if (file_exists(CONFIG)) {
        $config = Yaml::parseFile(CONFIG);
        if (($config['system']['configured_version'] ?? null) !== VERSION) {
            fwrite(STDERR, "baikal.yaml has configured_version " . ($config['system']['configured_version'] ?? 'none') . ", expected " . VERSION . "; not touching it\n");
            exit(1);
        }
        if ($config['system']['admin_passwordhash'] !== $adminHash) {
            $config['system']['admin_passwordhash'] = $adminHash;
            file_put_contents(CONFIG, Yaml::dump($config));
            echo "admin password updated\n";
        }
    } else {
        $config = [
            'system' => [
                'configured_version' => VERSION,
                'timezone' => getenv('TZ') ?: 'America/Los_Angeles',
                'card_enabled' => true,
                'cal_enabled' => true,
                'invite_from' => '',
                'dav_auth_type' => 'Digest',
                'admin_passwordhash' => $adminHash,
                'failed_access_message' => 'user %u authentication failure for Baikal',
                'auth_realm' => REALM,
                'base_uri' => '',
            ],
            'database' => [
                'sqlite_file' => DB,
                'backend' => 'sqlite',
                'mysql_host' => '',
                'mysql_dbname' => '',
                'mysql_username' => '',
                'mysql_password' => '',
                'encryption_key' => bin2hex(random_bytes(16)),
                'pgsql_host' => '',
                'pgsql_dbname' => '',
                'pgsql_username' => '',
                'pgsql_password' => '',
            ],
        ];
        @mkdir(dirname(CONFIG), 0755, true);
        file_put_contents(CONFIG, Yaml::dump($config));
        echo "wrote baikal.yaml\n";
    }

    // 2. Database schema.
    @mkdir(dirname(DB), 0775, true);
    $pdo = new PDO('sqlite:' . DB);
    $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
    $hasUsers = $pdo->query("SELECT count(*) FROM sqlite_master WHERE type='table' AND name='users'")->fetchColumn();
    if (!$hasUsers) {
        $pdo->exec(file_get_contents(SCHEMA));
        echo "created database schema\n";
    }

    // 3. DAV users, each with a principal and the calendar `org` (the one org-bridge writes to): `admin` (break-glass;
    // the password above) and one per Keycloak user in the groups admin and family (nixidy/apps/home/baikal.nix sets
    // BAIKAL_USER_<n>, BAIKAL_EMAIL_<n> and BAIKAL_PASSWORD_<n>, n from 0). Users are only ever added or have their
    // password synced: nobody is removed, and a calendar that exists is left alone.
    function ensureUser(PDO $pdo, string $name, string $password, string $email): void
    {
        $digest = md5($name . ':' . REALM . ':' . $password);
        $cur = $pdo->prepare('SELECT digesta1 FROM users WHERE username = ?');
        $cur->execute([$name]);
        $row = $cur->fetchColumn();
        if ($row === false) {
            $pdo->prepare('INSERT INTO users (username, digesta1) VALUES (?, ?)')->execute([$name, $digest]);
            echo "created DAV user $name\n";
        } elseif ($row !== $digest) {
            $pdo->prepare('UPDATE users SET digesta1 = ? WHERE username = ?')->execute([$digest, $name]);
            echo "updated DAV user $name password\n";
        }
        $principal = 'principals/' . $name;
        $pdo->prepare('INSERT OR IGNORE INTO principals (uri, email, displayname) VALUES (?, ?, ?)')->execute([$principal, $email, $name]);
        $exists = $pdo->prepare("SELECT count(*) FROM calendarinstances WHERE principaluri = ? AND uri = 'org'");
        $exists->execute([$principal]);
        if (!$exists->fetchColumn()) {
            $pdo->exec("INSERT INTO calendars (synctoken, components) VALUES (1, 'VEVENT,VTODO')");
            $id = $pdo->lastInsertId();
            $pdo->prepare("INSERT INTO calendarinstances (calendarid, principaluri, access, displayname, uri, description, calendarorder, calendarcolor, timezone, transparent) VALUES (?, ?, 1, 'org', 'org', '', 0, '', '', 0)")->execute([$id, $principal]);
            echo "created calendar $name/org\n";
        }
    }

    $pdo->beginTransaction();
    ensureUser($pdo, 'admin', $password, '');
    for ($i = 0; ($user = getenv("BAIKAL_USER_$i")) !== false; $i++) {
        $userPassword = getenv("BAIKAL_PASSWORD_$i");
        if (!preg_match('/^[a-z0-9][a-z0-9._-]*$/', $user) || $user === 'admin') {
            fwrite(STDERR, "BAIKAL_USER_$i is not a usable DAV user name\n");
            exit(1);
        }
        if ($userPassword === false || $userPassword === '') {
            fwrite(STDERR, "BAIKAL_PASSWORD_$i (user $user) is not set\n");
            exit(1);
        }
        ensureUser($pdo, $user, $userPassword, getenv("BAIKAL_EMAIL_$i") ?: '');
    }
    $pdo->commit();

    // 4. Skip the installer's database step.
    if (!file_exists(SPECIFIC . '/INSTALL_DISABLED')) {
        touch(SPECIFIC . '/INSTALL_DISABLED');
    }
    echo "baikal install ok\n";
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: baikal
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: baikal
  name: baikal
  namespace: home
