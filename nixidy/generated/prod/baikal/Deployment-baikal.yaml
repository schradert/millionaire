apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: baikal
    app.kubernetes.io/instance: baikal
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: baikal
  name: baikal
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: baikal
      app.kubernetes.io/instance: baikal
      app.kubernetes.io/name: baikal
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: f82196e2ee1a5fc8b1bc885ac359fc483fe4f5a1ebee7bce3ee3efbccb8609bf
      labels:
        app.kubernetes.io/controller: baikal
        app.kubernetes.io/instance: baikal
        app.kubernetes.io/name: baikal
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: BAIKAL_SKIP_CHOWN
              value: "true"
          envFrom:
            - secretRef:
                name: baikal
          image: ckulka/baikal:0.10.1-nginx@sha256:434bdd162247cc6aa6f878c9b4dce6216e39e79526b980453b13812d5f8ebf4b
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          name: baikal
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 80Mi
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /var/www/baikal/Specific
              name: data
            - mountPath: /var/www/baikal/config
              name: data
              subPath: config
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - command:
            - sh
            - -ec
            - php /bootstrap/install.php && chown -R 101:101 /var/www/baikal/config /var/www/baikal/Specific
          env:
            - name: BAIKAL_EMAIL_0
              value: t0rdos@pm.me
            - name: BAIKAL_PASSWORD_0
              valueFrom:
                secretKeyRef:
                  key: password
                  name: baikal-user-tristan
            - name: BAIKAL_USER_0
              value: tristan
          envFrom:
            - secretRef:
                name: baikal
          image: ckulka/baikal:0.10.1-nginx@sha256:434bdd162247cc6aa6f878c9b4dce6216e39e79526b980453b13812d5f8ebf4b
          name: install
          volumeMounts:
            - mountPath: /var/www/baikal/Specific
              name: data
            - mountPath: /var/www/baikal/config
              name: data
              subPath: config
            - mountPath: /bootstrap
              name: install
      serviceAccountName: baikal
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: baikal
        - configMap:
            name: baikal
          name: install
