apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: baikal-user-tristan
  namespace: home
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: password
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: baikal-user-tristan
  refreshPolicy: CreatedOnce
