apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/instance: baikal
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: baikal
  name: baikal-baikal-dav
  namespace: home
spec:
  hostnames:
    - cal.trdos.me
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: baikal
          namespace: home
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /dav.php
        - path:
            type: PathPrefix
            value: /.well-known/caldav
        - path:
            type: PathPrefix
            value: /.well-known/carddav
