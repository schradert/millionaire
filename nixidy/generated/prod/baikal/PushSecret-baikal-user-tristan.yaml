apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: baikal-user-tristan
  namespace: home
spec:
  data:
    - match:
        remoteRef:
          remoteKey: baikal/tristan/password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: baikal-user-tristan
