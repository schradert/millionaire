apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: baikal
  namespace: home
spec:
  data:
    - match:
        remoteRef:
          remoteKey: baikal/admin-password
        secretKey: BAIKAL_ADMIN_PASSWORD
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: baikal
