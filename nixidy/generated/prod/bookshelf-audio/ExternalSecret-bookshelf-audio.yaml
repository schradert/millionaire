apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookshelf-audio
  namespace: media
spec:
  data:
    - remoteRef:
        key: bookshelf-audio-apikey
        property: apikey
      secretKey: READARR__AUTH__APIKEY
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
