apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: bookshelf-audio
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bookshelf-audio
  name: bookshelf-audio
  namespace: media
spec:
  endpoints:
    - interval: 1m
      path: /metrics
      port: metrics
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - media
  selector:
    matchLabels:
      app.kubernetes.io/instance: bookshelf-audio
      app.kubernetes.io/name: bookshelf-audio
      app.kubernetes.io/service: bookshelf-audio
