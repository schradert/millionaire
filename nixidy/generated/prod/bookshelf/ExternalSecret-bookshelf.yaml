apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookshelf
  namespace: media
spec:
  data:
    - remoteRef:
        key: bookshelf-apikey
        property: apikey
      secretKey: READARR__AUTH__APIKEY
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
