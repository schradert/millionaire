apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bws-backup
  namespace: security
spec:
  data:
    - remoteRef:
        key: backblaze/bucket/application_key_id
      secretKey: id
    - remoteRef:
        key: backblaze/bucket/application_key
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    template:
      data:
        AWS_ACCESS_KEY_ID: '{{ .id }}'
        AWS_SECRET_ACCESS_KEY: '{{ .password }}'
