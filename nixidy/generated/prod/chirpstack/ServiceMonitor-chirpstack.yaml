apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: chirpstack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: chirpstack
  name: chirpstack
  namespace: home
spec:
  endpoints:
    - interval: 1m
      path: /metrics
      port: metrics
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - home
  selector:
    matchLabels:
      app.kubernetes.io/instance: chirpstack
      app.kubernetes.io/name: chirpstack
      app.kubernetes.io/service: chirpstack
