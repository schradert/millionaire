apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: clickhouse-credentials
  namespace: storage
spec:
  data:
    - match:
        remoteRef:
          remoteKey: clickhouse/default/password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: clickhouse-credentials
