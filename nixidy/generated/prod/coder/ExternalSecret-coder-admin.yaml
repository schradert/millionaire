apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-admin
  namespace: development
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: password
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: coder-admin
  refreshPolicy: CreatedOnce
