apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc
  namespace: development
spec:
  data:
    - remoteRef:
        key: coder
        property: client-secret
      secretKey: oidc_secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-identity
  target:
    template:
      data:
        client-secret: '{{ .oidc_secret }}'
