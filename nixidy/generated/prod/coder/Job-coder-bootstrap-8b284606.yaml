apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: coder-bootstrap-8b284606
  namespace: development
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |+
              url=http://coder.development.svc.cluster.local
              until curl -sf "$url/healthz" >/dev/null; do echo "waiting for coderd"; sleep 5; done
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/v2/users/first")" = 404 ]; then
                coder login "$url" --first-user-username admin --first-user-email "$ADMIN_EMAIL" \
                  --first-user-password "$ADMIN_PASSWORD" --first-user-full-name Admin --first-user-trial=false
              fi
              CODER_SESSION_TOKEN=$(curl -sf -X POST "$url/api/v2/users/login" -H 'Content-Type: application/json' \
                -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" | sed -n 's/.*"session_token":"\([^"]*\)".*/\1/p')
              test -n "$CODER_SESSION_TOKEN"
              export CODER_URL=$url CODER_SESSION_TOKEN
              if ! coder users show "$USER_NAME" >/dev/null 2>&1; then
                coder users create --username "$USER_NAME" --email "$USER_EMAIL" --login-type oidc
              fi
              coder users edit-roles "$USER_NAME" --roles owner --yes
              # A user who has not logged in yet is dormant, and its workspaces' agents get 401.
              if coder users show "$USER_NAME" -o json | grep -q '"status": *"dormant"'; then
                coder users activate "$USER_NAME" <<<yes
              fi
              mkdir -p /tmp/templates/devenv
              cp -L /templates/devenv/.terraform.lock.hcl /tmp/templates/devenv/.terraform.lock.hcl
              cp -L /templates/devenv/main.tf /tmp/templates/devenv/main.tf
              : > /tmp/variables-devenv.yaml
              echo 'backup_bucket: "trdos-me--volsync"' >> /tmp/variables-devenv.yaml
              echo 'image: "harbor.trdos.me/library/workspace:0.1.2@sha256:8c347ee1e00e2b6a761adf124d428c46e6b3b90c2c8df69fdc164bc0156c3dd3"' >> /tmp/variables-devenv.yaml
              # A version whose import failed keeps its name, so it must not count as pushed: the next try gets -r2, -r3, ...
              for n in "" -r2 -r3 -r4 -r5; do
                status=$(coder templates versions list devenv -c name,status 2>/dev/null | sed -n "s/^97d07e29d916$n[[:space:]][[:space:]]*\([A-Za-z]*\).*/\1/p")
                if [ "$status" = Succeeded ]; then echo "devenv: 97d07e29d916$n already pushed"; break; fi
                if [ -z "$status" ]; then
                  coder templates push devenv --directory /tmp/templates/devenv --name 97d07e29d916$n \
                    --variables-file /tmp/variables-devenv.yaml --message 'nixidy 97d07e29d916' --yes
                  break
                fi
                echo "devenv: 97d07e29d916$n is $status, trying the next name"
              done
              coder templates edit devenv --display-name 'devenv project' --description 'One repository with its devenv, a persistent home and Nix store, Claude Code and opencode.' \
                --icon /emojis/2744.png --default-ttl 8h --activity-bump 1h --yes

          env:
            - name: HOME
              value: /tmp
            - name: ADMIN_EMAIL
              value: admin@trdos.me
            - name: USER_NAME
              value: tristan
            - name: USER_EMAIL
              value: t0rdos@pm.me
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: coder-admin
          image: ghcr.io/coder/coder:v2.36.7@sha256:e8b2743529aea6a1e77bba764c8ec4a04dec65d27ca9caa0ec0b2dbcd3db0565
          name: bootstrap
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /templates/devenv
              name: template-devenv
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - configMap:
            name: coder-template-devenv
          name: template-devenv
