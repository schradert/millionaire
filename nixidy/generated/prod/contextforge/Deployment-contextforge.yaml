apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: contextforge
    app.kubernetes.io/instance: contextforge
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: contextforge
  name: contextforge
  namespace: ai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: contextforge
      app.kubernetes.io/instance: contextforge
      app.kubernetes.io/name: contextforge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: contextforge
        app.kubernetes.io/instance: contextforge
        app.kubernetes.io/name: contextforge
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - octopus
      automountServiceAccountToken: false
      containers:
        - env:
            - name: APP_DOMAIN
              value: https://mcp.trdos.me
            - name: DATABASE_URL
              value: postgresql+psycopg://contextforge:$(DB_PASSWORD)@contextforge-rw:5432/contextforge
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: SSO_ALLOW_PROVIDER_LINKING
              value: "true"
            - name: SSO_API_TOKEN_AUTH_ENABLED
              value: "true"
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_KEYCLOAK_BASE_URL
              value: https://keycloak.trdos.me
            - name: SSO_KEYCLOAK_CLIENT_ID
              value: contextforge
            - name: SSO_KEYCLOAK_ENABLED
              value: "true"
            - name: SSO_KEYCLOAK_REALM
              value: default
            - name: SSO_KEYCLOAK_ROLE_MAPPINGS
              value: '{"admin":"platform_admin"}'
            - name: SSRF_ALLOWED_NETWORKS
              value: '["10.43.0.0/16"]'
            - name: TOOLHIVE_VMCP_URL
              value: http://homelab-vmcp.ai.svc.cluster.local:8080
          envFrom:
            - secretRef:
                name: contextforge
            - secretRef:
                name: contextforge-jwt
            - secretRef:
                name: contextforge-auth-encryption
            - secretRef:
                name: contextforge-basic-auth
            - secretRef:
                name: contextforge-admin
            - secretRef:
                name: contextforge-default-user
          image: ghcr.io/ibm/mcp-context-forge:latest@sha256:e9639c030162d6cb2f9f188600dd69af8091ec62a7ce307d4a74f4d4f86873df
          livenessProbe:
            httpGet:
              path: /health
              port: http
          name: contextforge
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: contextforge
