apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contextforge-admin
  namespace: ai
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: PLATFORM_ADMIN_PASSWORD
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: contextforge-admin
  refreshPolicy: CreatedOnce
