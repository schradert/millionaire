apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contextforge-jwt
  namespace: ai
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: JWT_SECRET_KEY
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: contextforge-jwt
  refreshPolicy: CreatedOnce
