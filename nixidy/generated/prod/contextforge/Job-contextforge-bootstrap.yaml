apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: contextforge-bootstrap
  namespace: ai
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - contextforge
          env:
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/PLATFORM_ADMIN_PASSWORD
            - name: CONTEXTFORGE_URL
              value: http://contextforge.ai.svc.cluster.local:8080
            - name: GATEWAY_URL
              value: http://openviking.ai.svc.cluster.local:1933/mcp
            - name: OIDC_AUDIENCE
              value: oauth2-proxy
            - name: OIDC_ISSUER
              value: https://keycloak.trdos.me/realms/default
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: SERVER_ID
              value: 05238f180ea94c7c8c5621976aec4604
            - name: UPSTREAM_TOKEN_FILE
              value: /secrets/openviking/OPENVIKING_AGENT_API_KEY
            - name: USER_EMAIL
              value: t0rdos@pm.me
          image: harbor.trdos.me/library/app-bootstrap:0.22.1@sha256:efcaab3b2ee14c6d12e21e323ee0c59948842dd9bf75a6f2de5f07ec590cde6f
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
            - mountPath: /secrets/openviking
              name: openviking
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: admin
          secret:
            secretName: contextforge-admin
        - name: openviking
          secret:
            secretName: openviking-agent-key
