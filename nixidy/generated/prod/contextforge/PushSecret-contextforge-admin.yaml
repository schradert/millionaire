apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: contextforge-admin
  namespace: ai
spec:
  data:
    - match:
        remoteRef:
          remoteKey: contextforge/admin-password
        secretKey: PLATFORM_ADMIN_PASSWORD
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: contextforge-admin
