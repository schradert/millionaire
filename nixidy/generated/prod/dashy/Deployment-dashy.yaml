apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: dashy
    app.kubernetes.io/instance: dashy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: dashy
  name: dashy
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: dashy
      app.kubernetes.io/instance: dashy
      app.kubernetes.io/name: dashy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: dashy
        app.kubernetes.io/instance: dashy
        app.kubernetes.io/name: dashy
    spec:
      automountServiceAccountToken: false
      containers:
        - image: lissy93/dashy:4.8.1@sha256:8c00203a5ed0ceeeaf773d38ddd656d7ba7151029fac1e75a2ae4245694b8619
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          name: dashy
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /app/user-data
              name: user-data
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: dashy
      volumes:
        - configMap:
            name: dashy
          name: user-data
