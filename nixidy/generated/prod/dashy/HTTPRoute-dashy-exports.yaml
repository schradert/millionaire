apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashy-exports
  namespace: home
spec:
  hostnames:
    - dashy.trdos.me
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: oauth2-proxy
          namespace: identity
          port: 4180
      matches:
        - path:
            type: Exact
            value: /bookmarks.html
        - path:
            type: Exact
            value: /catalog.json
