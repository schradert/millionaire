apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: dvd-webdav
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: dvd-webdav/password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: dvd-webdav
