apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: drives.dvd.trdos.me
spec:
  group: dvd.trdos.me
  names:
    kind: Drive
    plural: drives
    shortNames:
      - drv
    singular: drive
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.node
          name: Node
          type: string
        - jsonPath: .spec.enabled
          name: Enabled
          type: boolean
        - jsonPath: .status.state
          name: State
          type: string
        - jsonPath: .status.disc
          name: Disc
          type: string
        - jsonPath: .status.message
          name: Message
          priority: 1
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for DriveSpec via `CustomResource`
          properties:
            spec:
              description: An optical drive on a node. The agent creates it and owns `status`; people own `spec`.
              properties:
                ejectUnknown:
                  default: true
                  description: Eject discs that are not video DVDs (CDs, Blu-rays, data discs).
                  type: boolean
                enabled:
                  default: true
                  description: 'false: the agent never opens the drive (a game disc can sit in it).'
                  type: boolean
              type: object
            status:
              nullable: true
              properties:
                device:
                  type: string
                disc:
                  description: The Disc being read, if any.
                  nullable: true
                  type: string
                heartbeat:
                  description: RFC 3339; renewed every 30 s while the agent runs.
                  nullable: true
                  type: string
                message:
                  nullable: true
                  type: string
                model:
                  nullable: true
                  type: string
                node:
                  type: string
                serial:
                  nullable: true
                  type: string
                state:
                  enum:
                    - Waiting
                    - Disabled
                    - Paused
                    - Reading
                    - BackingUp
                    - Uploading
                    - Ejecting
                    - Error
                  type: string
              required:
                - device
                - node
                - state
              type: object
          required:
            - spec
          title: Drive
          type: object
      served: true
      storage: true
      subresources:
        status: {}
