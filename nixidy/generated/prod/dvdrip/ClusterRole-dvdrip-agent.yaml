apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dvdrip-agent
rules:
  - apiGroups:
      - dvd.trdos.me
    resources:
      - drives
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - dvd.trdos.me
    resources:
      - drives/status
    verbs:
      - get
      - patch
