apiVersion: batch/v1
kind: CronJob
metadata:
  name: dvdrip-import
  namespace: media
spec:
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: import
            app.kubernetes.io/name: dvdrip
        spec:
          containers:
            - args:
                - import
                - --dvd-root
                - /media/dvd
                - --rips
                - /rips
              image: harbor.trdos.me/library/dvdrip:0.1.4@sha256:90bc1b845a63d3614c8af44f90ab4df80ebfdbbbb2e3e763a2520d35eecf16d1
              name: import
              volumeMounts:
                - mountPath: /work
                  name: work
                  readOnly: false
                - mountPath: /tmp
                  name: tmp
                - mountPath: /media/dvd
                  name: dvd
                  readOnly: true
                - mountPath: /rips
                  name: rips
                  readOnly: true
          nodeSelector:
            kubernetes.io/hostname: falcon
          restartPolicy: Never
          serviceAccountName: dvdrip-agent
          tolerations:
            - effect: PreferNoSchedule
              key: node.trdos.me/class
              operator: Equal
              value: desktop
          volumes:
            - name: work
              persistentVolumeClaim:
                claimName: dvd-rip-work
            - emptyDir: {}
              name: tmp
            - name: dvd
              persistentVolumeClaim:
                claimName: media-dvd
                readOnly: true
            - hostPath:
                path: /data/dvd-rips
              name: rips
      ttlSecondsAfterFinished: 604800
  schedule: 0 0 1 1 *
  suspend: true
