apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dvdrip-agent
  namespace: media
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
      app.kubernetes.io/name: dvdrip
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent
        app.kubernetes.io/name: dvdrip
    spec:
      containers:
        - args:
            - agent
          env:
            - name: NTFY_URL
              value: https://ntfy.trdos.me/dvd
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: dvdrip-ntfy
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DVDRIP_RESCUE_MINUTES
              value: "180"
            - name: DVDRIP_TRIM_MINUTES
              value: "30"
            - name: DVDRIP_RERIP
              value: 78908b129df8,c950f29a8fd5
            - name: DVDRIP_PRESETS
              value: '{"07c30a5ac85c":{"name":"Rendition (2007)"},"13e61f2bb58e":{"name":"Vantage Point (2008)"},"1e81002f26cd":{"disc":2,"name":"The Illusionist (2006)"},"78908b129df8":{"name":"21 (2008)"},"ac42f9693e7a":{"name":"The Martian Child (2007)"},"f0c1551c027f":{"name":"Hitch (2005)"}}'
            - name: DVDRIP_SEED_DIR
              value: /rips
            - name: OTEL_SERVICE_NAME
              value: dvdrip-agent
          image: harbor.trdos.me/library/dvdrip:0.1.8@sha256:4b3b46f32cdab8f04014feef5cb27fc938483954b5a86889ec36a17b5e286090
          name: agent
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /work
              name: work
              readOnly: false
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/lib/dvd-rip
              name: staging
            - mountPath: /dev
              name: dev
            - mountPath: /run/udev
              name: udev
              readOnly: true
            - mountPath: /rips
              name: rips
              readOnly: true
      hostAliases:
        - hostnames:
            - ntfy.trdos.me
          ip: 100.64.0.1
      nodeSelector:
        dvd.trdos.me/drive: "true"
      serviceAccountName: dvdrip-agent
      terminationGracePeriodSeconds: 120
      tolerations:
        - effect: PreferNoSchedule
          key: node.trdos.me/class
          operator: Equal
          value: desktop
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: dvd-rip-work
        - emptyDir: {}
          name: tmp
        - hostPath:
            path: /var/lib/dvd-rip
            type: DirectoryOrCreate
          name: staging
        - hostPath:
            path: /dev
          name: dev
        - hostPath:
            path: /run/udev
          name: udev
        - hostPath:
            path: /data/dvd-rips
            type: DirectoryOrCreate
          name: rips
