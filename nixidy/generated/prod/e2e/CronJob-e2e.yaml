apiVersion: batch/v1
kind: CronJob
metadata:
  name: e2e
  namespace: e2e
spec:
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: e2e
        spec:
          automountServiceAccountToken: true
          containers:
            - args:
                - run
              env:
                - name: DOMAIN
                  value: trdos.me
                - name: E2E_IMAGE
                  value: harbor.trdos.me/library/e2e:0.3.7@sha256:afc1ac2cc3d099013801890a963f327cb351cbcd8a1bf586fd78ff0ae2cb9050
                - name: E2E_RUNNER
                  value: cluster
                - name: FLOCCUS_REPO
                  value: tristan/bookmarks
              image: harbor.trdos.me/library/e2e:0.3.7@sha256:afc1ac2cc3d099013801890a963f327cb351cbcd8a1bf586fd78ff0ae2cb9050
              name: e2e
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /secrets/e2e-keycloak
                  name: e2e-keycloak
                  readOnly: true
                - mountPath: /secrets/e2e-forgejo-admin
                  name: e2e-forgejo-admin
                  readOnly: true
          hostAliases:
            - hostnames:
                - ntfy.trdos.me
              ip: 100.64.0.1
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: e2e
          volumes:
            - emptyDir: {}
              name: tmp
            - name: e2e-keycloak
              secret:
                optional: true
                secretName: e2e-keycloak
            - name: e2e-forgejo-admin
              secret:
                optional: true
                secretName: e2e-forgejo-admin
      ttlSecondsAfterFinished: 86400
  schedule: 0 0 1 1 *
  suspend: true
