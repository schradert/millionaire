apiVersion: batch/v1
kind: CronJob
metadata:
  name: e2e
  namespace: e2e
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: e2e
        spec:
          automountServiceAccountToken: true
          containers:
            - args:
                - run
              env:
                - name: DOMAIN
                  value: trdos.me
                - name: E2E_IMAGE
                  value: harbor.trdos.me/library/e2e:0.9.0@sha256:fad0b4546522c1d8929b669b978613007dbff1c7d6b18ad4c478a3174ec2f6ba
                - name: E2E_REPORT_CONFIGMAP
                  value: e2e/e2e-last-report
                - name: E2E_RUNNER
                  value: cluster
                - name: FLOCCUS_REPO
                  value: tristan/bookmarks
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://alloy.observability.svc.cluster.local:4318
                - name: PYROSCOPE_SAMPLE_RATE
                  value: "1000"
                - name: PYROSCOPE_SERVER_ADDRESS
                  value: http://pyroscope.observability.svc.cluster.local:4040
              image: harbor.trdos.me/library/e2e:0.9.0@sha256:fad0b4546522c1d8929b669b978613007dbff1c7d6b18ad4c478a3174ec2f6ba
              name: e2e
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /config/catalog
                  name: catalog
                  readOnly: true
                - mountPath: /secrets/e2e-keycloak
                  name: e2e-keycloak
                  readOnly: true
                - mountPath: /secrets/e2e-forgejo-admin
                  name: e2e-forgejo-admin
                  readOnly: true
                - mountPath: /secrets/e2e-actual
                  name: e2e-actual
                  readOnly: true
                - mountPath: /secrets/e2e-argocd
                  name: e2e-argocd
                  readOnly: true
                - mountPath: /secrets/e2e-atuin
                  name: e2e-atuin
                  readOnly: true
                - mountPath: /secrets/e2e-baikal
                  name: e2e-baikal
                  readOnly: true
                - mountPath: /secrets/e2e-contextforge
                  name: e2e-contextforge
                  readOnly: true
                - mountPath: /secrets/e2e-firefly
                  name: e2e-firefly
                  readOnly: true
                - mountPath: /secrets/e2e-harbor
                  name: e2e-harbor
                  readOnly: true
                - mountPath: /secrets/e2e-immich
                  name: e2e-immich
                  readOnly: true
                - mountPath: /secrets/e2e-miniflux
                  name: e2e-miniflux
                  readOnly: true
                - mountPath: /secrets/e2e-ryot
                  name: e2e-ryot
                  readOnly: true
                - mountPath: /secrets/e2e-shoko
                  name: e2e-shoko
                  readOnly: true
                - mountPath: /secrets/e2e-syncthing
                  name: e2e-syncthing
                  readOnly: true
                - mountPath: /secrets/e2e-windmill
                  name: e2e-windmill
                  readOnly: true
          hostAliases:
            - hostnames:
                - ntfy.trdos.me
                - status.trdos.me
              ip: 100.64.0.1
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: e2e
          volumes:
            - emptyDir: {}
              name: tmp
            - configMap:
                name: e2e-catalog
              name: catalog
            - name: e2e-keycloak
              secret:
                optional: true
                secretName: e2e-keycloak
            - name: e2e-forgejo-admin
              secret:
                optional: true
                secretName: e2e-forgejo-admin
            - name: e2e-actual
              secret:
                optional: true
                secretName: e2e-actual
            - name: e2e-argocd
              secret:
                optional: true
                secretName: e2e-argocd
            - name: e2e-atuin
              secret:
                optional: true
                secretName: e2e-atuin
            - name: e2e-baikal
              secret:
                optional: true
                secretName: e2e-baikal
            - name: e2e-contextforge
              secret:
                optional: true
                secretName: e2e-contextforge
            - name: e2e-firefly
              secret:
                optional: true
                secretName: e2e-firefly
            - name: e2e-harbor
              secret:
                optional: true
                secretName: e2e-harbor
            - name: e2e-immich
              secret:
                optional: true
                secretName: e2e-immich
            - name: e2e-miniflux
              secret:
                optional: true
                secretName: e2e-miniflux
            - name: e2e-ryot
              secret:
                optional: true
                secretName: e2e-ryot
            - name: e2e-shoko
              secret:
                optional: true
                secretName: e2e-shoko
            - name: e2e-syncthing
              secret:
                optional: true
                secretName: e2e-syncthing
            - name: e2e-windmill
              secret:
                optional: true
                secretName: e2e-windmill
      ttlSecondsAfterFinished: 86400
  schedule: 15 3 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  timeZone: Etc/UTC
