apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-argocd
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: argocd-initial-admin-secret
        property: password
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-cicd
  target:
    template:
      data:
        password: '{{ .password }}'
