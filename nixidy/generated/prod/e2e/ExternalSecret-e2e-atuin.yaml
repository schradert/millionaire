apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-atuin
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: atuin-e2e
        property: password
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-development
  target:
    template:
      data:
        password: '{{ .password }}'
