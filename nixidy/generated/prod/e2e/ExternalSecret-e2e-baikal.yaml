apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-baikal
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: baikal
        property: BAIKAL_ADMIN_PASSWORD
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-home
  target:
    template:
      data:
        password: '{{ .password }}'
