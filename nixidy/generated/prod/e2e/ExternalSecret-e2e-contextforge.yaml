apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-contextforge
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: contextforge-admin
        property: PLATFORM_ADMIN_PASSWORD
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-ai
  target:
    template:
      data:
        password: '{{ .password }}'
