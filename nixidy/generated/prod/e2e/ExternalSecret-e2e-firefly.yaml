apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-firefly
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: firefly-passport
        property: FIREFLY_E2E_ACCESS_TOKEN
      secretKey: token
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-finance
  target:
    template:
      data:
        token: '{{ .token }}'
