apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-forgejo-admin
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: forgejo-admin
        property: username
      secretKey: username
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-development
    - remoteRef:
        key: forgejo-admin
        property: password
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-development
  target:
    template:
      data:
        password: '{{ .password }}'
        username: '{{ .username }}'
