apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-harbor
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: harbor
        property: HARBOR_ADMIN_PASSWORD
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-cicd
  target:
    template:
      data:
        password: '{{ .password }}'
