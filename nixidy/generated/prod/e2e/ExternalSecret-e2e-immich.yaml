apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-immich
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: immich-e2e-api-key
        property: api-key
      secretKey: apikey
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
  target:
    template:
      data:
        apikey: '{{ .apikey }}'
