apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-keycloak
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: e2e
        property: client-id
      secretKey: clientId
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-e2e-keycloak
    - remoteRef:
        key: e2e
        property: client-secret
      secretKey: clientSecret
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-e2e-keycloak
  target:
    template:
      data:
        client-id: '{{ .clientId }}'
        client-secret: '{{ .clientSecret }}'
