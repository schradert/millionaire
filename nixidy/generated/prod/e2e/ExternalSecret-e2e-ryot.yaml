apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-ryot
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: ryot-admin-token
        property: password
      secretKey: token
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
  target:
    template:
      data:
        token: '{{ .token }}'
