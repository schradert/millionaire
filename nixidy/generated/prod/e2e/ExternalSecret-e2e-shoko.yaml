apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-shoko
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: shoko-admin
        property: password
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
  target:
    template:
      data:
        password: '{{ .password }}'
