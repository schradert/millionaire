apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-syncthing
  namespace: e2e
spec:
  data:
    - remoteRef:
        key: syncthing
        property: STGUIAPIKEY
      secretKey: apikey
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-home
  target:
    template:
      data:
        apikey: '{{ .apikey }}'
