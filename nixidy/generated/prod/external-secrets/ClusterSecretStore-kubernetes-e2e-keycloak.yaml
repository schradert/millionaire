apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-e2e-keycloak
spec:
  conditions:
    - namespaces:
        - e2e
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: kubernetes-e2e-keycloak
          namespace: security
      remoteNamespace: identity
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: security
          type: ConfigMap
