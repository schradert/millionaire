apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-secrets
  namespace: security
spec:
  podMetricsEndpoints:
    - interval: 1m
      port: metrics
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - external-secrets
          - external-secrets-cert-controller
          - external-secrets-webhook
    matchLabels:
      app.kubernetes.io/instance: external-secrets
