apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: faro-sdk
  namespace: observability
spec:
  hostnames:
    - faro.trdos.me
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: faro-sdk
          port: 80
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              replacePrefixMatch: /
              type: ReplacePrefixMatch
      matches:
        - path:
            type: PathPrefix
            value: /sdk
