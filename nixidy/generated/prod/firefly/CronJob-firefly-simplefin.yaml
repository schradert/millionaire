apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-simplefin
  namespace: finance
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: firefly-simplefin
        spec:
          containers:
            - command:
                - sh
                - -c
                - cd /var/www/html && php artisan config:clear >/dev/null && php /simplefin/import.php
              env:
                - name: FIREFLY_III_URL
                  value: http://firefly.finance.svc.cluster.local:8080
                - name: IGNORE_DUPLICATE_ERRORS
                  value: "true"
                - name: IMPORT_DIR_ALLOWLIST
                  value: /tmp/simplefin
                - name: LOG_CHANNEL
                  value: stderr
                - name: LOG_LEVEL
                  value: info
                - name: SIMPLEFIN_RETRY_ATTEMPTS
                  value: "1"
                - name: VANITY_URL
                  value: https://firefly.trdos.me
                - name: FIREFLY_III_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: FIREFLY_III_ACCESS_TOKEN
                      name: firefly-passport
              image: fireflyiii/data-importer:version-2.2.1@sha256:98cb3aa6dbd6681cbdc590a5d70dd7d964b637bac863d947bcbc20448ac56b8a
              name: firefly-simplefin
              resources:
                requests:
                  cpu: 25m
                  memory: 80Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - mountPath: /simplefin
                  name: script
                  readOnly: true
                - mountPath: /secrets/simplefin
                  name: token
                  readOnly: true
          restartPolicy: Never
          securityContext:
            runAsGroup: 33
            runAsNonRoot: true
            runAsUser: 33
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: firefly-simplefin
          volumes:
            - configMap:
                name: firefly-simplefin
              name: script
            - name: token
              secret:
                secretName: firefly-simplefin
      ttlSecondsAfterFinished: 172800
  schedule: 41 9 * * *
  successfulJobsHistoryLimit: 1
