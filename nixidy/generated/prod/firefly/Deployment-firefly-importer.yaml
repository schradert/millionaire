apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: firefly-importer
    app.kubernetes.io/instance: firefly-importer
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: firefly-importer
  name: firefly-importer
  namespace: finance
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: firefly-importer
      app.kubernetes.io/instance: firefly-importer
      app.kubernetes.io/name: firefly-importer
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: c433cd5cfe57a365b7d26bdd70406015f30934289adc82125148d0762863c867
      labels:
        app.kubernetes.io/controller: firefly-importer
        app.kubernetes.io/instance: firefly-importer
        app.kubernetes.io/name: firefly-importer
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: FIREFLY_III_ACCESS_TOKEN_FILE
              value: /secrets/app_token.txt
          image: fireflyiii/data-importer:version-2.2.1@sha256:98cb3aa6dbd6681cbdc590a5d70dd7d964b637bac863d947bcbc20448ac56b8a
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 5
          name: firefly-importer
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 80Mi
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /.env
              name: config
              readOnly: true
              subPath: .env
            - mountPath: /secrets
              name: secrets
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: firefly-importer
      volumes:
        - configMap:
            name: firefly-importer
          name: config
        - name: secrets
          secret:
            items:
              - key: FIREFLY_III_ACCESS_TOKEN
                path: app_token.txt
            secretName: firefly-passport
