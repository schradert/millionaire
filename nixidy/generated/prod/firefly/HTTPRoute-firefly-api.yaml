apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly-api
  namespace: finance
spec:
  hostnames:
    - firefly.trdos.me
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: firefly
          port: 8080
      filters:
        - requestHeaderModifier:
            remove:
              - X-Auth-Request-Preferred-Username
              - X-Auth-Request-Email
              - X-Auth-Request-User
              - X-Auth-Request-Groups
              - X-Forwarded-Preferred-Username
              - X-Forwarded-User
              - X-Forwarded-Email
              - Remote-User
              - X_Auth_Request_Preferred_Username
              - X_Auth_Request_Email
              - X_Auth_Request_User
              - X_Auth_Request_Groups
              - X_Forwarded_Preferred_Username
              - X_Forwarded_User
              - X_Forwarded_Email
              - Remote_User
          type: RequestHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /api/v1
