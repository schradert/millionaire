apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firefly-simplefin
  namespace: finance
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - firefly-simplefin-access
    resources:
      - secrets
    verbs:
      - get
      - patch
