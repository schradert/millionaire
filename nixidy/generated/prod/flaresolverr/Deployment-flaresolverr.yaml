apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: flaresolverr
    app.kubernetes.io/instance: flaresolverr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: flaresolverr
  name: flaresolverr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: flaresolverr
      app.kubernetes.io/instance: flaresolverr
      app.kubernetes.io/name: flaresolverr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: flaresolverr
        app.kubernetes.io/instance: flaresolverr
        app.kubernetes.io/name: flaresolverr
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: PROMETHEUS_ENABLED
              value: "true"
            - name: PROMETHEUS_PORT
              value: "8192"
          image: ghcr.io/flaresolverr/flaresolverr:v3.4.6@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8191
            timeoutSeconds: 5
          name: flaresolverr
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8191
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8191
            timeoutSeconds: 5
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: flaresolverr
