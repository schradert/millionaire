apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-password
  namespace: development
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: password
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: forgejo-admin-password
  refreshPolicy: CreatedOnce
