apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: forgejo-bootstrap
  namespace: development
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - forgejo
          env:
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: FORGEJO_URL
              value: http://forgejo-http.development.svc.cluster.local:3000
            - name: REPO
              value: bookmarks
            - name: SECRET_NAME
              value: forgejo-tristan-floccus
            - name: TOKEN_NAME
              value: floccus
            - name: TOKEN_SCOPES
              value: write:repository
            - name: USER
              value: tristan
            - name: USER_EMAIL
              value: t0rdos@pm.me
          image: harbor.trdos.me/library/app-bootstrap:0.19.0@sha256:57f0ad275f93a239d07637c7d5144d8cb6402d7df84e62e056b664187bddda10
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: forgejo-bootstrap
      volumes:
        - name: admin
          secret:
            secretName: forgejo-admin
