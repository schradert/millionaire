apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: forgejo-bootstrap
  namespace: development
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - forgejo
          env:
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: FORGEJO_URL
              value: http://forgejo-http.development.svc.cluster.local:3000
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: REPO
              value: bookmarks
            - name: SECRET_NAME
              value: forgejo-tristan-floccus
            - name: TOKEN_NAME
              value: floccus
            - name: TOKEN_SCOPES
              value: write:repository
            - name: USER
              value: tristan
            - name: USER_EMAIL
              value: t0rdos@pm.me
          image: harbor.trdos.me/library/app-bootstrap:0.21.0@sha256:c9c03ae43d7502edf415eff12c7e2b8c8206d0b3ff5b80e9c08d6142a6e9bb53
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: forgejo-bootstrap
      volumes:
        - emptyDir: {}
          name: tmp
        - name: admin
          secret:
            secretName: forgejo-admin
