apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: forgejo-tristan-floccus
  namespace: development
spec:
  data:
    - match:
        remoteRef:
          remoteKey: forgejo/tristan/floccus-token
        secretKey: token
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: forgejo-tristan-floccus
