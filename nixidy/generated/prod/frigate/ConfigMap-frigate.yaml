apiVersion: v1
data:
  config.yml: "%YAML 1.1\n---\ncameras:\n  back:\n    detect:\n      fps: 5\n      height: 720\n      width: 1280\n    enabled: true\n    ffmpeg:\n      inputs:\n      - path: \n          rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@{FRIGATE_CAM_BACK_IP}:554/h264Preview_01_main\n        roles:\n        - record\n      - path: \n          rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@{FRIGATE_CAM_BACK_IP}:554/h264Preview_01_sub\n        roles:\n        - detect\n    objects:\n      track:\n      - person\n      - car\n      - dog\n      - cat\n    record:\n      enabled: true\n      events:\n        retain:\n          default: 14\n      retain:\n        days: 7\n    snapshots:\n      enabled: true\n      retain:\n        default: 14\n  front:\n    detect:\n      fps: 5\n      height: 720\n      width: 1280\n    enabled: true\n    ffmpeg:\n      inputs:\n      - path: \n          rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@{FRIGATE_CAM_FRONT_IP}:554/h264Preview_01_main\n        roles:\n        - record\n      - path: \n          rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS}@{FRIGATE_CAM_FRONT_IP}:554/h264Preview_01_sub\n        roles:\n        - detect\n    objects:\n      track:\n      - person\n      - car\n      - dog\n      - cat\n    record:\n      enabled: true\n      events:\n        retain:\n          default: 14\n      retain:\n        days: 7\n    snapshots:\n      enabled: true\n      retain:\n        default: 14\ndetectors:\n  ov:\n    device: AUTO\n    model:\n      path: /openvino-model/ssdlite_mobilenet_v2.xml\n    type: openvino\nffmpeg:\n  hwaccel_args: preset-vaapi\nmqtt:\n  enabled: true\n  host: mosquitto.home.svc.cluster.local\n  port: 1883\n  topic_prefix: frigate\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: frigate
  name: frigate
  namespace: home
