apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--frigate--frigate-clips-src
  namespace: home
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--frigate--frigate-clips
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: frigate-clips
  trigger:
    schedule: 0 4 * * *
