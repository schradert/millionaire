apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--frigate--frigate-exports-src
  namespace: home
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--frigate--frigate-exports
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: frigate-exports
  trigger:
    schedule: 0 4 * * *
