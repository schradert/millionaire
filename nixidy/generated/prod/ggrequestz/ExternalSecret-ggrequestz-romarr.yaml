apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ggrequestz-romarr
  namespace: media
spec:
  data:
    - remoteRef:
        key: romarr-api
        property: ROMARR_API_KEY
      secretKey: key
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
  target:
    template:
      data:
        REQUEST_WEBHOOK_URL: http://romarr.media.svc.cluster.local:6868/api/v1/webhook/ggrequestz?apikey={{ .key }}
