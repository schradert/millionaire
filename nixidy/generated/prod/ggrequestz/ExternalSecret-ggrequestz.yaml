apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ggrequestz
  namespace: media
spec:
  data:
    - remoteRef:
        key: ggrequestz-app
        property: password
      secretKey: POSTGRES_PASSWORD
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: ggrequestz
        property: client-secret
      secretKey: OIDC_CLIENT_SECRET
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-identity
    - remoteRef:
        key: romm-tristan-client-token
        property: token
      secretKey: ROMM_API_TOKEN
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
