apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: ggrequestz-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - ggrequestz
          env:
            - name: ADMIN_EMAIL
              value: t0rdos@pm.me
            - name: ADMIN_NAME
              value: Tristan Schrader
            - name: ADMIN_USER
              value: tristan
            - name: GGREQUESTZ_DB_PASSWORD_FILE
              value: /secrets/db/password
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
          image: harbor.trdos.me/library/app-bootstrap:0.48.0@sha256:28b2bd56dc1ea3610e5744214212cf1031a236ce483a905f6f4ec2f7e494e2c2
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/db
              name: db
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: db
          secret:
            secretName: ggrequestz-app
