apiVersion: v1
data:
  tempo.yaml: '{"apiVersion":1,"datasources":[{"access":"proxy","editable":false,"jsonData":{"nodeGraph":{"enabled":true},"serviceMap":{"datasourceUid":"prometheus"},"tracesToLogsV2":{"customQuery":true,"datasourceUid":"loki","query":"{namespace=~\".+\"} |= \"$${__trace.traceId}\"","spanEndTimeShift":"5m","spanStartTimeShift":"-5m"},"tracesToMetrics":{"datasourceUid":"prometheus","queries":[{"name":"Request rate","query":"sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))"},{"name":"Error rate","query":"sum(rate(traces_spanmetrics_calls_total{$$__tags, status_code=\"STATUS_CODE_ERROR\"}[5m]))"},{"name":"p95 latency","query":"histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])) by (le))"}],"spanEndTimeShift":"5m","spanStartTimeShift":"-5m","tags":[{"key":"service.name","value":"service"}]},"tracesToProfiles":{"datasourceUid":"pyroscope","profileTypeId":"process_cpu:cpu:nanoseconds:cpu:nanoseconds","spanEndTimeShift":"5m","spanStartTimeShift":"-5m","tags":[{"key":"service.name","value":"service_name"}]}},"name":"Tempo","type":"tempo","uid":"tempo","url":"http://tempo.observability.svc.cluster.local:3200"}]}'
kind: ConfigMap
metadata:
  labels:
    grafana_datasource: "1"
  name: grafana-datasource-tempo
  namespace: observability
