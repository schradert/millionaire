apiVersion: v1
data:
  GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
  GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  GF_ANALYTICS_REPORTING_ENABLED: "false"
  GF_AUTH_ANONYMOUS_ENABLED: "false"
  GF_AUTH_BASIC_ENABLED: "false"
  GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
  GF_AUTH_GENERIC_OAUTH_API_URL: https://keycloak.trdos.me/realms/default/protocol/openid-connect/userinfo
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://keycloak.trdos.me/realms/default/protocol/openid-connect/auth
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
  GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
  GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
  GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'admin') && 'GrafanaAdmin' || 'Viewer'
  GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
  GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: https://keycloak.trdos.me/realms/default/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.trdos.me%2Flogin
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://keycloak.trdos.me/realms/default/protocol/openid-connect/token
  GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
  GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /tmp/dashboards/home.json
  GF_DATE_FORMATS_USE_BROWSER_LOCALE: "true"
  GF_EXPLORE_ENABLED: "true"
  GF_FEATURE_TOGGLES_ENABLE: publicDashboards
  GF_LOG_MODE: console
  GF_NEWS_NEWS_FEED_ENABLED: "false"
  GF_SECURITY_COOKIE_SAMESITE: grafana
  GF_SERVER_ROOT_URL: https://grafana.trdos.me
  GF_SMTP_ENABLED: "true"
  GF_SMTP_FROM_ADDRESS: noreply@trdos.me
  GF_SMTP_FROM_NAME: Grafana
  GF_SMTP_HOST: stalwart.mail.svc.cluster.local:25
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = ''
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
kind: ConfigMap
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana
  name: grafana
  namespace: observability
