apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-api
  namespace: cicd
spec:
  hostnames:
    - harbor.trdos.me
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: harbor
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /v2/
        - path:
            type: PathPrefix
            value: /service/
        - path:
            type: PathPrefix
            value: /api/
