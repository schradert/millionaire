apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--harbor--harbor-jobservice-src
  namespace: cicd
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--harbor--harbor-jobservice
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: harbor-jobservice
  trigger:
    schedule: 0 4 * * *
