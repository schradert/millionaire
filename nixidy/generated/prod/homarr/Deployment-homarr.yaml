apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: homarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: homarr
  name: homarr
  namespace: home
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: homarr
      app.kubernetes.io/name: homarr
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: homarr
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: homarr
    spec:
      containers:
        - env:
            - name: ENABLE_DOCKER
              value: "false"
            - name: ENABLE_KUBERNETES
              value: "false"
            - name: AUTH_COOKIE_PREFIX
              value: homarr
            - name: AUTH_LDAP_GROUP_CLASS
              value: groupOfUniqueNames
            - name: AUTH_LDAP_GROUP_MEMBER_ATTRIBUTE
              value: member
            - name: AUTH_LDAP_GROUP_MEMBER_USER_ATTRIBUTE
              value: dn
            - name: AUTH_LDAP_SEARCH_SCOPE
              value: base
            - name: AUTH_LDAP_USERNAME_ATTRIBUTE
              value: uid
            - name: AUTH_LDAP_USER_MAIL_ATTRIBUTE
              value: mail
            - name: AUTH_OIDC_AUTO_LOGIN
              value: "true"
            - name: AUTH_OIDC_CLIENT_NAME
              value: Keycloak
            - name: AUTH_OIDC_GROUPS_ATTRIBUTE
              value: groups
            - name: AUTH_OIDC_ISSUER
              value: https://keycloak.trdos.me/realms/default
            - name: AUTH_OIDC_SCOPE_OVERWRITE
              value: openid email profile groups
            - name: AUTH_PROVIDERS
              value: oidc,credentials
            - name: AUTH_SESSION_EXPIRY_TIME
              value: 30d
            - name: ENABLE_DNS_CACHING
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: NO_EXTERNAL_CONNECTION
              value: "false"
            - name: TZ
              value: America/Los_Angeles
            - name: DB_MIGRATIONS_DISABLED
              value: "false"
            - name: DB_DRIVER
              value: node-postgres
            - name: DB_DIALECT
              value: postgresql
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: homarr-app
            - name: AUTH_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: homarr-oidc
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client_secret
                  name: homarr-oidc
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: db-encryption-key
                  name: homarr-db-encryption
          image: ghcr.io/homarr-labs/homarr:v2.4.0@sha256:b65975397d0900914d4147764ff4979a164ccb2b61bb93515983f8bdcafd3413
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health/live
              port: 7575
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
          name: homarr
          ports:
            - containerPort: 7575
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health/ready
              port: 7575
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
          resources: {}
          securityContext: {}
      securityContext: {}
