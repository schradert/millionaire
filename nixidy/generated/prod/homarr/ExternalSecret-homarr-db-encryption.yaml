apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-db-encryption
  namespace: home
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: db-encryption-key
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: homarr-db-encryption
  refreshPolicy: CreatedOnce
