apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-oidc
  namespace: home
spec:
  data:
    - remoteRef:
        key: homarr
        property: client-secret
      secretKey: client_secret
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-identity
  target:
    template:
      data:
        client_id: homarr
        client_secret: '{{ .client_secret }}'
