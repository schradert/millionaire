apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: homarr-db-encryption
  namespace: home
spec:
  data:
    - match:
        remoteRef:
          remoteKey: homarr/db-encryption-key
        secretKey: db-encryption-key
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: homarr-db-encryption
