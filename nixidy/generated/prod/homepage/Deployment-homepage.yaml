apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: homepage
    app.kubernetes.io/instance: homepage
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: homepage
  name: homepage
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: homepage
      app.kubernetes.io/instance: homepage
      app.kubernetes.io/name: homepage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: homepage
        app.kubernetes.io/instance: homepage
        app.kubernetes.io/name: homepage
    spec:
      automountServiceAccountToken: true
      containers:
        - env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.trdos.me
            - name: HOMEPAGE_AUTH_ENABLED
              value: "true"
            - name: HOMEPAGE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  key: password
                  name: homepage-auth
            - name: HOMEPAGE_EXTERNAL_URL
              value: https://home.trdos.me
            - name: HOMEPAGE_OIDC_AUTO_LOGIN
              value: "true"
            - name: HOMEPAGE_OIDC_CLIENT_ID
              value: homepage
            - name: HOMEPAGE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client_secret
                  name: homepage-oidc
            - name: HOMEPAGE_OIDC_ISSUER
              value: https://keycloak.trdos.me/realms/default
            - name: HOMEPAGE_OIDC_NAME
              value: Keycloak
          image: ghcr.io/gethomepage/homepage:v2.5.0@sha256:57c4a0531937889c0b968b120fe9c2560bbe036b5c9e18c49a9e2479de9975d1
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: home.trdos.me
              path: /api/healthcheck
              port: http
          name: homepage
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: home.trdos.me
              path: /api/healthcheck
              port: http
          resources:
            requests:
              cpu: 35m
              memory: 160Mi
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 3000
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /app/config
              name: config
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: homepage
      volumes:
        - configMap:
            name: homepage
          name: config
