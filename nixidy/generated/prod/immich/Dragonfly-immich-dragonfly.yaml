apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: immich-dragonfly
  namespace: media
spec:
  args:
    - --proactor_threads
    - "2"
    - --default_lua_flags=allow-undeclared-keys
  replicas: 1
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 25m
      memory: 512Mi
