apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: immich-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - immich
          env:
            - name: ADMIN_EMAIL
              value: t0rdos@pm.me
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: API_KEY_SECRET
              value: immich-tristan-api-key
            - name: IMMICH_URL
              value: http://immich-server.media.svc.cluster.local:2283
            - name: REQUIRE_OAUTH
              value: "1"
          image: harbor.trdos.me/library/app-bootstrap:0.19.0@sha256:57f0ad275f93a239d07637c7d5144d8cb6402d7df84e62e056b664187bddda10
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: immich-bootstrap
      volumes:
        - name: admin
          secret:
            secretName: immich-admin
