apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: immich-tristan-api-key
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: immich/tristan/api-key
        secretKey: api-key
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: immich-tristan-api-key
