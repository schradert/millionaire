apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-bootstrap
  namespace: media
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - immich-tristan-api-key
    resources:
      - secrets
    verbs:
      - get
      - patch
