apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jellyfin
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: jellyfin
      app.kubernetes.io/instance: jellyfin
      app.kubernetes.io/name: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: jellyfin
        app.kubernetes.io/instance: jellyfin
        app.kubernetes.io/name: jellyfin
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          image: ghcr.io/jellyfin/jellyfin:10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8096
            timeoutSeconds: 1
          name: jellyfin
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8096
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 60
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8096
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /config/metadata
              name: cache
            - mountPath: /config
              name: config
            - mountPath: /media/audiobooks
              name: media-audiobooks
              readOnly: true
            - mountPath: /media/books
              name: media-books
              readOnly: true
            - mountPath: /media/comics
              name: media-comics
              readOnly: true
            - mountPath: /media/downloads
              name: media-downloads
              readOnly: true
            - mountPath: /media/dvd
              name: media-dvd
              readOnly: true
            - mountPath: /media/movies
              name: media-movies
              readOnly: true
            - mountPath: /media/music
              name: media-music
              readOnly: true
            - mountPath: /media/sports
              name: media-sports
              readOnly: true
            - mountPath: /media/tv
              name: media-tv
              readOnly: true
            - mountPath: /cache
              name: tmpfs
              subPath: cache
            - mountPath: /config/log
              name: tmpfs
              subPath: log
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - command:
            - sh
            - -c
            - f=/config/config/system.xml; [ -f $f ] && sed -i 's|<EnableMetrics>false</EnableMetrics>|<EnableMetrics>true</EnableMetrics>|' $f || true
          image: ghcr.io/jellyfin/jellyfin:10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112
          name: metrics
          volumeMounts:
            - mountPath: /config/metadata
              name: cache
            - mountPath: /config
              name: config
            - mountPath: /cache
              name: tmpfs
              subPath: cache
            - mountPath: /config/log
              name: tmpfs
              subPath: log
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
      nodeSelector:
        nvidia.com/gpu.present: "true"
      runtimeClassName: nvidia
      serviceAccountName: jellyfin
      tolerations:
        - effect: PreferNoSchedule
          key: node.trdos.me/class
          operator: Equal
          value: desktop
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media-audiobooks
          persistentVolumeClaim:
            claimName: media-audiobooks
        - name: media-books
          persistentVolumeClaim:
            claimName: media-books
        - name: media-comics
          persistentVolumeClaim:
            claimName: media-comics
        - name: media-downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - name: media-dvd
          persistentVolumeClaim:
            claimName: media-dvd
        - name: media-movies
          persistentVolumeClaim:
            claimName: media-movies
        - name: media-music
          persistentVolumeClaim:
            claimName: media-music
        - name: media-sports
          persistentVolumeClaim:
            claimName: media-sports
        - name: media-tv
          persistentVolumeClaim:
            claimName: media-tv
        - emptyDir: {}
          name: tmpfs
