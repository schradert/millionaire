apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: jellyfin-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args: []
          env:
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: ENABLE_CONTENT_DOWNLOADING
              value: "true"
            - name: ENCODING_DECODING_CODECS
              value: h264,hevc,vp9,av1
            - name: ENCODING_HW_ACCEL
              value: nvenc
            - name: ENCODING_TONEMAPPING
              value: "true"
            - name: JELLYFIN_URL
              value: http://jellyfin.media.svc.cluster.local:8096
            - name: LOCAL_NETWORK_SUBNETS
              value: 192.168.50.0/24
            - name: MAINTAINERR_KEY_GENERATION
              value: "2"
            - name: MAINTAINERR_URL
              value: http://maintainerr.media.svc.cluster.local:6246
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PLUGINS
              value: TMDb Box Sets|bc4aad2e-d3d0-4725-a5e2-fd07949e5b42|13.0.0.0,Webhook|71552a5a5c5c4350a2aeebe451a30173|21.0.0.0,SmartLists|A0A2A7B2-747A-4113-8B39-757A9D267C79|12.0.1.0|https://raw.githubusercontent.com/jyourstone/jellyfin-plugin-manifest/main/manifest.json,Intro Skipper|c83d86bb-a1e0-4c35-a113-e2101cf4ee6b|1.10.11.24|https://intro-skipper.org/manifest.json
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: REMOTE_BITRATE_LIMIT
              value: "8000000"
            - name: SSO_ISSUER
              value: https://keycloak.trdos.me/realms/default
            - name: SSO_SECRET_FILE
              value: /secrets/oidc/client_secret
          image: harbor.trdos.me/library/jellyfin-bootstrap:0.7.0@sha256:0b3466ac137cd52e1a9bcc6e6f0012cd6ff3e89d5ae0c8894794ea991a93bec4
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
            - mountPath: /secrets/oidc
              name: oidc
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: admin
          secret:
            secretName: jellyfin-admin
        - name: oidc
          secret:
            secretName: jellyfin-oidc
