apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: jellyfin-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      containers:
        - env:
            - name: JELLYFIN_URL
              value: http://jellyfin.media.svc.cluster.local:8096
            - name: MAINTAINERR_URL
              value: http://maintainerr.media.svc.cluster.local:6246
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: SSO_ISSUER
              value: https://keycloak.trdos.me/realms/default
            - name: SSO_SECRET_FILE
              value: /secrets/oidc/client_secret
          image: harbor.trdos.me/library/jellyfin-bootstrap:0.2.0@sha256:b5f0b93064efa481469c8b93c86a17fc54f39a0900bb943058791e6fe35245f5
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
            - mountPath: /secrets/oidc
              name: oidc
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: admin
          secret:
            secretName: jellyfin-admin
        - name: oidc
          secret:
            secretName: jellyfin-oidc
