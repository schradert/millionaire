apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: jvb
    app.kubernetes.io/instance: jitsi
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jitsi-meet
  name: jitsi-jitsi-meet-jvb
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: jvb
      app.kubernetes.io/instance: jitsi
      app.kubernetes.io/name: jitsi-meet
  template:
    metadata:
      annotations:
        checksum/config: 426fc8dce1f80cb770142dd3da65bf5fcaebac4792b7ab0c02bcaa16fd5881a3
        checksum/secret: d5c609f3188abc6e7289051976f252fb103cfb75ced37488abb1efc093871607
      labels:
        app.kubernetes.io/component: jvb
        app.kubernetes.io/instance: jitsi
        app.kubernetes.io/name: jitsi-meet
    spec:
      containers:
        - env:
            - name: DOCKER_HOST_ADDRESS
              value: 192.168.50.254
            - name: JVB_ADVERTISE_IPS
              value: 192.168.50.254
            - name: JVB_WS_SERVER_ID
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: jitsi-prosody-jvb
            - configMapRef:
                name: jitsi-prosody-common
            - configMapRef:
                name: jitsi-jitsi-meet-jvb
          image: jitsi/jvb:jvb-2.3-280-g159a678e5-1@sha256:27d74c778b7215c51267bc140006fc4fe19d06275c00dc87783eb0cbb888884f
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /about/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          name: jitsi-meet
          ports:
            - containerPort: 10000
              name: rtp-udp
              protocol: UDP
            - containerPort: 9090
              name: colibri-ws-tcp
              protocol: TCP
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /about/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 336Mi
          securityContext: {}
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /about/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
        - command:
            - /prometheus-jitsi-meet-exporter
            - -videobridge-url
            - http://localhost:8080/colibri/stats
          image: systemli/prometheus-jitsi-meet-exporter:1.4.2@sha256:30fff1244515284b9c40c86c315283cd5a65ac24e17f70d320e08c5a3d0a6c06
          imagePullPolicy: IfNotPresent
          name: metrics
          ports:
            - containerPort: 9888
              name: tcp-metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 9888
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 20m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            runAsUser: 10001
      securityContext: {}
      serviceAccountName: jitsi-jitsi-meet
