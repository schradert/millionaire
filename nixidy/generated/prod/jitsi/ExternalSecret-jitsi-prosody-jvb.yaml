apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jitsi-prosody-jvb
  namespace: media
spec:
  data:
    - remoteRef:
        key: jitsi-jvb
        property: password
      secretKey: jvb
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-media
  target:
    template:
      data:
        JVB_AUTH_PASSWORD: '{{ .jvb }}'
        JVB_AUTH_USER: jvb
