apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: kavita
    app.kubernetes.io/instance: kavita
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kavita
  name: kavita
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: kavita
      app.kubernetes.io/instance: kavita
      app.kubernetes.io/name: kavita
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: kavita
        app.kubernetes.io/instance: kavita
        app.kubernetes.io/name: kavita
    spec:
      automountServiceAccountToken: false
      containers:
        - image: jvmilazz0/kavita:0.9.1@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5000
            timeoutSeconds: 5
          name: kavita
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5000
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 40m
              memory: 464Mi
          startupProbe:
            failureThreshold: 60
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5000
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /kavita/config
              name: config
            - mountPath: /media/books
              name: media-books
              readOnly: true
            - mountPath: /media/comics
              name: media-comics
              readOnly: true
            - mountPath: /media/downloads
              name: media-downloads
              readOnly: true
            - mountPath: /media/manga
              name: media-manga
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: kavita
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita
        - name: media-books
          persistentVolumeClaim:
            claimName: media-books
        - name: media-comics
          persistentVolumeClaim:
            claimName: media-comics
        - name: media-downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - name: media-manga
          persistentVolumeClaim:
            claimName: media-manga
