apiVersion: v1
data:
  realm-default.json: '{"authenticationFlows":[{"alias":"browser-passkey","authenticationExecutions":[{"authenticator":"auth-cookie","authenticatorFlow":false,"priority":10,"requirement":"ALTERNATIVE","userSetupAllowed":false},{"authenticator":"identity-provider-redirector","authenticatorFlow":false,"priority":20,"requirement":"ALTERNATIVE","userSetupAllowed":false},{"authenticatorFlow":true,"flowAlias":"browser-passkey forms","priority":30,"requirement":"ALTERNATIVE","userSetupAllowed":false}],"builtIn":false,"description":"Passkey first, password + second factor fallback","providerId":"basic-flow","topLevel":true},{"alias":"browser-passkey forms","authenticationExecutions":[{"authenticator":"auth-username-form","authenticatorFlow":false,"priority":10,"requirement":"REQUIRED","userSetupAllowed":false},{"authenticatorFlow":true,"flowAlias":"browser-passkey method","priority":20,"requirement":"REQUIRED","userSetupAllowed":false}],"builtIn":false,"description":"Username, then a method","providerId":"basic-flow","topLevel":false},{"alias":"browser-passkey method","authenticationExecutions":[{"authenticator":"webauthn-authenticator-passwordless","authenticatorFlow":false,"priority":10,"requirement":"ALTERNATIVE","userSetupAllowed":false},{"authenticatorFlow":true,"flowAlias":"browser-passkey password","priority":20,"requirement":"ALTERNATIVE","userSetupAllowed":false}],"builtIn":false,"description":"Passkey, or password + second factor","providerId":"basic-flow","topLevel":false},{"alias":"browser-passkey password","authenticationExecutions":[{"authenticator":"auth-password-form","authenticatorFlow":false,"priority":10,"requirement":"REQUIRED","userSetupAllowed":false},{"authenticatorFlow":true,"flowAlias":"browser-passkey 2fa","priority":20,"requirement":"CONDITIONAL","userSetupAllowed":false}],"builtIn":false,"description":"Password, then a configured second factor","providerId":"basic-flow","topLevel":false},{"alias":"browser-passkey 2fa","authenticationExecutions":[{"authenticator":"conditional-user-configured","authenticatorFlow":false,"priority":10,"requirement":"REQUIRED","userSetupAllowed":false},{"authenticator":"auth-otp-form","authenticatorFlow":false,"priority":20,"requirement":"ALTERNATIVE","userSetupAllowed":false},{"authenticator":"webauthn-authenticator","authenticatorFlow":false,"priority":30,"requirement":"ALTERNATIVE","userSetupAllowed":false}],"builtIn":false,"description":"OTP or security key, if configured","providerId":"basic-flow","topLevel":false}],"browserFlow":"browser-passkey","realm":"default"}'
  users.sh: |+
    set -euo pipefail
    export HOME=/tmp
    kc() { /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm.config; }
    for i in $(seq 60); do
      kc config credentials --server "$KEYCLOAK_URL" --realm master \
        --user "$KEYCLOAK_USER" --password "$KEYCLOAK_PASSWORD" >/dev/null 2>&1 && break
      [ "$i" = 60 ] && { echo "keycloak admin login failed"; exit 1; }
      sleep 5
    done
    R=default
    U=$(kc get users -r $R -q username=tristan -q exact=true --fields id --format csv --noquotes)
    [ -n "$U" ] || { echo "user tristan not found yet"; exit 1; }

    # One-time initial password (generated, in Bitwarden), temporary so the
    # first login replaces it. The realm attribute stops it ever repeating.
    if kc get realms/$R | grep -q '"homelab.initial-password.tristan"'; then
      echo "initial password already set once"
    else
      printf '{"type":"password","temporary":true,"value":"%s"}' "$(cat /secrets/initial/password)" > /tmp/pw.json
      kc update users/$U/reset-password -r $R -f /tmp/pw.json
      rm -f /tmp/pw.json
      kc update realms/$R --merge -s 'attributes."homelab.initial-password.tristan"='"$(date -u +%FT%TZ)"
      echo "set temporary initial password"
    fi

    # Prompt for whatever is missing: a passkey and TOTP. Keycloak drops each
    # action once done, and nothing is re-added after enrollment.
    norm() { tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd, -; }
    creds=$(kc get users/$U/credentials -r $R --fields type --format csv --noquotes)
    current=$(kc get users/$U -r $R --fields requiredActions | grep -o '"[A-Za-z_-]*"' | sed '/"requiredActions"/d' | tr '\n' ' ')
    want=$current
    grep -qx webauthn-passwordless <<<"$creds" || want="$want "'"webauthn-register-passwordless"'
    grep -qx otp <<<"$creds" || want="$want "'"CONFIGURE_TOTP"'
    want=$(norm <<<"$want")
    have=$(norm <<<"$current")
    if [ "$want" != "$have" ]; then
      kc update users/$U -r $R --merge -s "requiredActions=[$want]"
      echo "required actions: [$want]"
    else
      echo "required actions unchanged: [$have]"
    fi

    scopes=$(kc get client-scopes -r $R --fields name,id --format csv --noquotes)
    ensure_scopes() {
      local client=$1 kind=$2 cid have other n sid
      shift 2
      cid=$(kc get clients -r $R -q clientId="$client" -q exact=true --fields id --format csv --noquotes)
      [ -n "$cid" ] || { echo "client $client not created yet"; return 0; }
      have=$(kc get "clients/$cid/default-client-scopes" -r $R --fields name --format csv --noquotes)
      other=$(kc get "clients/$cid/optional-client-scopes" -r $R --fields name --format csv --noquotes)
      for n in "$@"; do
        grep -qx "$n" <<<"$have"$'\n'"$other" && continue
        sid=$(while IFS=, read -r name id; do if [ "$name" = "$n" ]; then echo "$id"; fi; done <<<"$scopes")
        [ -n "$sid" ] || continue # e.g. "openid" is implicit, not a scope
        kc update "clients/$cid/$kind-client-scopes/$sid" -r $R -n
        echo "client $client: added $kind scope $n"
      done
    }
    ensure_scopes actual default openid profile email groups
    ensure_scopes argo-workflows default openid profile email groups
    ensure_scopes argocd default openid profile email groups
    ensure_scopes argocd-cli default openid profile email groups
    ensure_scopes audiobookshelf default openid profile email groups abs_groups
    ensure_scopes autobrr default openid profile email groups
    ensure_scopes bifrost default openid profile email
    ensure_scopes bulwark default openid profile email
    ensure_scopes chirpstack default openid profile email groups
    ensure_scopes cli default openid profile email groups
    ensure_scopes cli optional offline_access
    ensure_scopes contextforge default openid profile email groups
    ensure_scopes dashy default openid profile email groups
    ensure_scopes e2e default openid profile email groups
    ensure_scopes forgejo default openid profile email groups
    ensure_scopes grafana default openid profile email groups
    ensure_scopes harbor default openid profile email groups
    ensure_scopes homarr default openid profile email groups
    ensure_scopes home-assistant default openid profile email groups
    ensure_scopes homepage default openid profile email
    ensure_scopes immich default openid profile email groups
    ensure_scopes jellyfin default openid profile email groups
    ensure_scopes kavita default openid profile email roles groups
    ensure_scopes kavita optional offline_access
    ensure_scopes komga default openid profile email groups
    ensure_scopes librechat default openid profile email groups
    ensure_scopes mealie default openid profile email groups
    ensure_scopes miniflux default openid profile email
    ensure_scopes oauth2-proxy default openid profile email groups
    ensure_scopes promptfoo default openid profile email
    ensure_scopes ryot default openid profile email groups
    ensure_scopes sure default openid profile email groups
    ensure_scopes toolhive default openid profile email
    ensure_scopes windmill default openid profile email groups

    # Realm-management roles for a client's service account, exactly the listed set (the account exists once the
    # operator has created the client with serviceAccountsEnabled; until then the Job fails
    # and its backoffLimit retries, so the roles are never silently skipped).
    ensure_service_roles() {
      local client=$1 r
      shift
      kc get users -r $R -q username="service-account-$client" -q exact=true --fields id --format csv --noquotes | grep -q . \
        || { echo "service account of $client not created yet"; exit 1; }
      for r in "$@"; do
        kc add-roles -r $R --uusername "service-account-$client" --cclientid realm-management --rolename "$r"
      done
      for r in $(kc get-roles -r $R --uusername "service-account-$client" --cclientid realm-management --fields name --format csv --noquotes); do
        case " $* " in
          *" $r "*) ;;
          *)
            kc remove-roles -r $R --uusername "service-account-$client" --cclientid realm-management --rolename "$r"
            echo "service account of $client: removed role $r"
            ;;
        esac
      done
      echo "service account of $client: roles $*"
    }
    ensure_service_roles e2e view-users

    group_id() {
      kc get groups -r $R -q search="$1" -q exact=true --fields id,name --format csv --noquotes | while IFS=, read -r id n; do if [ "$n" = "$1" ]; then echo "$id"; fi; done
    }
    child_id() {
      kc get "groups/$1/children" -r $R --fields id,name --format csv --noquotes | while IFS=, read -r id n; do if [ "$n" = "$2" ]; then echo "$id"; fi; done
    }
    # A subgroup of a top-level group, with attributes (a copy of a real group's, so apps map it the same).
    ensure_subgroup() {
      local parent=$1 name=$2 attrs=$3 pid sid
      pid=$(group_id "$parent")
      [ -n "$pid" ] || { echo "group $parent not created yet"; return 0; }
      sid=$(child_id "$pid" "$name")
      [ -n "$sid" ] || sid=$(kc create "groups/$pid/children" -r $R -s name="$name" -i)
      kc update "groups/$sid" -r $R --merge -s "attributes=$attrs"
      echo "group $parent/$name: attributes $attrs"
    }
    # A client policy for the client and a scope permission over the listed subgroups, replaced when they
    # differ. Needs adminPermissionsEnabled on the realm, so the Job retries until it is on.
    ensure_group_admin() {
      local client=$1 parent=$2 scopes=$3 ap cid pid base pol perm want have have_res resources n id name
      shift 3
      ap=$(kc get clients -r $R -q clientId=admin-permissions --fields id --format csv --noquotes)
      [ -n "$ap" ] || { echo "admin permissions not enabled yet"; exit 1; }
      cid=$(kc get clients -r $R -q clientId="$client" -q exact=true --fields id --format csv --noquotes)
      [ -n "$cid" ] || { echo "client $client not created yet"; exit 1; }
      pid=$(group_id "$parent")
      [ -n "$pid" ] || { echo "group $parent not created yet"; exit 1; }
      resources=""
      for n in "$@"; do
        id=$(child_id "$pid" "$n")
        [ -n "$id" ] || { echo "group $parent/$n not created yet"; exit 1; }
        resources="$resources$id"$'\n'
      done
      resources=$(sed '/^$/d' <<<"$resources" | sort | paste -sd, -)
      base="clients/$ap/authz/resource-server"
      pol=$(kc get "$base/policy" -r $R -q name="$client" --fields id,name --format csv --noquotes | while IFS=, read -r id name; do if [ "$name" = "$client" ]; then echo "$id"; fi; done)
      if [ -z "$pol" ]; then
        kc create "$base/policy/client" -r $R -s name="$client" -s type=client -s logic=POSITIVE -s "clients=[\"$cid\"]"
        echo "policy $client created"
      fi
      perm=$(kc get "$base/permission/scope" -r $R -q name="$client-$parent" --fields id,name --format csv --noquotes | while IFS=, read -r id name; do if [ "$name" = "$client-$parent" ]; then echo "$id"; fi; done)
      want=$(tr ' ' '\n' <<<"$scopes" | sort | paste -sd, -)
      if [ -n "$perm" ]; then
        have=$(kc get "$base/permission/scope/$perm/scopes" -r $R --fields name --format csv --noquotes | sort | paste -sd, -)
        have_res=$(kc get "$base/permission/scope/$perm/resources" -r $R --fields name --format csv --noquotes | sort | paste -sd, -)
        if [ "$have" = "$want" ] && [ "$have_res" = "$resources" ]; then
          echo "permission $client-$parent unchanged"
          return 0
        fi
        kc delete "$base/permission/scope/$perm" -r $R
      fi
      kc create "$base/permission/scope" -r $R -s name="$client-$parent" -s resourceType=Groups \
        -s "resources=[\"$(sed 's/,/","/g' <<<"$resources")\"]" \
        -s "scopes=[\"$(sed 's/,/","/g' <<<"$want")\"]" \
        -s "policies=[\"$client\"]"
      echo "permission $client-$parent: [$want] on [$resources]"
    }
    ensure_subgroup e2e admin '{"abs_group":["admin"],"immich_role":["admin"]}'
    ensure_subgroup e2e family '{"abs_group":["user"]}'
    ensure_group_admin e2e e2e 'view view-members manage-members manage-membership' admin family

    # Group attributes (e.g. immich_role, abs_group): the operator reports the
    # group synchronized but never applies them, so set what a keycloakGroups
    # entry declares.
    ensure_group_attrs() {
      local name=$1 want=$2 gid
      gid=$(kc get groups -r $R -q search="$name" -q exact=true --fields id,name --format csv --noquotes | while IFS=, read -r id n; do if [ "$n" = "$name" ]; then echo "$id"; fi; done)
      [ -n "$gid" ] || { echo "group $name not created yet"; return 0; }
      kc update "groups/$gid" -r $R --merge -s "attributes=$want"
      echo "group $name: attributes $want"
    }
    ensure_group_attrs admin '{"abs_group":["admin"],"immich_role":["admin"]}'
    ensure_group_attrs family '{"abs_group":["user"]}'

kind: ConfigMap
metadata:
  name: keycloak-auth
  namespace: identity
