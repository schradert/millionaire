apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: keycloak
  name: keycloak
  namespace: identity
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: keycloak
      app.kubernetes.io/instance: keycloak
      app.kubernetes.io/name: keycloak
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: keycloak
        app.kubernetes.io/instance: keycloak
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - start
            - --optimized
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-rw:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_FEATURES
              value: hostname:v2
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: keycloak.trdos.me
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_TRACING_ENABLED
              value: "true"
            - name: KC_TRACING_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4317
            - name: KC_TRACING_SAMPLER_RATIO
              value: "1.0"
          envFrom:
            - secretRef:
                name: keycloak
          image: harbor.trdos.me/library/keycloak:26.1.5-optimized-1@sha256:1345506cf728d06bae4f5a623347808349055aec49ab62bdf6a3d1fee021a5d5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
          name: keycloak
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      hostname: keycloak
      serviceAccountName: keycloak
      subdomain: keycloak
