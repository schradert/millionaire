apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-oidc
  namespace: identity
spec:
  data:
    - remoteRef:
        key: headscale/oidc/client-secret
      secretKey: secret
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: bitwarden
  target:
    template:
      data:
        client-id: headscale
        client-secret: '{{ .secret }}'
