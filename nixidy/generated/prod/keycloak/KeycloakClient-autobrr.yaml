apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakClient
metadata:
  name: autobrr
  namespace: identity
spec:
  clientSecretRef:
    create: true
    name: autobrr
  definition:
    clientId: autobrr
    defaultClientScopes:
      - openid
      - profile
      - email
      - groups
    directAccessGrantsEnabled: false
    enabled: true
    name: autobrr
    protocol: openid-connect
    publicClient: false
    redirectUris:
      - https://autobrr.trdos.me/api/auth/oidc/callback
    standardFlowEnabled: true
    webOrigins:
      - https://autobrr.trdos.me
  realmRef:
    name: default
