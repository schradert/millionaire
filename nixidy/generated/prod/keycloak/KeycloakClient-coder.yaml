apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakClient
metadata:
  name: coder
  namespace: identity
spec:
  clientSecretRef:
    create: true
    name: coder
  definition:
    clientId: coder
    defaultClientScopes:
      - openid
      - profile
      - email
      - groups
    directAccessGrantsEnabled: false
    enabled: true
    name: Coder
    protocol: openid-connect
    publicClient: false
    redirectUris:
      - https://coder.trdos.me/api/v2/users/oidc/callback
    standardFlowEnabled: true
    webOrigins:
      - https://coder.trdos.me
  realmRef:
    name: default
