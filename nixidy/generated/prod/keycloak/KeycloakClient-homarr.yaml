apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakClient
metadata:
  name: homarr
  namespace: identity
spec:
  clientSecretRef:
    create: true
    name: homarr
  definition:
    clientId: homarr
    defaultClientScopes:
      - openid
      - profile
      - email
      - groups
    directAccessGrantsEnabled: false
    enabled: true
    name: Homarr
    protocol: openid-connect
    publicClient: false
    redirectUris:
      - https://homarr.trdos.me/api/auth/callback/oidc
    standardFlowEnabled: true
    webOrigins:
      - https://homarr.trdos.me
  realmRef:
    name: default
