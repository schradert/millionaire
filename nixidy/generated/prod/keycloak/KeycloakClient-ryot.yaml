apiVersion: keycloak.hostzero.com/v1beta1
kind: KeycloakClient
metadata:
  name: ryot
  namespace: identity
spec:
  clientSecretRef:
    create: true
    name: ryot
  definition:
    clientId: ryot
    defaultClientScopes:
      - openid
      - profile
      - email
      - groups
    directAccessGrantsEnabled: false
    enabled: true
    name: Ryot
    protocol: openid-connect
    publicClient: false
    redirectUris:
      - https://ryot.trdos.me/api/auth
    standardFlowEnabled: true
    webOrigins:
      - https://ryot.trdos.me
  realmRef:
    name: default
