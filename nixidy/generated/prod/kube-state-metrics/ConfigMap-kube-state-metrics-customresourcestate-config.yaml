apiVersion: v1
data:
  config.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
      - groupVersionKind:
          group: k3s.cattle.io
          kind: ETCDSnapshotFile
          version: v1
        labelsFromPath:
          name:
          - metadata
          - name
          node:
          - spec
          - nodeName
        metricNamePrefix: etcd_snapshot_file
        metrics:
        - each:
            gauge:
              path:
              - status
              - creationTime
            type: Gauge
          help: status.creationTime of the snapshot
          name: creation_timestamp_seconds
      - groupVersionKind:
          group: volsync.backube
          kind: ReplicationSource
          version: v1alpha1
        labelsFromPath:
          name:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
        metricNamePrefix: volsync_replicationsource
        metrics:
        - each:
            info:
              labelsFromPath:
                persistentvolumeclaim:
                - spec
                - sourcePVC
            type: Info
          help: The PVC a ReplicationSource backs up (spec.sourcePVC)
          name: info
      - groupVersionKind:
          group: argoproj.io
          kind: Application
          version: v1alpha1
        labelsFromPath:
          name:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
        metricNamePrefix: argocd_application
        metrics:
        - each:
            stateSet:
              labelName: phase
              list:
              - Running
              - Terminating
              - Succeeded
              - Failed
              - Error
              path:
              - status
              - operationState
              - phase
            type: StateSet
          help: status.operationState.phase of the Application
          name: operation_phase
        - each:
            gauge:
              path:
              - status
              - operationState
              - startedAt
            type: Gauge
          help: status.operationState.startedAt of the Application
          name: operation_started_timestamp_seconds
kind: ConfigMap
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/instance: kube-state-metrics
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: kube-state-metrics
  name: kube-state-metrics-customresourcestate-config
  namespace: observability
