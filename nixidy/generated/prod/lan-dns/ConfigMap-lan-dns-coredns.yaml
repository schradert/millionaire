apiVersion: v1
data:
  Corefile: "headscale.trdos.me.:53 {\n    forward . 1.1.1.1 9.9.9.9\n    cache 300\n}\nexternal.trdos.me.:53 {\n    forward . 1.1.1.1 9.9.9.9\n    cache 300\n}\ntrdos.me.:53 {\n    errors\n    template IN A trdos.me {\n        match .*\\.trdos.me\\.$\n        answer \"{{.Name}} 60 IN A 192.168.50.241\"\n        fallthrough\n        \n    }\n    template IN AAAA trdos.me {\n        match .*\\.trdos.me\\.$\n        rcode NOERROR\n        \n    }\n    forward . 1.1.1.1 9.9.9.9\n    cache 300\n}\n.:53 {\n    errors\n    health {\n        lameduck 10s\n    }\n    ready\n    prometheus 0.0.0.0:9153\n    forward . 1.1.1.1 9.9.9.9\n    cache 300\n    loop\n    reload\n    loadbalance\n}"
kind: ConfigMap
