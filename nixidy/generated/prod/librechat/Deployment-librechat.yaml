apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: librechat
    app.kubernetes.io/instance: librechat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: librechat
  name: librechat
  namespace: ai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: librechat
      app.kubernetes.io/instance: librechat
      app.kubernetes.io/name: librechat
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: b1d346b445a4cc6bfafa54a6718e97761bf11616a01a4ff22406ebe33e31852a
      labels:
        app.kubernetes.io/controller: librechat
        app.kubernetes.io/instance: librechat
        app.kubernetes.io/name: librechat
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: ALLOW_SOCIAL_LOGIN
              value: "true"
            - name: ALLOW_SOCIAL_REGISTRATION
              value: "true"
            - name: DOMAIN_CLIENT
              value: https://chat.trdos.me
            - name: DOMAIN_SERVER
              value: https://chat.trdos.me
            - name: HOST
              value: 0.0.0.0
            - name: MONGO_URI
              value: mongodb://librechat-librechat-mongodb:27017/librechat
            - name: OPENID_ADMIN_ROLE
              value: admin
            - name: OPENID_ADMIN_ROLE_PARAMETER_PATH
              value: groups
            - name: OPENID_ADMIN_ROLE_TOKEN_KIND
              value: id
            - name: OPENID_BUTTON_LABEL
              value: Login with Keycloak
            - name: OPENID_CALLBACK_URL
              value: /oauth/openid/callback
            - name: OPENID_CLIENT_ID
              value: librechat
            - name: OPENID_ISSUER
              value: https://keycloak.trdos.me/realms/default
            - name: OPENID_SCOPE
              value: openid profile email groups
            - name: PORT
              value: "3080"
          envFrom:
            - secretRef:
                name: librechat
            - secretRef:
                name: librechat-creds-key
            - secretRef:
                name: librechat-creds-iv
            - secretRef:
                name: librechat-jwt
            - secretRef:
                name: librechat-jwt-refresh
            - secretRef:
                name: librechat-openid-session
          image: ghcr.io/danny-avila/librechat:v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
          livenessProbe:
            httpGet:
              path: /health
              port: http
          name: librechat
          ports:
            - containerPort: 3080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 3080
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /app/librechat.yaml
              name: config
              readOnly: true
              subPath: librechat.yaml
            - mountPath: /app/client/public/images
              name: uploads
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: librechat
      volumes:
        - configMap:
            name: librechat
          name: config
        - name: uploads
          persistentVolumeClaim:
            claimName: librechat
