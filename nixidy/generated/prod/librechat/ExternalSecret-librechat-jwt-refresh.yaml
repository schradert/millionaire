apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-jwt-refresh
  namespace: ai
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: JWT_REFRESH_SECRET
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: librechat-jwt-refresh
  refreshPolicy: CreatedOnce
