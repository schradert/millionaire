apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-openid-session
  namespace: ai
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: OPENID_SESSION_SECRET
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: librechat-openid-session
  refreshPolicy: CreatedOnce
