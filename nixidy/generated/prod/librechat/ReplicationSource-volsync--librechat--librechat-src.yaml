apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--librechat--librechat-src
  namespace: ai
spec:
  restic:
    copyMethod: Direct
    moverSecurityContext:
      fsGroup: 101
    pruneIntervalDays: 8
    repository: volsync--librechat--librechat
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: librechat
  trigger:
    schedule: 0 4 * * *
