apiVersion: v1
data:
  ASPNETCORE_URLS: http://+:9876
  AUTH_ENABLED: "false"
  DB_CONNECTION: sqlite
  LIBRE_TRANSLATE_URL: http://libretranslate.media.svc.cluster.local:5000
  MAX_CONCURRENT_JOBS: "1"
  RADARR_URL: http://radarr.media.svc.cluster.local
  SERVICE_TYPE: '["libretranslate"]'
  SONARR_URL: http://sonarr.media.svc.cluster.local
  SOURCE_LANGUAGES: '[{"code":"en","name":"English"}]'
  TARGET_LANGUAGES: '[{"code":"pt","name":"Portuguese"},{"code":"es","name":"Spanish"},{"code":"fr","name":"French"},{"code":"de","name":"German"}]'
  TELEMETRY_ENABLED: "false"
  TZ: Etc/UTC
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: lingarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: lingarr
  name: lingarr
  namespace: media
