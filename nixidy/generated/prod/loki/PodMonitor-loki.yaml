apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: loki
  namespace: observability
spec:
  podMetricsEndpoints:
    - interval: 1m
      port: http-metrics
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - single-binary
          - canary
          - memcached-chunks-cache
          - memcached-results-cache
    matchLabels:
      app.kubernetes.io/instance: loki
