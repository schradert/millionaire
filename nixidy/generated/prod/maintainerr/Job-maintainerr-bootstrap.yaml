apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: maintainerr-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - maintainerr
          env:
            - name: ADMIN_EMAIL
              value: t0rdos@pm.me
            - name: JELLYFIN_ADMIN_PASSWORD_FILE
              value: /secrets/jellyfin/password
            - name: JELLYFIN_ADMIN_USER
              value: admin
            - name: NTFY_PRIORITY
              value: "2"
            - name: NTFY_TOPIC
              value: media
            - name: NTFY_URL
              value: https://ntfy.trdos.me
            - name: OMBI_API_KEY_FILE
              value: /secrets/ombi/apikey
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: QBITTORRENT_PASSWORD_FILE
              value: /secrets/qbittorrent/password
            - name: RADARR_API_KEY_FILE
              value: /secrets/radarr/apikey
            - name: SONARR_API_KEY_FILE
              value: /secrets/sonarr/apikey
          image: harbor.trdos.me/library/app-bootstrap:0.26.0@sha256:5a72edc35fb941e6ffff0700f83a7ed4c1fd3198d7bc88e9d395268c8e6ae2cc
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/jellyfin
              name: jellyfin
              readOnly: true
            - mountPath: /secrets/ombi
              name: ombi
              readOnly: true
            - mountPath: /secrets/qbittorrent
              name: qbittorrent
              readOnly: true
            - mountPath: /secrets/radarr
              name: radarr
              readOnly: true
            - mountPath: /secrets/sonarr
              name: sonarr
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: jellyfin
          secret:
            secretName: jellyfin-admin
        - name: ombi
          secret:
            secretName: ombi-apikey
        - name: qbittorrent
          secret:
            secretName: qbittorrent-admin
        - name: radarr
          secret:
            secretName: radarr-apikey
        - name: sonarr
          secret:
            secretName: sonarr-apikey
