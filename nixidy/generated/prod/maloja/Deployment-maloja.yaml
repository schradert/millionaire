apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: maloja
    app.kubernetes.io/instance: maloja
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: maloja
  name: maloja
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: maloja
      app.kubernetes.io/instance: maloja
      app.kubernetes.io/name: maloja
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: b4a96244b3ec89101024148adac6f1c932aaf163fa2f05b272c54feb80f37a0c
      labels:
        app.kubernetes.io/controller: maloja
        app.kubernetes.io/instance: maloja
        app.kubernetes.io/name: maloja
    spec:
      automountServiceAccountToken: false
      containers:
        - envFrom:
            - configMapRef:
                name: maloja
            - secretRef:
                name: maloja
          image: krateng/maloja:3.2.7@sha256:8864145b0107f9edfdd6672b366deb84378f4b20ea48730206bc5a56e3f82460
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 42011
            timeoutSeconds: 5
          name: maloja
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 42011
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 80Mi
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 42011
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /mljdata
              name: data
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
        - env:
            - name: MALOJA_DATA_DIRECTORY
              value: /mljdata/users/e2e
            - name: MALOJA_NAME
              value: e2e
            - name: MALOJA_PORT
              value: "42011"
          envFrom:
            - configMapRef:
                name: maloja
            - secretRef:
                name: maloja
          image: krateng/maloja:3.2.7@sha256:8864145b0107f9edfdd6672b366deb84378f4b20ea48730206bc5a56e3f82460
          livenessProbe:
            tcpSocket:
              port: 42011
          name: maloja-e2e
          readinessProbe:
            tcpSocket:
              port: 42011
          resources:
            requests:
              cpu: 25m
              memory: 80Mi
          startupProbe:
            tcpSocket:
              port: 42011
          volumeMounts:
            - mountPath: /mljdata
              name: data
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - command:
            - python3
            - -c
            - |
              import os
              for d, keys in [("/mljdata", {"scrobbler": "KEY_0"}), ("/mljdata/users/e2e", {"scrobbler": "KEY_1"})]:
                  os.makedirs(d, exist_ok=True)
                  f = d + "/apikeys.yml"
                  try:
                      lines = [l for l in open(f).read().splitlines() if l.strip() and l.strip() != "{}"]
                  except FileNotFoundError:
                      lines = []
                  for name, var in keys.items():
                      want = name + ": " + os.environ[var]
                      if want not in lines:
                          lines = [l for l in lines if not l.startswith(name + ":")] + [want]
                  lines = [l for l in lines if not l.startswith(("multi-scrobbler:", "navidrome:"))]
                  open(f, "w").write("\n".join(lines) + "\n")
          env:
            - name: KEY_0
              valueFrom:
                secretKeyRef:
                  key: token
                  name: scrobble-maloja-tristan
            - name: KEY_1
              valueFrom:
                secretKeyRef:
                  key: token
                  name: scrobble-maloja-e2e
          image: krateng/maloja:3.2.7@sha256:8864145b0107f9edfdd6672b366deb84378f4b20ea48730206bc5a56e3f82460
          name: apikeys
          volumeMounts:
            - mountPath: /mljdata
              name: data
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
      serviceAccountName: maloja
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maloja
        - emptyDir: {}
          name: tmpfs
