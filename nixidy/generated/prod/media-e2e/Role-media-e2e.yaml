apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-e2e
  namespace: media
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
