apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--media-storage--media-audiobooks-src
  namespace: media
spec:
  restic:
    cacheAccessModes:
      - ReadWriteOnce
    copyMethod: Direct
    moverSecurityContext:
      fsGroup: 101
    pruneIntervalDays: 8
    repository: volsync--media-storage--media-audiobooks
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: media-audiobooks
  trigger:
    schedule: 0 4 * * *
