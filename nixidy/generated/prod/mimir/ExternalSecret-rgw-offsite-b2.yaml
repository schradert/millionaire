apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rgw-offsite-b2
  namespace: observability
spec:
  data:
    - remoteRef:
        key: backblaze/bucket/application_key_id
      secretKey: id
    - remoteRef:
        key: backblaze/bucket/application_key
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    template:
      data:
        RCLONE_CONFIG_B2_ACCESS_KEY_ID: '{{ .id }}'
        RCLONE_CONFIG_B2_SECRET_ACCESS_KEY: '{{ .password }}'
