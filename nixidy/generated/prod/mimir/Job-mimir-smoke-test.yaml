apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: test
  labels:
    app.kubernetes.io/component: smoke-test
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mimir
  name: mimir-smoke-test
  namespace: observability
spec:
  backoffLimit: 5
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: smoke-test
        app.kubernetes.io/instance: mimir
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: mimir
    spec:
      containers:
        - args:
            - -target=continuous-test
            - -activity-tracker.filepath=
            - -tests.smoke-test
            - -tests.write-endpoint=http://mimir-gateway.observability.svc:80
            - -tests.read-endpoint=http://mimir-gateway.observability.svc:80/prometheus
            - -tests.tenant-id=
            - -tests.write-read-series-test.num-series=1000
            - -tests.write-read-series-test.max-query-age=48h
            - -server.http-listen-port=8080
          envFrom:
            - secretRef:
                name: mimir
          image: docker.io/grafana/mimir:3.2.1@sha256:92838f113ba54230014e79bc812e57ca90bb9ebc06e665f59e4f700098c2dd04
          imagePullPolicy: IfNotPresent
          name: smoke-test
      initContainers: []
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: mimir
