apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mimir
  namespace: observability
spec:
  endpoints:
    - interval: 30s
      port: http-metrics
      relabelings:
        - action: replace
          separator: /
          sourceLabels:
            - __meta_kubernetes_namespace
            - __meta_kubernetes_service_label_app_kubernetes_io_component
          targetLabel: job
        - action: replace
          replacement: millionaire
          targetLabel: cluster
  selector:
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: NotIn
        values:
          - "false"
    matchLabels:
      app.kubernetes.io/instance: mimir
