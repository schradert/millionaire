apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: miniflux-bootstrap
  namespace: home
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - miniflux
          env:
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: KEYCLOAK_PASSWORD_FILE
              value: /secrets/keycloak/password
            - name: MINIFLUX_URL
              value: http://miniflux.home.svc.cluster.local:8080
            - name: OIDC_USERNAME
              value: tristan
            - name: USER_PASSWORD_FILE
              value: /secrets/user/password
          image: harbor.trdos.me/library/app-bootstrap:0.19.0@sha256:57f0ad275f93a239d07637c7d5144d8cb6402d7df84e62e056b664187bddda10
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
            - mountPath: /secrets/keycloak
              name: keycloak
              readOnly: true
            - mountPath: /secrets/user
              name: user
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: admin
          secret:
            secretName: miniflux-admin
        - name: keycloak
          secret:
            secretName: miniflux-keycloak-admin
        - name: user
          secret:
            secretName: miniflux-tristan
