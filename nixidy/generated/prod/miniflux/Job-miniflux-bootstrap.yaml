apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: miniflux-bootstrap
  namespace: home
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - miniflux
          env:
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: KEYCLOAK_PASSWORD_FILE
              value: /secrets/keycloak/password
            - name: MINIFLUX_URL
              value: http://miniflux.home.svc.cluster.local:8080
            - name: OIDC_USERNAME
              value: tristan
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: USER_PASSWORD_FILE
              value: /secrets/user/password
          image: harbor.trdos.me/library/app-bootstrap:0.22.1@sha256:efcaab3b2ee14c6d12e21e323ee0c59948842dd9bf75a6f2de5f07ec590cde6f
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
            - mountPath: /secrets/keycloak
              name: keycloak
              readOnly: true
            - mountPath: /secrets/user
              name: user
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: admin
          secret:
            secretName: miniflux-admin
        - name: keycloak
          secret:
            secretName: miniflux-keycloak-admin
        - name: user
          secret:
            secretName: miniflux-tristan
