apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: miniflux-tristan
  namespace: home
spec:
  data:
    - match:
        remoteRef:
          remoteKey: miniflux/tristan-password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: miniflux-tristan
