apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: mosquitto
    app.kubernetes.io/instance: mosquitto
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mosquitto
  name: mosquitto
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: mosquitto
      app.kubernetes.io/instance: mosquitto
      app.kubernetes.io/name: mosquitto
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: a60ec28da7d2a7a957aacf46dd49ea33569fcb7ac395acdd66f51f96bf1340cc
      labels:
        app.kubernetes.io/controller: mosquitto
        app.kubernetes.io/instance: mosquitto
        app.kubernetes.io/name: mosquitto
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: BIND_ADDRESS
              value: 0.0.0.0:9234
            - name: BROKER_ENDPOINT
              value: tcp://127.0.0.1:1883
          image: sapcc/mosquitto-exporter:0.8.0@sha256:241570341cd144c27ca0952255a2726a4964b7397bfed93a98707b32eb06858c
          name: exporter
        - image: eclipse-mosquitto:2.0@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
          livenessProbe:
            tcpSocket:
              port: 1883
          name: mosquitto
          readinessProbe:
            tcpSocket:
              port: 1883
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          startupProbe:
            tcpSocket:
              port: 1883
          volumeMounts:
            - mountPath: /mosquitto/config/mosquitto.conf
              name: config
              readOnly: true
              subPath: mosquitto.conf
            - mountPath: /mosquitto/data
              name: data
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: mosquitto
      volumes:
        - configMap:
            name: mosquitto
          name: config
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto
