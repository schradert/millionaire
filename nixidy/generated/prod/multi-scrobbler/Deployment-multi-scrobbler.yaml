apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: multi-scrobbler
    app.kubernetes.io/instance: multi-scrobbler
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: multi-scrobbler
  name: multi-scrobbler
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: multi-scrobbler
      app.kubernetes.io/instance: multi-scrobbler
      app.kubernetes.io/name: multi-scrobbler
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: 16550d0dece30d763c8407216693fbfbfcff7023dacbf852a51df9309804108d
      labels:
        app.kubernetes.io/controller: multi-scrobbler
        app.kubernetes.io/instance: multi-scrobbler
        app.kubernetes.io/name: multi-scrobbler
    spec:
      automountServiceAccountToken: false
      containers:
        - envFrom:
            - configMapRef:
                name: multi-scrobbler
          image: ghcr.io/foxxmd/multi-scrobbler:0.19.2@sha256:449274cb8b5b855cc361056862aed6a11e5dcc0a72e2acb279ac78edf834a1c7
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 9078
            timeoutSeconds: 5
          name: multi-scrobbler
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 9078
            timeoutSeconds: 5
          resources:
            limits:
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 9078
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /config/endpointlz.json
              name: sources
              readOnly: true
              subPath: endpointlz.json
            - mountPath: /config/jellyfin.json
              name: sources
              readOnly: true
              subPath: jellyfin.json
            - mountPath: /config/maloja.json
              name: sources
              readOnly: true
              subPath: maloja.json
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: multi-scrobbler
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: multi-scrobbler
        - name: sources
          secret:
            secretName: multi-scrobbler-config
