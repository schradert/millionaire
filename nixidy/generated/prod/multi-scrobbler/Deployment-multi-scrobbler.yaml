apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: multi-scrobbler
    app.kubernetes.io/instance: multi-scrobbler
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: multi-scrobbler
  name: multi-scrobbler
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: multi-scrobbler
      app.kubernetes.io/instance: multi-scrobbler
      app.kubernetes.io/name: multi-scrobbler
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: 8f9aadc830065ceb9be960e0a5406dddfeef671d1adeee7fa695245c04dfb091
      labels:
        app.kubernetes.io/controller: multi-scrobbler
        app.kubernetes.io/instance: multi-scrobbler
        app.kubernetes.io/name: multi-scrobbler
    spec:
      automountServiceAccountToken: false
      containers:
        - envFrom:
            - configMapRef:
                name: multi-scrobbler
            - secretRef:
                name: multi-scrobbler
            - secretRef:
                name: multi-scrobbler-jellyfin
          image: ghcr.io/foxxmd/multi-scrobbler:0.19.2@sha256:449274cb8b5b855cc361056862aed6a11e5dcc0a72e2acb279ac78edf834a1c7
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 9078
            timeoutSeconds: 1
          name: multi-scrobbler
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 9078
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 9078
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /config
              name: config
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: multi-scrobbler
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: multi-scrobbler
