apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multi-scrobbler-config
  namespace: media
spec:
  data:
    - remoteRef:
        key: jellyfin-admin
        property: password
      secretKey: jellyfin
    - remoteRef:
        key: scrobble-lz-tristan
        property: token
      secretKey: lz0
    - remoteRef:
        key: scrobble-maloja-tristan
        property: token
      secretKey: mj0
    - remoteRef:
        key: scrobble-lz-e2e
        property: token
      secretKey: lz1
    - remoteRef:
        key: scrobble-maloja-e2e
        property: token
      secretKey: mj1
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-media
  target:
    template:
      data:
        endpointlz.json: '[{"clients":["maloja"],"data":{"token":"{{ .lz0 }}","username":"tristan"},"id":"navidrome-tristan","name":"navidrome-tristan"},{"clients":["maloja-e2e"],"data":{"token":"{{ .lz1 }}","username":"e2e"},"id":"navidrome-e2e","name":"navidrome-e2e"}]'
        jellyfin.json: '[{"clients":["maloja"],"data":{"password":"{{ .jellyfin }}","url":"http://jellyfin.media.svc.cluster.local:8096","user":"admin","usersAllow":["tristan"]},"id":"jellyfin","name":"jellyfin"},{"clients":["maloja-e2e"],"data":{"password":"{{ .jellyfin }}","url":"http://jellyfin.media.svc.cluster.local:8096","user":"admin","usersAllow":["e2e"]},"id":"jellyfin-e2e","name":"jellyfin-e2e"}]'
        maloja.json: '[{"data":{"apiKey":"{{ .mj0 }}","url":"http://maloja.media.svc.cluster.local:42010"},"id":"maloja","name":"maloja"},{"data":{"apiKey":"{{ .mj1 }}","url":"http://maloja-e2e.media.svc.cluster.local:42011"},"id":"maloja-e2e","name":"maloja-e2e"}]'
