apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multi-scrobbler-jellyfin
  namespace: media
spec:
  data:
    - remoteRef:
        key: jellyfin-admin
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-media
  target:
    template:
      data:
        JELLYFIN_PASSWORD: '{{ .password }}'
