apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: navidrome-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - navidrome
          env:
            - name: ADMIN_PASSWORD_FILE
              value: /secrets/admin/password
            - name: ADMIN_USER
              value: tristan
            - name: NAVIDROME_URL
              value: http://navidrome.media.svc.cluster.local:4533
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: SCROBBLE_USERS
              value: tristan=/secrets/lz-tristan/token,e2e=/secrets/lz-e2e/token
          image: harbor.trdos.me/library/app-bootstrap:0.39.0@sha256:ac16ef9f70bc43ac22ab22f04b940c2e4ddf4008884a799a781cb141d17cf09f
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/admin
              name: admin
              readOnly: true
            - mountPath: /secrets/lz-e2e
              name: lz-e2e
              readOnly: true
            - mountPath: /secrets/lz-tristan
              name: lz-tristan
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: admin
          secret:
            secretName: navidrome-admin
        - name: lz-e2e
          secret:
            secretName: scrobble-lz-e2e
        - name: lz-tristan
          secret:
            secretName: scrobble-lz-tristan
