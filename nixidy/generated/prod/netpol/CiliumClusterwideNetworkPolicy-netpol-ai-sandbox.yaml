apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: netpol-ai-sandbox
spec:
  description: Default-deny ingress for ai-sandbox; baseline plus extraIngress only (nixidy/system/network/netpol.nix)
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - ai-sandbox
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
        - ingress
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            k8s:io.kubernetes.pod.namespace: observability
        - matchLabels:
            app.kubernetes.io/name: gatus
            k8s:io.kubernetes.pod.namespace: observability
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai-sandbox
