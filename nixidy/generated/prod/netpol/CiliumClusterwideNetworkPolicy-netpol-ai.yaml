apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: netpol-ai
spec:
  description: Default-deny ingress for ai; baseline plus extraIngress only (nixidy/system/network/netpol.nix)
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - ai
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
        - ingress
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            k8s:io.kubernetes.pod.namespace: observability
        - matchLabels:
            app.kubernetes.io/name: gatus
            k8s:io.kubernetes.pod.namespace: observability
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oauth2-proxy
            k8s:io.kubernetes.pod.namespace: identity
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: workspaces
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: e2e
            k8s:io.kubernetes.pod.namespace: e2e
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openclaw
            k8s:io.kubernetes.pod.namespace: ai-sandbox
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
