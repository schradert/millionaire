apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: netpol-identity
spec:
  description: Default-deny ingress for identity; baseline plus extraIngress only (nixidy/system/network/netpol.nix)
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - identity
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
        - ingress
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            k8s:io.kubernetes.pod.namespace: observability
        - matchLabels:
            app.kubernetes.io/name: gatus
            k8s:io.kubernetes.pod.namespace: observability
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: identity
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: stalwart
            k8s:io.kubernetes.pod.namespace: mail
        - matchLabels:
            batch.kubernetes.io/job-name: sure-bootstrap
            k8s:io.kubernetes.pod.namespace: finance
        - matchLabels:
            batch.kubernetes.io/job-name: miniflux-bootstrap
            k8s:io.kubernetes.pod.namespace: home
        - matchLabels:
            batch.kubernetes.io/job-name: ombi-bootstrap
            k8s:io.kubernetes.pod.namespace: media
        - matchLabels:
            batch.kubernetes.io/job-name: ryot-bootstrap
            k8s:io.kubernetes.pod.namespace: media
        - matchLabels:
            app.kubernetes.io/name: ombi-sync
            k8s:io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seerr
            k8s:io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
