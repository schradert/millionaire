apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: netpol-security
spec:
  description: Default-deny ingress for security; baseline plus extraIngress only (nixidy/system/network/netpol.nix)
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - security
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            k8s:io.kubernetes.pod.namespace: observability
        - matchLabels:
            app.kubernetes.io/name: gatus
            k8s:io.kubernetes.pod.namespace: observability
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security
