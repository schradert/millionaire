apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: oauth2-proxy
    app.kubernetes.io/instance: oauth2-proxy
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: oauth2-proxy
  name: oauth2-proxy
  namespace: identity
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: oauth2-proxy
      app.kubernetes.io/instance: oauth2-proxy
      app.kubernetes.io/name: oauth2-proxy
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/configMaps: 689f4c08c9eae3720f3c88342e1d0fc218ea1d9b2d391fe56cc1818624ab9dce
      labels:
        app.kubernetes.io/controller: oauth2-proxy
        app.kubernetes.io/instance: oauth2-proxy
        app.kubernetes.io/name: oauth2-proxy
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/controller: oauth2-proxy
                topologyKey: kubernetes.io/hostname
              weight: 100
      automountServiceAccountToken: false
      containers:
        - args:
            - --http-address=0.0.0.0:4180
            - --metrics-address=0.0.0.0:44180
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.trdos.me/realms/default
            - --client-id=oauth2-proxy
            - --redirect-url=https://oauth2.trdos.me/oauth2/callback
            - --cookie-domain=.trdos.me
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-name=_oauth2_proxy
            - --email-domain=*
            - --set-xauthrequest=true
            - --upstream=http://localhost:8080/
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --pass-host-header=true
            - --whitelist-domain=.trdos.me
            - --session-store-type=redis
            - --redis-connection-url=redis://oauth2-proxy-dragonfly.identity.svc.cluster.local:6379
            - --skip-jwt-bearer-tokens=true
          envFrom:
            - secretRef:
                name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          name: oauth2-proxy
          ports:
            - containerPort: 4180
              name: http
            - containerPort: 44180
              name: metrics
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 4180
            timeoutSeconds: 5
        - image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 4180
            timeoutSeconds: 5
          name: router
          ports:
            - containerPort: 8080
              name: router
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 4180
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 4180
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/default.conf
              name: routes
              readOnly: true
              subPath: default.conf
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: oauth2-proxy
      volumes:
        - configMap:
            name: oauth2-proxy
          name: routes
