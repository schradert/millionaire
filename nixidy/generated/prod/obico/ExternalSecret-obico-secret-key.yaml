apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obico-secret-key
  namespace: printing
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: SECRET_KEY
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: obico-secret-key
  refreshPolicy: CreatedOnce
