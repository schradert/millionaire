apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ombi
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ombi
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oauth2-proxy
            k8s:io.kubernetes.pod.namespace: identity
        - matchLabels:
            batch.kubernetes.io/job-name: ombi-bootstrap
        - matchLabels:
            app.kubernetes.io/name: ombi-sync
        - matchLabels:
            app.kubernetes.io/name: maintainerr
        - matchLabels:
            batch.kubernetes.io/job-name: maintainerr-bootstrap
        - matchLabels:
            app.kubernetes.io/name: media-e2e
      toPorts:
        - ports:
            - port: "3579"
              protocol: TCP
