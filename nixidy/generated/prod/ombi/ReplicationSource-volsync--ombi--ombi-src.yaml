apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--ombi--ombi-src
  namespace: media
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--ombi--ombi
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: ombi
  trigger:
    schedule: 0 4 * * *
