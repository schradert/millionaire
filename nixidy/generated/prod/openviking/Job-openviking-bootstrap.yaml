apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: openviking-bootstrap
  namespace: ai
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      containers:
        - args:
            - openviking
          env:
            - name: OPENVIKING_URL
              value: http://openviking.ai.svc.cluster.local:1933
            - name: ROOT_API_KEY_FILE
              value: /secrets/root/OPENVIKING_ROOT_API_KEY
          image: harbor.trdos.me/library/app-bootstrap:0.19.3@sha256:37e151985023c23254a71d250053f53adf74c93fa43176d6d4a9dc236efd35de
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/root
              name: root
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: openviking-bootstrap
      volumes:
        - name: root
          secret:
            secretName: openviking-root-api-key
