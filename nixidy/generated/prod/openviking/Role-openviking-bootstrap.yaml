apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openviking-bootstrap
  namespace: ai
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - openviking-agent-key
    resources:
      - secrets
    verbs:
      - get
      - patch
