apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: owncast
  namespace: media
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: OWNCAST_STREAM_KEY
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: owncast
  refreshPolicy: CreatedOnce
