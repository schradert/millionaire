apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: prometheus-klipper-exporter
    app.kubernetes.io/instance: prometheus-klipper-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: prometheus-klipper-exporter
  name: prometheus-klipper-exporter
  namespace: printing
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: prometheus-klipper-exporter
      app.kubernetes.io/instance: prometheus-klipper-exporter
      app.kubernetes.io/name: prometheus-klipper-exporter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: prometheus-klipper-exporter
        app.kubernetes.io/instance: prometheus-klipper-exporter
        app.kubernetes.io/name: prometheus-klipper-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - image: ghcr.io/scross01/prometheus-klipper-exporter:v0.16.0@sha256:2d165b67b9f0779f4c0db69c28095314c5d45f36ccf782bfc577fd105eafcf52
          livenessProbe:
            tcpSocket:
              port: metrics
          name: prometheus-klipper-exporter
          ports:
            - containerPort: 9101
              name: metrics
          readinessProbe:
            tcpSocket:
              port: metrics
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: prometheus-klipper-exporter
