apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: prometheus
  name: resilience
  namespace: observability
spec:
  groups:
    - name: resilience
      rules:
        - alert: EtcdMemberDown
          annotations:
            summary: etcd member {{ $labels.instance }} is not scrapable
          expr: up{job="kube-etcd"} == 0
          for: 3m
          labels:
            severity: critical
        - alert: EtcdNoLeader
          annotations:
            summary: etcd member {{ $labels.instance }} has no leader
          expr: etcd_server_has_leader{job="kube-etcd"} == 0
          for: 1m
          labels:
            severity: critical
        - alert: NodeNotReady
          annotations:
            summary: Node {{ $labels.node }} has been NotReady for 5m
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
        - alert: PVCAlmostFull
          annotations:
            summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is above 85% full
          expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
          for: 10m
          labels:
            severity: warning
        - alert: ContainerRestartingFrequently
          annotations:
            summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted more than 5 times in 1h
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 5m
          labels:
            severity: warning
