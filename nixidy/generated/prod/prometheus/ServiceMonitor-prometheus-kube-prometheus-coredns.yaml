apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: kube-prometheus-stack-coredns
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kube-prometheus-stack
    chart: kube-prometheus-stack-92.3.0
    heritage: Helm
    release: prometheus
  name: prometheus-kube-prometheus-coredns
  namespace: observability
spec:
  endpoints:
    - authorization:
        credentials:
          key: token
          name: prometheus-kube-prometheus-prometheus-token
        type: Bearer
      port: http-metrics
  jobLabel: jobLabel
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app: kube-prometheus-stack-coredns
      release: prometheus
