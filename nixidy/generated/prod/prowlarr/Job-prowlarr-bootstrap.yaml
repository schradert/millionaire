apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: prowlarr-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - arr
          env:
            - name: LIDARR_API_KEY_FILE
              value: /secrets/lidarr/apikey
            - name: PROWLARR_API_KEY_FILE
              value: /secrets/prowlarr/apikey
            - name: QBITTORRENT_PASSWORD_FILE
              value: /secrets/qbittorrent/password
            - name: RADARR_API_KEY_FILE
              value: /secrets/radarr/apikey
            - name: SONARR_API_KEY_FILE
              value: /secrets/sonarr/apikey
          image: harbor.trdos.me/library/app-bootstrap:0.16.1@sha256:fb113d4d3813a877ba09b8f862d94bf48816a06aac47d55a0d339bcb4f018739
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/lidarr
              name: lidarr
              readOnly: true
            - mountPath: /secrets/prowlarr
              name: prowlarr
              readOnly: true
            - mountPath: /secrets/qbittorrent
              name: qbittorrent
              readOnly: true
            - mountPath: /secrets/radarr
              name: radarr
              readOnly: true
            - mountPath: /secrets/sonarr
              name: sonarr
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: lidarr
          secret:
            secretName: lidarr-apikey
        - name: prowlarr
          secret:
            secretName: prowlarr-apikey
        - name: qbittorrent
          secret:
            secretName: qbittorrent-admin
        - name: radarr
          secret:
            secretName: radarr-apikey
        - name: sonarr
          secret:
            secretName: sonarr-apikey
