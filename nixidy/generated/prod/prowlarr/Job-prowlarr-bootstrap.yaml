apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: prowlarr-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - arr
          env:
            - name: LIDARR_API_KEY_FILE
              value: /secrets/lidarr/apikey
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PROWLARR_API_KEY_FILE
              value: /secrets/prowlarr/apikey
            - name: PROWLARR_INDEXERS
              value: '[{"definition":"1337x","name":"1337x","secrets":{},"tags":["flaresolverr"]}]'
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: QBITTORRENT_PASSWORD_FILE
              value: /secrets/qbittorrent/password
            - name: RADARR_API_KEY_FILE
              value: /secrets/radarr/apikey
            - name: SONARR_API_KEY_FILE
              value: /secrets/sonarr/apikey
          image: harbor.trdos.me/library/app-bootstrap:0.22.1@sha256:efcaab3b2ee14c6d12e21e323ee0c59948842dd9bf75a6f2de5f07ec590cde6f
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/lidarr
              name: lidarr
              readOnly: true
            - mountPath: /secrets/prowlarr
              name: prowlarr
              readOnly: true
            - mountPath: /secrets/qbittorrent
              name: qbittorrent
              readOnly: true
            - mountPath: /secrets/radarr
              name: radarr
              readOnly: true
            - mountPath: /secrets/sonarr
              name: sonarr
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: lidarr
          secret:
            secretName: lidarr-apikey
        - name: prowlarr
          secret:
            secretName: prowlarr-apikey
        - name: qbittorrent
          secret:
            secretName: qbittorrent-admin
        - name: radarr
          secret:
            secretName: radarr-apikey
        - name: sonarr
          secret:
            secretName: sonarr-apikey
