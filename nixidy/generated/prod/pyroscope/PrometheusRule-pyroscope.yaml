apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: prometheus
  name: pyroscope
  namespace: observability
spec:
  groups:
    - name: pyroscope
      rules:
        - alert: PyroscopeBucketGrowth
          annotations:
            summary: Pyroscope writes more than 3 GB/day of profile segments to the bucket (retention is unlimited by design)
          expr: sum(increase(pyroscope_segment_writer_segment_size_bytes_sum[1d])) > 3e9
          for: 1h
          labels:
            severity: info
        - alert: PyroscopeDown
          annotations:
            summary: Pyroscope has not been scraped for 15m; profiles from Alloy and the SDKs are being dropped
          expr: absent(up{namespace="observability", pod=~"pyroscope-.*"} == 1)
          for: 15m
          labels:
            severity: warning
