apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--pyroscope--pyroscope-src
  namespace: observability
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--pyroscope--pyroscope
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: data-pyroscope-0
  trigger:
    schedule: 0 4 * * *
