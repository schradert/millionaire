apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/instance: pyroscope
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pyroscope
  name: pyroscope-discovery
  namespace: observability
rules:
  - apiGroups:
      - ""
      - discovery.k8s.io
    resources:
      - endpointslices
      - endpoints
      - services
      - pods
    verbs:
      - get
      - watch
      - list
