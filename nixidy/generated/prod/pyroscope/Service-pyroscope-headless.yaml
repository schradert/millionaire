apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: all
    app.kubernetes.io/instance: pyroscope
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: pyroscope
  name: pyroscope-headless
  namespace: observability
spec:
  clusterIP: None
  ports:
    - name: http2
      port: 4040
      protocol: TCP
      targetPort: http2
    - name: grpc
      port: 9095
      protocol: TCP
      targetPort: grpc
    - name: raft
      port: 9099
      protocol: TCP
      targetPort: raft
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: all
    app.kubernetes.io/instance: pyroscope
    app.kubernetes.io/name: pyroscope
  type: ClusterIP
