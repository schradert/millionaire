apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oauth2-proxy
            k8s:io.kubernetes.pod.namespace: identity
        - matchLabels:
            batch.kubernetes.io/job-name: prowlarr-bootstrap
        - matchLabels:
            batch.kubernetes.io/job-name: sportarr-bootstrap
        - matchLabels:
            batch.kubernetes.io/job-name: kapowarr-bootstrap
        - matchLabels:
            app.kubernetes.io/name: media-e2e
        - matchLabels:
            app.kubernetes.io/name: radarr
        - matchLabels:
            app.kubernetes.io/name: sonarr
        - matchLabels:
            app.kubernetes.io/name: lidarr
        - matchLabels:
            app.kubernetes.io/name: sportarr
        - matchLabels:
            app.kubernetes.io/name: prowlarr
        - matchLabels:
            app.kubernetes.io/name: autobrr
        - matchLabels:
            app.kubernetes.io/name: maintainerr
        - matchLabels:
            app.kubernetes.io/name: bookshelf
        - matchLabels:
            app.kubernetes.io/name: bookshelf-audio
        - matchLabels:
            app.kubernetes.io/name: kapowarr
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
