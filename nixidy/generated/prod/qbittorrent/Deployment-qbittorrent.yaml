apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: qbittorrent
    app.kubernetes.io/instance: qbittorrent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qbittorrent
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: qbittorrent
      app.kubernetes.io/instance: qbittorrent
      app.kubernetes.io/name: qbittorrent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: qbittorrent
        app.kubernetes.io/instance: qbittorrent
        app.kubernetes.io/name: qbittorrent
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: BLOCK_MALICIOUS
              value: "on"
            - name: DNS_KEEP_NAMESERVER
              value: "off"
            - name: DNS_SERVER
              value: "on"
            - name: DNS_UPSTREAM_IPV6
              value: "off"
            - name: DNS_UPSTREAM_RESOLVER_TYPE
              value: DoT
            - name: FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.0.0.0/16,10.43.0.0/16
            - name: HEALTH_RESTART_VPN
              value: "on"
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: VERSION_INFORMATION
              value: "off"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: /bin/sh -c 'wget -q -O /dev/null --retry-connrefused --post-data "json={\"current_network_interface\":\"lo\",\"listen_port\":0}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: protonvpn
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: /bin/sh -c 'wget -q -O /dev/null --retry-connrefused --post-data "json={\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: wireguard
          envFrom:
            - secretRef:
                name: qbittorrent-vpn
          image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - (ip rule del table 51820; ip -6 rule del table 51820) || true
          name: gluetun
          resources:
            limits:
              devic.es/tun: 1
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /tmp
              name: tmp
        - image: ghcr.io/home-operations/qbittorrent:5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          name: qbittorrent
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          securityContext:
            runAsGroup: 65534
            runAsUser: 65534
          startupProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media/downloads
              name: media-downloads
            - mountPath: /tmp
              name: tmp
      dnsConfig:
        nameservers:
          - 127.0.0.1
      dnsPolicy: None
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - command:
            - python3
            - -c
            - |
              import base64, hashlib, hmac, json, os, re, shutil
              conf = "/config/qBittorrent/qBittorrent.conf"
              if not os.path.exists(conf):
                  os.makedirs(os.path.dirname(conf), exist_ok=True)
                  shutil.copy("/defaults/qBittorrent.conf", conf)
              pw = open("/secrets/admin/password", "rb").read().strip()
              text = open(conf).read()
              key = "WebUI\\Password_PBKDF2"
              m = re.search(r"^" + re.escape(key) + r'="?@ByteArray\(([^:]+):([^)]+)\)"?\s*$', text, re.M)
              def verifies():
                  if not m:
                      return False
                  salt = base64.b64decode(m.group(1))
                  want = base64.b64decode(m.group(2))
                  got = hashlib.pbkdf2_hmac("sha512", pw, salt, 100000, len(want))
                  return hmac.compare_digest(got, want)
              settings = json.loads(os.environ["QBT_SETTINGS"])
              if not verifies():
                  salt = os.urandom(16)
                  dk = hashlib.pbkdf2_hmac("sha512", pw, salt, 100000, 64)
                  b64 = lambda b: base64.b64encode(b).decode()
                  settings["Preferences"][key] = '"@ByteArray(%s:%s)"' % (b64(salt), b64(dk))
              lines = text.split("\n")
              for section, values in settings.items():
                  header = "[" + section + "]"
                  if header not in lines:
                      lines += ["", header]
                  start = lines.index(header) + 1
                  end = next((j for j in range(start, len(lines)) if lines[j].startswith("[")), len(lines))
                  for k, v in values.items():
                      new = k + "=" + v
                      for j in range(start, end):
                          if lines[j].startswith(k + "="):
                              lines[j] = new
                              break
                      else:
                          lines.insert(start, new)
                          end += 1
              open(conf, "w").write("\n".join(lines))
          env:
            - name: QBT_SETTINGS
              value: '{"BitTorrent":{"Session\\AnonymousModeEnabled":"true","Session\\DHTEnabled":"true","Session\\Encryption":"1","Session\\Interface":"tun0","Session\\InterfaceName":"tun0","Session\\LSDEnabled":"true","Session\\PeXEnabled":"true"},"Network":{"PortForwardingEnabled":"false"},"Preferences":{"WebUI\\AuthSubnetWhitelistEnabled":"false","WebUI\\LocalHostAuth":"false","WebUI\\UseUPnP":"false","WebUI\\Username":"admin"}}'
          image: ghcr.io/home-operations/qbittorrent:5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
          name: admin
          securityContext:
            runAsGroup: 65534
            runAsUser: 65534
          volumeMounts:
            - mountPath: /secrets/admin
              name: admin-secret
            - mountPath: /config
              name: config
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: qbittorrent
      volumes:
        - name: admin-secret
          secret:
            secretName: qbittorrent-admin
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent
        - name: media-downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - emptyDir: {}
          name: tmp
