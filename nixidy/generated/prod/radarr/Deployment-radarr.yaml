apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: radarr
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: radarr
  name: radarr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: radarr
      app.kubernetes.io/instance: radarr
      app.kubernetes.io/name: radarr
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: 0333921e57adaed95943407795882f67441fcad80c784969c4224779597bc5c4
      labels:
        app.kubernetes.io/controller: radarr
        app.kubernetes.io/instance: radarr
        app.kubernetes.io/name: radarr
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - radarr
          env:
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  key: RADARR__AUTH__APIKEY
                  name: radarr
            - name: ENABLE_ADDITIONAL_METRICS
              value: "true"
            - name: PORT
              value: "9707"
            - name: URL
              value: http://localhost:80
          image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          name: exportarr
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
        - envFrom:
            - secretRef:
                name: radarr
            - configMapRef:
                name: radarr
          image: ghcr.io/home-operations/radarr:6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          name: radarr
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media/downloads
              name: media-downloads
            - mountPath: /media/movies
              name: media-movies
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostAliases:
        - hostnames:
            - ntfy.trdos.me
          ip: 100.64.0.1
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsUser: 65534
      serviceAccountName: radarr
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr
        - name: media-downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - name: media-movies
          persistentVolumeClaim:
            claimName: media-movies
        - emptyDir: {}
          name: tmpfs
