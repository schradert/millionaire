apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/controller: recyclarr
    app.kubernetes.io/instance: recyclarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: recyclarr
  name: recyclarr
  namespace: media
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          annotations:
            checksum/configMaps: 4f643501c5d684e3a5a16876a923a475499e280433e64ac6df5131cdb701f6fa
          labels:
            app.kubernetes.io/controller: recyclarr
            app.kubernetes.io/instance: recyclarr
            app.kubernetes.io/name: recyclarr
        spec:
          automountServiceAccountToken: false
          containers:
            - args:
                - sync
              envFrom:
                - secretRef:
                    name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.3@sha256:9c6c74d52cfc6f740a5a3624aa83867e171bb70b90453ddb7a4048b8c80445f9
              name: recyclarr
              volumeMounts:
                - mountPath: /config
                  name: config
                - mountPath: /config/recyclarr.yml
                  name: config-file
                  readOnly: true
                  subPath: recyclarr.yml
                - mountPath: /config/logs
                  name: tmpfs
                  subPath: logs
                - mountPath: /config/repositories
                  name: tmpfs
                  subPath: repositories
                - mountPath: /tmp
                  name: tmpfs
                  subPath: tmp
          dnsPolicy: ClusterFirst
          enableServiceLinks: false
          hostIPC: false
          hostNetwork: false
          hostPID: false
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsUser: 1000
          serviceAccountName: recyclarr
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: recyclarr
            - configMap:
                name: recyclarr
              name: config-file
            - emptyDir: {}
              name: tmpfs
  schedule: '@daily'
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  suspend: false
