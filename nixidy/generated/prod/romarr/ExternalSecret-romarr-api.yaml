apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romarr-api
  namespace: media
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: ROMARR_API_KEY
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: romarr-api
  refreshPolicy: CreatedOnce
