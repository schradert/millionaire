apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romarr-oidc
  namespace: media
spec:
  data:
    - remoteRef:
        key: romarr
        property: client-secret
      secretKey: ROMARR_OIDC_CLIENT_SECRET
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-identity
