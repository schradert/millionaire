apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: romarr-admin
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: romarr/admin-password
        secretKey: ROMARR_PASSWORD
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: romarr-admin
