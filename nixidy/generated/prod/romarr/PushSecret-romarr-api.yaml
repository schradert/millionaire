apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: romarr-api
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: romarr/api-key
        secretKey: ROMARR_API_KEY
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: romarr-api
