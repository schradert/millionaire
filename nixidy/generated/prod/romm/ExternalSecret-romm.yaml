apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm
  namespace: media
spec:
  data:
    - remoteRef:
        key: romm-app
        property: password
      secretKey: DB_PASSWD
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: romm
        property: client-secret
      secretKey: OIDC_CLIENT_SECRET
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-identity
