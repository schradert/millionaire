apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: romm-auth
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: romm/auth-secret-key
        secretKey: ROMM_AUTH_SECRET_KEY
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: romm-auth
