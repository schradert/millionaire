apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: romm-tristan-client-token
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: romm/tristan/client-token
        secretKey: token
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: romm-tristan-client-token
