apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: romm-bootstrap
  namespace: media
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resourceNames:
      - romm-tristan-client-token
    resources:
      - secrets
    verbs:
      - get
      - patch
