apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
  name: rook-ceph-remove-osds
  namespace: storage
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 3
  template:
    spec:
      containers:
        - command:
            - /bin/sh
            - -c
            - |
              set -u
              mkdir -p /etc/ceph
              cat > /etc/ceph/ceph.conf <<EOF
              [global]
              fsid = $ROOK_FSID
              mon_host = $(echo "$ROOK_MON_ENDPOINTS" | tr ',' '\n' | cut -d= -f2 | paste -sd, -)
              EOF
              install -m 600 /etc/ceph-admin/keyring /etc/ceph/keyring
              rc=0
              for id in 7; do
                if ! ceph osd find "$id" >/dev/null 2>&1; then
                  echo "osd.$id: not in the cluster, nothing to do"
                  continue
                fi
                ceph osd out "$id"
                until ceph osd safe-to-destroy "osd.$id" >/dev/null 2>&1; do
                  echo "osd.$id: waiting for its data to migrate"
                  sleep 30
                done
                ceph osd add-noup "osd.$id"
                ceph osd down "$id"
                sleep 5
                rook ceph osd remove --osd-ids "$id" --preserve-pvc false --force-osd-removal false || rc=$?
              done
              exit $rc
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ROOK_MON_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  key: data
                  name: rook-ceph-mon-endpoints
            - name: ROOK_CEPH_USERNAME
              valueFrom:
                secretKeyRef:
                  key: ceph-username
                  name: rook-ceph-mon
            - name: ROOK_CEPH_SECRET
              valueFrom:
                secretKeyRef:
                  key: ceph-secret
                  name: rook-ceph-mon
            - name: ROOK_FSID
              valueFrom:
                secretKeyRef:
                  key: fsid
                  name: rook-ceph-mon
            - name: ROOK_CONFIG_DIR
              value: /var/lib/rook
            - name: ROOK_CEPH_CONFIG_OVERRIDE
              value: /etc/rook/config/override.conf
          image: docker.io/rook/ceph:v1.19.6@sha256:eab4005612a6d10cac3d947f9846380ea13ecd2336c7397f519f0009578329c2
          name: remove-osds
          volumeMounts:
            - mountPath: /etc/ceph
              name: ceph-conf
            - mountPath: /var/lib/rook
              name: rook-config
            - mountPath: /etc/ceph-admin
              name: admin-keyring
              readOnly: true
      restartPolicy: OnFailure
      serviceAccountName: rook-ceph-purge-osd
      volumes:
        - emptyDir: {}
          name: ceph-conf
        - emptyDir: {}
          name: rook-config
        - name: admin-keyring
          secret:
            secretName: rook-ceph-admin-keyring
