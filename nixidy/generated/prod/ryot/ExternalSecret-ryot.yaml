apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ryot
  namespace: media
spec:
  data:
    - remoteRef:
        key: ryot-app
        property: password
      secretKey: DATABASE_URL
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: ryot-admin-token
        property: password
      secretKey: ADMIN_ACCESS_TOKEN
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: ryot
        property: client-secret
      secretKey: OIDC_CLIENT_SECRET
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-identity
  target:
    template:
      data:
        DATABASE_URL: postgresql://ryot:{{ .DATABASE_URL }}@ryot-rw.media.svc.cluster.local:5432/ryot
        SERVER_ADMIN_ACCESS_TOKEN: '{{ .ADMIN_ACCESS_TOKEN }}'
        SERVER_OIDC_CLIENT_SECRET: '{{ .OIDC_CLIENT_SECRET }}'
