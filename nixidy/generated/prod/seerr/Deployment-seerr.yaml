apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: seerr
    app.kubernetes.io/instance: seerr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: seerr
  name: seerr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: seerr
      app.kubernetes.io/instance: seerr
      app.kubernetes.io/name: seerr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: seerr
        app.kubernetes.io/instance: seerr
        app.kubernetes.io/name: seerr
    spec:
      automountServiceAccountToken: false
      containers:
        - image: ghcr.io/seerr-team/seerr:develop@sha256:e49a2f222e48c7ccc30103b51cace3ef47111f57c251bca0366f2abf7e6f831e
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5055
            timeoutSeconds: 1
          name: seerr
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5055
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 5055
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /app/config
              name: config
        - env:
            - name: ADMIN_GROUPS
              value: admin
            - name: AUTH_URL
              value: http://oauth2-proxy.identity.svc.cluster.local:4180/oauth2/auth
            - name: FAMILY_GROUPS
              value: family
            - name: SETTINGS_FILE
              value: /app/config/settings.json
            - name: SSO_KEY_FILE
              value: /secrets/key/password
            - name: UPSTREAM
              value: http://127.0.0.1:5055
          image: harbor.trdos.me/library/seerr-sso:0.1.0@sha256:ff796b3bd5c1d544c740bd4737a5c15cbc5a3b33f67a990383ef2a337853ffb3
          livenessProbe:
            tcpSocket:
              port: 5056
          name: sso
          ports:
            - containerPort: 5056
              name: sso
          readinessProbe:
            tcpSocket:
              port: 5056
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          startupProbe:
            tcpSocket:
              port: 5056
          volumeMounts:
            - mountPath: /app/config
              name: config
              readOnly: true
            - mountPath: /secrets/key
              name: sso-key
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: seerr
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr
        - name: sso-key
          secret:
            secretName: seerr-sso-key
