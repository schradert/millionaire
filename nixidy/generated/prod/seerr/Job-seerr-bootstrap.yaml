apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: seerr-bootstrap
  namespace: media
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - seerr
          env:
            - name: ADMIN_EMAIL
              value: t0rdos@pm.me
            - name: JELLYFIN_ADMIN_PASSWORD_FILE
              value: /secrets/jellyfin/password
            - name: JELLYFIN_ADMIN_USER
              value: admin
            - name: JELLYFIN_HOST
              value: jellyfin.media.svc.cluster.local
            - name: JELLYFIN_PORT
              value: "8096"
            - name: RADARR_API_KEY_FILE
              value: /secrets/radarr/apikey
            - name: RADARR_PROFILE
              value: '[SQP] SQP-1 WEB (2160p)'
            - name: SEERR_URL
              value: http://seerr.media.svc.cluster.local:5055
            - name: SONARR_API_KEY_FILE
              value: /secrets/sonarr/apikey
            - name: SONARR_PROFILE
              value: WEB-1080p
          image: harbor.trdos.me/library/app-bootstrap:0.19.3@sha256:37e151985023c23254a71d250053f53adf74c93fa43176d6d4a9dc236efd35de
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /secrets/jellyfin
              name: jellyfin
              readOnly: true
            - mountPath: /secrets/radarr
              name: radarr
              readOnly: true
            - mountPath: /secrets/sonarr
              name: sonarr
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: jellyfin
          secret:
            secretName: jellyfin-admin
        - name: radarr
          secret:
            secretName: radarr-apikey
        - name: sonarr
          secret:
            secretName: sonarr-apikey
