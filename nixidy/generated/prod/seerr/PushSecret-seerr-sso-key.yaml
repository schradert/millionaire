apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: seerr-sso-key
  namespace: media
spec:
  data:
    - match:
        remoteRef:
          remoteKey: seerr/sso-key
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: seerr-sso-key
