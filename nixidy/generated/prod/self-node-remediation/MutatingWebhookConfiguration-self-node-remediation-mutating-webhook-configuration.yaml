apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: medik8s/self-node-remediation-serving-cert
  labels:
    self-node-remediation-operator: ""
  name: self-node-remediation-mutating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: self-node-remediation-webhook-service
        namespace: medik8s
        path: /mutate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationtemplate
    failurePolicy: Ignore
    name: mselfnoderemediationtemplate.kb.io
    rules:
      - apiGroups:
          - self-node-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - selfnoderemediationtemplates
    sideEffects: None
