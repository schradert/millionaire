apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    self-node-remediation-operator: ""
  name: self-node-remediation-leader-election-role
  namespace: medik8s
rules:
  - apiGroups:
      - ""
      - coordination.k8s.io
    resources:
      - configmaps
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
