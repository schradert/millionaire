apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: self-node-remediation
  namespace: medik8s
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 1m
      path: /metrics
      port: https
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
