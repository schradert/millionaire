apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: medik8s/self-node-remediation-serving-cert
  labels:
    self-node-remediation-operator: ""
  name: self-node-remediation-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: self-node-remediation-webhook-service
        namespace: medik8s
        path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediation
    failurePolicy: Ignore
    name: vselfnoderemediation.kb.io
    rules:
      - apiGroups:
          - self-node-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - selfnoderemediations
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: self-node-remediation-webhook-service
        namespace: medik8s
        path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationconfig
    failurePolicy: Ignore
    name: vselfnoderemediationconfig.kb.io
    rules:
      - apiGroups:
          - self-node-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - selfnoderemediationconfigs
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: self-node-remediation-webhook-service
        namespace: medik8s
        path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationtemplate
    failurePolicy: Ignore
    name: vselfnoderemediationtemplate.kb.io
    rules:
      - apiGroups:
          - self-node-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - selfnoderemediationtemplates
    sideEffects: None
