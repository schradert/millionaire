apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: shoko
    app.kubernetes.io/instance: shoko
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: shoko
  name: shoko
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: shoko
      app.kubernetes.io/instance: shoko
      app.kubernetes.io/name: shoko
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: shoko
        app.kubernetes.io/instance: shoko
        app.kubernetes.io/name: shoko
    spec:
      automountServiceAccountToken: false
      containers:
        - image: shokoanime/server:v5.3.3@sha256:b841f8249c9edfba102e4072e2b2a3eae4179e5dd553f29e11b9898a44f1e836
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8111
            timeoutSeconds: 5
          name: shoko
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8111
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 40m
              memory: 368Mi
          startupProbe:
            failureThreshold: 120
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8111
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /home/shoko/.shoko
              name: config
            - mountPath: /media/tv
              name: media-tv
              readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: shoko
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shoko
        - name: media-tv
          persistentVolumeClaim:
            claimName: media-tv
