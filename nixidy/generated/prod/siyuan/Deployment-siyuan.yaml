apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: siyuan
    app.kubernetes.io/instance: siyuan
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: siyuan
  name: siyuan
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: siyuan
      app.kubernetes.io/instance: siyuan
      app.kubernetes.io/name: siyuan
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: siyuan
        app.kubernetes.io/instance: siyuan
        app.kubernetes.io/name: siyuan
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - serve
            - --workspace=/siyuan/workspace
          command:
            - /opt/siyuan/kernel
          env:
            - name: PGID
              value: "0"
            - name: PUID
              value: "0"
            - name: SIYUAN_ACCESS_AUTH_CODE_BYPASS
              value: "true"
            - name: TZ
              value: America/Los_Angeles
          image: b3log/siyuan:v3.8.6@sha256:b528a08f75936f19ee647c46c55c4d6924bdd93e30941128e468187bcfbc772d
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 6806
            timeoutSeconds: 5
          name: siyuan
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 6806
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          startupProbe:
            failureThreshold: 120
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 6806
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /siyuan/workspace
              name: workspace
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: siyuan
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: siyuan
