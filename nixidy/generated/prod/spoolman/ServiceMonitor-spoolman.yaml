apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: spoolman
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: spoolman
  name: spoolman
  namespace: printing
spec:
  endpoints:
    - interval: 1m
      path: /metrics
      port: http
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - printing
  selector:
    matchLabels:
      app.kubernetes.io/instance: spoolman
      app.kubernetes.io/name: spoolman
      app.kubernetes.io/service: spoolman
