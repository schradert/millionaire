apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sportarr
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sportarr
  ingress:
    - fromEntities:
        - host
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oauth2-proxy
            k8s:io.kubernetes.pod.namespace: identity
        - matchLabels:
            app.kubernetes.io/name: prowlarr
        - matchLabels:
            batch.kubernetes.io/job-name: sportarr-bootstrap
        - matchLabels:
            app.kubernetes.io/name: media-e2e
        - matchLabels:
            app.kubernetes.io/name: gatus
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "1867"
              protocol: TCP
