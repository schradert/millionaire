apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sportarr
  namespace: media
spec:
  data:
    - remoteRef:
        key: sportarr-apikey
        property: apikey
      secretKey: Sportarr__ApiKey
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
