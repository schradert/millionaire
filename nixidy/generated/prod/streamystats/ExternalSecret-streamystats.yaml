apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats
  namespace: media
spec:
  data:
    - remoteRef:
        key: streamystats-app
        property: password
      secretKey: db
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: streamystats-session
        property: secret
      secretKey: session
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: streamystats-internal
        property: secret
      secretKey: internal
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: streamystats-actions
        property: secret
      secretKey: actions
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
  target:
    template:
      data:
        DATABASE_URL: postgresql://streamystats:{{ .db }}@streamystats-rw.media.svc.cluster.local:5432/streamystats
        INTERNAL_API_KEY: '{{ .internal }}'
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: '{{ .actions }}'
        SESSION_SECRET: '{{ .session }}'
