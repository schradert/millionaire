apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: streamystats
  namespace: media
spec:
  configuration:
    data:
      compression: gzip
    destinationPath: s3://trdos-me--volsync/cnpg/streamystats/
    endpointURL: https://s3.us-west-004.backblazeb2.com
    s3Credentials:
      accessKeyId:
        key: ACCESS_KEY_ID
        name: streamystats-b2-postgres
      secretAccessKey:
        key: ACCESS_SECRET_KEY
        name: streamystats-b2-postgres
    wal:
      compression: gzip
  retentionPolicy: 30d
