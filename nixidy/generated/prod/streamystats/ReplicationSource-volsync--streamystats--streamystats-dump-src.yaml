apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--streamystats--streamystats-dump-src
  namespace: media
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--streamystats--streamystats-dump
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: streamystats-dump
  trigger:
    schedule: 0 4 * * *
