apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: sure-bootstrap
  namespace: finance
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - ./bin/rails
            - runner
            - |
              email = ENV.fetch("ADMIN_EMAIL").strip.downcase
              first, last = ENV.fetch("ADMIN_NAME").split(" ", 2)
              User.transaction do
                if User.find_by(email: email)
                  puts "sure-bootstrap: user exists, nothing to do"
                else
                  User.create!(
                    email: email, first_name: first, last_name: last,
                    password: ENV.fetch("ADMIN_PASSWORD"),
                    family: Family.create!, role: :super_admin
                  )
                  puts "sure-bootstrap: created super_admin"
                end
              end
          env:
            - name: ADMIN_EMAIL
              value: t0rdos@pm.me
            - name: ADMIN_NAME
              value: Tristan Schrader
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: sure-admin
          envFrom:
            - configMapRef:
                name: sure
            - secretRef:
                name: sure
          image: ghcr.io/we-promise/sure:stable@sha256:665adde4e60f1695936f880185f6bd4abd30b53866244edc132bfaff9d5bbde8
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
