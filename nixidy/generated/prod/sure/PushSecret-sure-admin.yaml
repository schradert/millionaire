apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sure-admin
  namespace: finance
spec:
  data:
    - match:
        remoteRef:
          remoteKey: sure/admin-password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: sure-admin
