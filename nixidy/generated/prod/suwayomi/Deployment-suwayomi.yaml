apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/controller: suwayomi
    app.kubernetes.io/instance: suwayomi
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: suwayomi
  name: suwayomi
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: suwayomi
      app.kubernetes.io/instance: suwayomi
      app.kubernetes.io/name: suwayomi
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: suwayomi
        app.kubernetes.io/instance: suwayomi
        app.kubernetes.io/name: suwayomi
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: AUTH_MODE
              value: none
            - name: BIND_PORT
              value: "4567"
            - name: DOWNLOAD_AS_CBZ
              value: "true"
            - name: EXTENSION_STORES
              value: '[]'
            - name: FLARESOLVERR_ENABLED
              value: "true"
            - name: FLARESOLVERR_URL
              value: http://flaresolverr.media.svc.cluster.local:8191
            - name: KCEF_ENABLED
              value: "false"
            - name: MAX_SOURCES_IN_PARALLEL
              value: "3"
            - name: TZ
              value: America/Los_Angeles
            - name: WEB_UI_ENABLED
              value: "true"
          image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366@sha256:1fac27c387dc2ea9949e1a01ad7f6d6de9d72d3988338a95476748e5c45c4582
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 4567
            timeoutSeconds: 1
          name: suwayomi
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 4567
            timeoutSeconds: 1
          resources:
            limits:
              memory: 1536Mi
            requests:
              cpu: 20m
              memory: 384Mi
          startupProbe:
            failureThreshold: 60
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 4567
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /home/suwayomi/.local/share/Tachidesk
              name: data
            - mountPath: /home/suwayomi/.local/share/Tachidesk/downloads
              name: media-manga
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
      serviceAccountName: suwayomi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: suwayomi
        - name: media-manga
          persistentVolumeClaim:
            claimName: media-manga
