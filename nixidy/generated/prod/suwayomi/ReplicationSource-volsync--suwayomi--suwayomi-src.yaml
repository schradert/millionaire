apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--suwayomi--suwayomi-src
  namespace: media
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--suwayomi--suwayomi
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: suwayomi
  trigger:
    schedule: 0 4 * * *
