apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--sync-storage--sync-docs-src
  namespace: home
spec:
  restic:
    cacheAccessModes:
      - ReadWriteOnce
    copyMethod: Direct
    moverSecurityContext:
      fsGroup: 101
    pruneIntervalDays: 8
    repository: volsync--sync-storage--sync-docs
    retain:
      daily: 7
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: sync-docs
  trigger:
    schedule: 30 3 * * *
