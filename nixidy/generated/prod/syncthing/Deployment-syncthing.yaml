apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: syncthing
    app.kubernetes.io/instance: syncthing
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: syncthing
  name: syncthing
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: syncthing
      app.kubernetes.io/instance: syncthing
      app.kubernetes.io/name: syncthing
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: syncthing
        app.kubernetes.io/instance: syncthing
        app.kubernetes.io/name: syncthing
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: STGUIADDRESS
              value: 0.0.0.0:8384
            - name: STNODEFAULTFOLDER
              value: "true"
          envFrom:
            - secretRef:
                name: syncthing
          image: syncthing/syncthing:1.29@sha256:dde2305f0b78260a66e4a12785f0e26d86e89276ffccf50209c34943f270a954
          livenessProbe:
            httpGet:
              path: /rest/noauth/health
              port: http
          name: syncthing
          ports:
            - containerPort: 8384
              name: http
            - containerPort: 22000
              name: sync
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /rest/noauth/health
              port: http
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /rest/noauth/health
              port: http
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/syncthing/org
              name: org-files
            - mountPath: /var/syncthing
              name: state
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      initContainers:
        - command:
            - sh
            - -ec
            - install -d -o 1000 -g 101 -m 2770 /var/syncthing/config && install -o 1000 -g 101 -m 0664 /identity/tls.crt /var/syncthing/config/cert.pem && install -o 1000 -g 101 -m 0660 /identity/tls.key /var/syncthing/config/key.pem
          image: syncthing/syncthing:1.29@sha256:dde2305f0b78260a66e4a12785f0e26d86e89276ffccf50209c34943f270a954
          name: identity
          volumeMounts:
            - mountPath: /identity
              name: identity
              readOnly: true
            - mountPath: /var/syncthing
              name: state
      serviceAccountName: syncthing
      volumes:
        - name: identity
          secret:
            secretName: syncthing-identity
        - name: org-files
          persistentVolumeClaim:
            claimName: org-files
        - name: state
          persistentVolumeClaim:
            claimName: syncthing
