apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing
  namespace: home
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: STGUIAPIKEY
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: syncthing
  refreshPolicy: CreatedOnce
