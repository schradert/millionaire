apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: syncthing-bootstrap
  namespace: home
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - syncthing
          env:
            - name: API_KEY_FILE
              value: /secrets/api/STGUIAPIKEY
            - name: DEVICES
              value: '[]'
            - name: FOLDERS
              value: '[{"devices":[],"id":"chiaki","ignorePerms":true,"label":"chiaki-ng","path":"/var/syncthing/saves/chiaki","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"7776000"},"type":"staggered"}},{"devices":[],"id":"documents","ignorePerms":true,"label":"Documents","path":"/var/syncthing/docs/documents","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"2592000"},"type":"staggered"}},{"devices":[],"id":"downloads-keep","ignorePerms":true,"label":"Downloads to keep","path":"/var/syncthing/docs/downloads-keep","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"2592000"},"type":"staggered"}},{"devices":[],"id":"ludusavi","ignorePerms":true,"label":"Ludusavi backups","path":"/var/syncthing/saves/ludusavi","type":"receiveonly","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"7776000"},"type":"staggered"}},{"devices":[],"id":"org","ignorePerms":true,"label":"Org","path":"/var/syncthing/org","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"2592000"},"type":"staggered"}},{"devices":[],"id":"saves-cemu","ignorePerms":true,"label":"Cemu saves","path":"/var/syncthing/saves/cemu","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"7776000"},"type":"staggered"}},{"devices":[],"id":"saves-duckstation","ignorePerms":true,"label":"DuckStation memory cards","path":"/var/syncthing/saves/duckstation","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"7776000"},"type":"staggered"}},{"devices":[],"id":"saves-retroarch","ignorePerms":true,"label":"RetroArch saves","path":"/var/syncthing/saves/retroarch","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"7776000"},"type":"staggered"}},{"devices":[],"id":"sensitive","ignorePerms":true,"label":"Sensitive documents","path":"/var/syncthing/docs/sensitive","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"31536000"},"type":"staggered"}},{"devices":[],"id":"states-retroarch","ignorePerms":true,"label":"RetroArch states","path":"/var/syncthing/saves/retroarch-states","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"2592000"},"type":"staggered"}},{"devices":[],"id":"steam-input","ignorePerms":true,"label":"Steam Input layouts","path":"/var/syncthing/saves/steam-input","type":"receiveonly","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"7776000"},"type":"staggered"}},{"devices":[],"id":"wow-interface","ignorePerms":true,"label":"WoW Interface","path":"/var/syncthing/saves/wow-interface","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"7776000"},"type":"staggered"}},{"devices":[],"id":"wow-wtf","ignorePerms":true,"label":"WoW WTF","path":"/var/syncthing/saves/wow-wtf","type":"sendreceive","versioning":{"cleanupIntervalS":3600,"fsPath":"","fsType":"basic","params":{"cleanInterval":"3600","maxAge":"7776000"},"type":"staggered"}}]'
            - name: HUB_DEVICE_ID
              value: WHD56GJ-S5XJMEV-PJNFHRL-7XZKKIE-IONK2R2-ZIQEN3P-JSQKR77-GLFEDQE
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc.cluster.local:4318
            - name: PYROSCOPE_SAMPLE_RATE
              value: "1000"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope.observability.svc.cluster.local:4040
            - name: SYNCTHING_URL
              value: http://syncthing.home.svc.cluster.local:8384
          image: harbor.trdos.me/library/app-bootstrap:0.21.0@sha256:c9c03ae43d7502edf415eff12c7e2b8c8206d0b3ff5b80e9c08d6142a6e9bb53
          name: bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /secrets/api
              name: api
              readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
        - name: api
          secret:
            secretName: syncthing
