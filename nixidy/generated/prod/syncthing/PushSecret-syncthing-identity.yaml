apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: syncthing-identity
  namespace: home
spec:
  data:
    - match:
        remoteRef:
          remoteKey: syncthing/hub/cert
        secretKey: tls.crt
    - match:
        remoteRef:
          remoteKey: syncthing/hub/key
        secretKey: tls.key
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: syncthing-identity
