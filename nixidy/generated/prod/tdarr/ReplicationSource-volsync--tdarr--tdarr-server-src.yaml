apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--tdarr--tdarr-server-src
  namespace: media
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--tdarr--tdarr-server
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: tdarr-server
  trigger:
    schedule: 0 4 * * *
