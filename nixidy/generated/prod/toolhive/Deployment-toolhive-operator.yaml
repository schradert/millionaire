apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: toolhive
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: toolhive-operator
    app.kubernetes.io/part-of: toolhive-operator
  name: toolhive-operator
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: toolhive
      app.kubernetes.io/name: toolhive-operator
      app.kubernetes.io/part-of: toolhive-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: toolhive
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: toolhive-operator
        app.kubernetes.io/part-of: toolhive-operator
    spec:
      containers:
        - args:
            - --leader-elect
          env:
            - name: GOMEMLIMIT
              value: 150MiB
            - name: GOGC
              value: "75"
            - name: UNSTRUCTURED_LOGS
              value: "false"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TOOLHIVE_USE_CONFIGMAP
              value: "true"
            - name: ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            - name: TOOLHIVE_RUNNER_IMAGE
              value: ghcr.io/stacklok/toolhive/proxyrunner:v0.6.9@sha256:a01c65ac3d483ccef09c2b14c1b21869da6df2c84f567407239c5d8fe0e74bfd
            - name: VMCP_IMAGE
              value: ghcr.io/stacklok/toolhive/vmcp:v0.6.9@sha256:cb0e15caaae57fee1339f56a3b1a9c9bd270341e15ca6e98687b02c8ebecdc7c
            - name: TOOLHIVE_PROXY_HOST
              value: 0.0.0.0
            - name: TOOLHIVE_REGISTRY_API_IMAGE
              value: ghcr.io/stacklok/thv-registry-api:v0.3.1@sha256:25145c07157cc2234eeebb87a6c22320e0f01823b366c0cad3b4be44c0c8049f
          image: ghcr.io/stacklok/toolhive/operator:v0.6.9@sha256:939104f6f0a841376f0e3ebaf874c052dd5c3d7e46573866ff71aaf25ca6aa48
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
      serviceAccountName: toolhive-operator
      terminationGracePeriodSeconds: 10
