apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: toolhive
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: toolhive-operator
    app.kubernetes.io/part-of: toolhive-operator
  name: toolhive-operator
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: toolhive
      app.kubernetes.io/name: toolhive-operator
      app.kubernetes.io/part-of: toolhive-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: toolhive
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: toolhive-operator
        app.kubernetes.io/part-of: toolhive-operator
    spec:
      containers:
        - args:
            - --leader-elect
          env:
            - name: GOMEMLIMIT
              value: 110MiB
            - name: GOGC
              value: "75"
            - name: UNSTRUCTURED_LOGS
              value: "false"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TOOLHIVE_USE_CONFIGMAP
              value: "true"
            - name: ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            - name: TOOLHIVE_ENABLE_STORAGE_VERSION_MIGRATOR
              value: "true"
            - name: TOOLHIVE_RUNNER_IMAGE
              value: ghcr.io/stacklok/toolhive/proxyrunner:v0.51.4@sha256:f0365f37e4d90aa78b7ea74d93b7db5f5edc02ba294816a672e89a9add824f47
            - name: VMCP_IMAGE
              value: ghcr.io/stacklok/toolhive/vmcp:v0.51.4@sha256:8b9165d12a6baab604267687415b32aa6ece516e1daf3ecfe1b54abb37576382
            - name: TOOLHIVE_PROXY_HOST
              value: 0.0.0.0
            - name: TOOLHIVE_REGISTRY_API_IMAGE
              value: ghcr.io/stacklok/thv-registry-api:v1.5.2@sha256:f33adce047d04d0ff793f9794fae2faf8afe5b7e37905a17c6c7a3fd1f307d56
          image: ghcr.io/stacklok/toolhive/operator:v0.51.4@sha256:01d8f1c9e432df7034ac2fd27488aed787914d155caa5b14f43ed4b1db4014ce
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
      serviceAccountName: toolhive-operator
      terminationGracePeriodSeconds: 10
