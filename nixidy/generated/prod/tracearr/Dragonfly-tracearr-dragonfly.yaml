apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: tracearr-dragonfly
  namespace: media
spec:
  args:
    - --proactor_threads
    - "1"
    - --default_lua_flags=allow-undeclared-keys
  replicas: 1
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 25m
      memory: 256Mi
