apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-auth
  namespace: media
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: secret
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tracearr-auth
  refreshPolicy: CreatedOnce
