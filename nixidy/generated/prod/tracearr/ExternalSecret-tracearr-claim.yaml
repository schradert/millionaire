apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-claim
  namespace: media
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: code
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tracearr-claim
  refreshPolicy: CreatedOnce
