apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-postgres
  namespace: media
spec:
  data:
    - remoteRef:
        key: tracearr-db
        property: password
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
  target:
    template:
      data:
        POSTGRES_DB: tracearr
        POSTGRES_PASSWORD: '{{ .password }}'
        POSTGRES_USER: tracearr
