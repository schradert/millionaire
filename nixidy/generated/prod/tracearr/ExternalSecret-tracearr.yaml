apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr
  namespace: media
spec:
  data:
    - remoteRef:
        key: tracearr-db
        property: password
      secretKey: db
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: tracearr-jwt
        property: secret
      secretKey: jwt
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: tracearr-cookie
        property: secret
      secretKey: cookie
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: tracearr-auth
        property: secret
      secretKey: auth
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: tracearr-claim
        property: code
      secretKey: claim
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-media
    - remoteRef:
        key: tracearr
        property: client-secret
      secretKey: oidc
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: kubernetes-identity
  target:
    template:
      data:
        BETTER_AUTH_SECRET: '{{ .auth }}'
        CLAIM_CODE: '{{ .claim }}'
        COOKIE_SECRET: '{{ .cookie }}'
        DATABASE_URL: postgres://tracearr:{{ .db }}@tracearr-db.media.svc.cluster.local:5432/tracearr
        JWT_SECRET: '{{ .jwt }}'
        OIDC_CLIENT_SECRET: '{{ .oidc }}'
