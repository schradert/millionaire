apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/instance: tracearr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tracearr
  name: tracearr
  namespace: media
spec:
  hostnames:
    - tracearr.trdos.me
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: tracearr
          namespace: media
          port: 3000
          weight: 1
