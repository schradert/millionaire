apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: volsync--tracearr--tracearr-backup-src
  namespace: media
spec:
  restic:
    copyMethod: Direct
    pruneIntervalDays: 8
    repository: volsync--tracearr--tracearr-backup
    retain:
      daily: 1
      monthly: 1
      weekly: 1
      yearly: 1
  sourcePVC: tracearr-backup
  trigger:
    schedule: 0 4 * * *
