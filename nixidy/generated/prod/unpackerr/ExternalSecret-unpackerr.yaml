apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr
  namespace: media
spec:
  data:
    - remoteRef:
        key: lidarr-apikey
        property: apikey
      secretKey: UN_LIDARR_0_API_KEY
    - remoteRef:
        key: radarr-apikey
        property: apikey
      secretKey: UN_RADARR_0_API_KEY
    - remoteRef:
        key: sonarr-apikey
        property: apikey
      secretKey: UN_SONARR_0_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-media
