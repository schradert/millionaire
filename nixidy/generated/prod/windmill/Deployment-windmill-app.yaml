apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: windmill-app
    app.kubernetes.io/name: windmill-app
    chart: windmill-4.0.280
    heritage: Helm
    release: windmill
  name: windmill-app
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: windmill-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app: windmill-app
        app.kubernetes.io/name: windmill-app
        release: windmill
    spec:
      containers:
        - env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: windmill-db
            - name: BASE_URL
              value: https://windmill.trdos.me
            - name: RUST_LOG
              value: info
            - name: MODE
              value: server
            - name: JSON_FMT
              value: "true"
          image: ghcr.io/windmill-labs/windmill:1.828.0@sha256:180e400cd76b2253098875d9f28a9171c7d344eef93b0888070deb23539ce46b
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 30
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /api/version
              port: 8000
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
          name: windmill-app
          ports:
            - containerPort: 8000
            - containerPort: 8001
          readinessProbe:
            failureThreshold: 1
            httpGet:
              httpHeaders:
                - name: Host
                  value: localhost
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 2Gi
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /api/version
              port: 8000
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      serviceAccountName: windmill
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: windmill-app
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
