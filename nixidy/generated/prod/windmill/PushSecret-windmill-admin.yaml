apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: windmill-admin
  namespace: development
spec:
  data:
    - match:
        remoteRef:
          remoteKey: windmill/admin-password
        secretKey: password
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: windmill-admin
