apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/controller: zwave-js-ui
    app.kubernetes.io/instance: zwave-js-ui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: zwave-js-ui
  name: zwave-js-ui
  namespace: home
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/controller: zwave-js-ui
      app.kubernetes.io/instance: zwave-js-ui
      app.kubernetes.io/name: zwave-js-ui
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/configMaps: 4b91d6254ad7b73319a9ebed538cb84995e746de19fb115d9e0a3b9ef5d407f5
      labels:
        app.kubernetes.io/controller: zwave-js-ui
        app.kubernetes.io/instance: zwave-js-ui
        app.kubernetes.io/name: zwave-js-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - image: zwavejs/zwave-js-ui:11.24.3@sha256:3fef66d575ea0ea9d50aad3e05c36619228557cfa888557eac2035215a29a321
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8091
            timeoutSeconds: 5
          name: zwave-js-ui
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8091
            timeoutSeconds: 5
          resources:
            limits:
              devic.es/zwave: 1
          startupProbe:
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: 8091
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /usr/src/app/store/settings.json
              name: settings
              subPath: settings.json
            - mountPath: /usr/src/app/store
              name: store
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: zwave-js-ui
      volumes:
        - configMap:
            name: zwave-js-ui
          name: settings
        - name: store
          persistentVolumeClaim:
            claimName: zwave-js-ui
